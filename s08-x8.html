#pane-lab .btn{font-size:0.875rem;font-weight:500;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-height:38px;cursor:pointer;transition:background .15s,border-color .15s}

}

<!-- 1 -->
<section class="chapter" id="ch1">
 <div class="wrap">
  <p class="chap-no">บทที่ 01</p>
  <h2>nucleotide subunit ของ nucleic acid<small>phosphate + pentose sugar + nitrogenous base</small></h2>
  <p class="intro">สารพันธุกรรมเรียกว่า nucleic acid มี 2 ชนิดคือ DNA และ RNA พบใน nucleus mitochondria และ chloroplast ดูว่าชิ้นส่วนทั้ง 3 ประกอบกันอย่างไร แล้วสลับดูความต่างระหว่าง DNA กับ RNA</p>
  <div class="stage">
   <div class="cv-box"><canvas id="cvNuc" aria-label="แอนิเมชันการประกอบ nucleotide"></canvas></div>
   <div class="ctrl">
    <button class="btn" id="nucDNA" aria-pressed="true">DNA</button>
    <button class="btn" id="nucRNA" aria-pressed="false">RNA</button>
    <span class="sp"></span>
    <button class="btn icon" data-play="nuc" aria-label="หยุด/เล่น">❚❚</button>
   </div>
  </div>
  <div class="notes">
   <div class="note"><h4>base 2 กลุ่ม</h4>
    <ul>
     <li><b>purine</b> (วงแหวน 2 วง): <span class="k bA">A</span> อะดีนีน, <span class="k bG">G</span> กัวนีน</li>
     <li><b>pyrimidine</b> (วงแหวน 1 วง): <span class="k bC">C</span> ไซโทซีน, <span class="k bT">T</span> ไทมีน (DNA), <span class="k bU">U</span> ยูราซิล (RNA)</li>
    </ul>
   </div>
   <div class="note"><h4>จุดสังเกตบน sugar</h4>
    <ul>
     <li>carbon 1′ ต่อกับ base, carbon 5′ ต่อกับ phosphate</li>
     <li>carbon 2′ ของ DNA มีแค่ H (ดีออกซี = ขาด oxygen) ส่วน RNA มี OH</li>
     <li>nucleoside = sugar + base · nucleotide = nucleoside + phosphate</li>
    </ul>
   </div>
  </div>
  <div class="tbl">
   <table class="cmp">
    <thead><tr><th>ลักษณะ</th><th>DNA</th><th>RNA</th></tr></thead>
    <tbody>
     <tr><td>sugar</td><td>deoxyribose</td><td>ribose</td></tr>
     <tr><td>base</td><td class="k"><span class="bA">A</span> <span class="bT">T</span> <span class="bC">C</span> <span class="bG">G</span></td><td class="k"><span class="bA">A</span> <span class="bU">U</span> <span class="bC">C</span> <span class="bG">G</span></td></tr>
     <tr><td>รูปร่าง</td><td>double helix</td><td>single strand</td></tr>
     <tr><td>ตำแหน่ง</td><td>nucleus mitochondria chloroplast</td><td>cytoplasm (สร้างใน nucleus แล้วส่งออก)</td></tr>
     <tr><td>ชนิด</td><td>1 ชนิด</td><td>3 ชนิด: mRNA, tRNA, rRNA</td></tr>
     <tr><td>ปริมาณ</td><td>เท่ากันทุกเซลล์ใน species เดียวกัน</td><td>ต่างกันตามชนิดเซลล์</td></tr>
     <tr><td>ขนาด</td><td>ใหญ่</td><td>เล็ก</td></tr>
    </tbody>
   </table>
  </div>
 </div>
</section>

<!-- 2 -->
<section class="chapter" id="ch2">
 <div class="wrap">
  <p class="chap-no">บทที่ 02</p>
  <h2>double helix ของ Watson &amp; Crick (1953)<small>B-DNA เกลียวเวียนขวา สายทั้งสองวิ่งสวนทางกัน</small></h2>
  <p class="intro">กด “คลายเป็นบันได” เพื่อดูว่า base จับคู่กันด้วย hydrogen bond กี่พันธะ และทิศ 5′→3′ ของแต่ละสาย</p>
  <div class="stage">
   <div class="cv-box"><canvas id="cvHelix" aria-label="model double helix DNA"></canvas></div>
   <div class="ctrl">
    <button class="btn" id="hxHelix" aria-pressed="true">double helix</button>
    <button class="btn" id="hxLadder" aria-pressed="false">คลายเป็นบันได</button>
    <span class="sp"></span>
    <button class="btn icon" data-play="helix" aria-label="หยุด/เล่น">❚❚</button>
   </div>
  </div>
  <div class="notes">
   <div class="note"><h4>โครงสร้าง</h4>
    <ul>
     <li>polynucleotide 2 สาย <b>antiparallel</b> (5′→3′ คู่กับ 3′←5′)</li>
     <li>แกนนอก (backbone) = deoxyribose + phosphate ต่อกันด้วยพันธะ phosphodiester</li>
     <li>base อยู่ด้านใน ตั้งฉากกับแกน การหมุนเกลียวทำให้เกิด major groove และ minor groove</li>
    </ul>
   </div>
   <div class="note"><h4>complementary base pairing</h4>
    <ul>
     <li><span class="k"><span class="bA">A</span> = <span class="bT">T</span></span> hydrogen bond 2 พันธะ</li>
     <li><span class="k"><span class="bG">G</span> ≡ <span class="bC">C</span></span> hydrogen bond 3 พันธะ</li>
     <li>รูปอื่น: A-form (ภาวะขาดน้ำ), Z-form (เกลือสูง/methylation)</li>
    </ul>
   </div>
  </div>

  <h3>ทำไมต้อง purine คู่กับ pyrimidine</h3>
  <p class="intro">ภาพ X-ray บอกว่า DNA กว้างเท่ากันตลอดสาย ลองจับคู่ดูว่าแบบไหนพอดีกับเส้นประ</p>
  <div class="stage pairgame">
   <div style="padding:10px 12px 0"><svg id="pairSvg" viewBox="0 0 340 130" role="img" aria-label="เปรียบเทียบความกว้างของ bp"></svg></div>
   <div class="caption" id="pairText"></div>
   <div class="chips">
    <button class="btn" data-pair="pp">purine + purine</button>
    <button class="btn" data-pair="yy">pyrimidine + pyrimidine</button>
    <button class="btn" data-pair="py" aria-pressed="true">purine + pyrimidine</button>
   </div>
  </div>
 </div>
</section>

    <span class="gres" data-res='<span class="tag d">ตาย</span><br>พบทั้ง R และ S มีชีวิต R รับสารพันธุกรรมจาก S ไป = <b>transformation</b>'>แตะเพื่อดูผล</span></button>

   <li class="hot"><span class="yr">1953</span><div><div class="who">James Watson &amp; Francis Crick<span class="hotTag">เน้นในชีท</span></div><div class="what">สร้าง model double helix จากข้อมูลของ Chargaff, Franklin และ Wilkins</div></div></li>

<section class="chapter" id="ch4">
 <div class="wrap">
  <p class="chap-no">บทที่ 04</p>
  <h2>DNA replication<small>แบบ semiconservative · สร้าง new strand ทิศ 5′→3′ เสมอ</small></h2>
  <p class="intro">สายสีน้ำเงินคือ template strand เดิม สายสีแดงคือ new strand สีส้มคือ RNA primer แตะชื่อ enzyme เพื่อดูว่าแต่ละตัวอยู่ตรงไหนและทำอะไร</p>
  <div class="stage">
   <div class="cv-box"><canvas id="cvRep" aria-label="แอนิเมชัน replication fork DNA"></canvas></div>
   <div class="chips" id="repChips">
    <button class="btn" data-enz="all" aria-pressed="true">ดูทั้งหมด</button>
    <button class="btn" data-enz="topo">Topoisomerase</button>
    <button class="btn" data-enz="heli">Helicase</button>
    <button class="btn" data-enz="ssb">SSB</button>
    <button class="btn" data-enz="prim">Primase</button>
    <button class="btn" data-enz="pol">DNA polymerase</button>
    <button class="btn" data-enz="lig">DNA ligase</button>
   </div>
   <div class="caption" id="repCap"></div>
   <div class="ctrl">
    <button class="btn icon" data-play="rep" aria-label="หยุด/เล่น">❚❚</button>

   </div>
  </div>
  <div class="notes">
   <div class="note"><h4>leading strand vs lagging strand</h4>
    <ul>
     <li><b>Leading strand</b> สร้างต่อเนื่องเข้าหา fork</li>
     <li><b>Lagging strand</b> สร้างเป็นช่วงสั้นๆ ทิศออกจาก fork เรียกว่า <b>Okazaki fragment</b> แต่ละช่วงเริ่มจาก RNA primer</li>

<section class="chapter" id="ch5">
 <div class="wrap">
  <p class="chap-no">บทที่ 05</p>
  <h2>transcription<small>DNA → mRNA ใน nucleus โดย RNA polymerase</small></h2>
  <p class="intro">RNA polymerase เกาะ DNA แยกสายออกเป็นฟองเล็กๆ อ่าน template strand 3′→5′ แล้วต่อ mRNA ทิศ 5′→3′ ใช้ <span class="k bU">U</span> แทน <span class="k bT">T</span></p>
  <div class="stage">
   <div class="cv-box"><canvas id="cvTx" aria-label="แอนิเมชัน transcription"></canvas></div>
   <div class="caption"><span style="font-size:.78rem;color:var(--muted)">mRNA ที่สร้างแล้ว</span><div class="readout" id="txOut"></div></div>
   <div class="ctrl">
    <button class="btn icon" data-play="tx" aria-label="หยุด/เล่น">❚❚</button>
    <button class="btn" data-speed="tx" data-v="0.5">ช้า</button>
    <button class="btn" data-speed="tx" data-v="1" aria-pressed="true">ปกติ</button>
    <button class="btn" data-speed="tx" data-v="2">เร็ว</button>
   </div>
  </div>
  <div class="notes">
   <div class="note"><h4>RNA 3 ชนิด</h4>
    <ul>
     <li><b class="bU">mRNA</b> สำเนาของ gene เป็นตัวกลางระหว่าง DNA กับ ribosome ความยาวขึ้นกับ gene</li>
     <li><b>tRNA</b> ขนส่ง amino acid มาที่ ribosome สั้นเพียง 70–90 nucleotide มี anticodon</li>
     <li><b>rRNA</b> รวมกับ protein เป็น ribosome มี 2 subunit</li>
    </ul>
   </div>
   <div class="note"><h4>กฎการจับคู่ตอน transcribe</h4>
    <ul>
     <li class="k">DNA <span class="bA">A</span> → mRNA <span class="bU">U</span></li>
     <li class="k">DNA <span class="bT">T</span> → mRNA <span class="bA">A</span></li>
     <li class="k">DNA <span class="bG">G</span> → mRNA <span class="bC">C</span> · DNA <span class="bC">C</span> → mRNA <span class="bG">G</span></li>
    </ul>
   </div>
  </div>
 </div>
</section>

<section class="chapter" id="ch6">
 <div class="wrap">
  <p class="chap-no">บทที่ 06</p>
  <h2>translation<small>mRNA → protein บน ribosome ใน cytoplasm</small></h2>
  <p class="intro">base 3 ตัวบน mRNA = 1 codon = amino acid 1 ตัว tRNA ใช้ anticodon จับคู่กับ codon ribosome มี 3 ตำแหน่ง E P A</p>
  <div class="stage">
   <div class="cv-box"><canvas id="cvTl" aria-label="แอนิเมชัน translation บน ribosome"></canvas></div>
   <div class="caption" id="tlCap"></div>
   <div class="ctrl">

<section class="chapter" id="ch1">
  <div class="wrap">
    <p class="chap-no">Chapter 01</p>
    <h2>Nucleotides, the building blocks of nucleic acids<small>Phosphate + pentose sugar + nitrogenous base</small></h2>
    <p class="intro">Genetic material is made of nucleic acids, which come in two kinds, DNA and RNA. They are found in the nucleus, mitochondria and chloroplasts. Watch the three parts come together, then switch between DNA and RNA to spot the difference.</p>
    <div class="stage">
      <div class="cv-box"><canvas id="cvNuc" aria-label="Animation of a nucleotide being assembled"></canvas></div>
      <div class="ctrl">
        <button class="btn" id="nucDNA" aria-pressed="true">DNA</button>
        <button class="btn" id="nucRNA" aria-pressed="false">RNA</button>
        <span class="sp"></span>
        <button class="btn icon" data-play="nuc" aria-label="Pause or play">❚❚</button>
      </div>
    </div>
    <div class="notes">
      <div class="note"><h4>Two families of bases</h4>
        <ul>
          <li><b>Purines</b> (two rings): <span class="k bA">A</span> adenine, <span class="k bG">G</span> guanine</li>
          <li><b>Pyrimidines</b> (one ring): <span class="k bC">C</span> cytosine, <span class="k bT">T</span> thymine (DNA), <span class="k bU">U</span> uracil (RNA)</li>
        </ul>
      </div>
      <div class="note"><h4>What to look for on the sugar</h4>
        <ul>
          <li>Carbon 1′ bonds to the base; carbon 5′ bonds to the phosphate</li>
          <li>In DNA, carbon 2′ carries only H (deoxy = missing an oxygen); in RNA it carries OH</li>
          <li>Nucleoside = sugar + base · Nucleotide = nucleoside + phosphate</li>
        </ul>
      </div>
    </div>
    <div class="tbl">
      <table class="cmp">
        <thead><tr><th>Feature</th><th>DNA</th><th>RNA</th></tr></thead>
        <tbody>
          <tr><td>Sugar</td><td>deoxyribose</td><td>ribose</td></tr>
          <tr><td>Bases</td><td class="k"><span class="bA">A</span> <span class="bT">T</span> <span class="bC">C</span> <span class="bG">G</span></td><td class="k"><span class="bA">A</span> <span class="bU">U</span> <span class="bC">C</span> <span class="bG">G</span></td></tr>
          <tr><td>Shape</td><td>Double helix</td><td>Single strand</td></tr>
          <tr><td>Location</td><td>Nucleus, mitochondria, chloroplasts</td><td>Cytoplasm (made in the nucleus, then exported)</td></tr>
          <tr><td>Types</td><td>1 type</td><td>3 types: mRNA, tRNA, rRNA</td></tr>
          <tr><td>Amount</td><td>Equal in every cell of the same species</td><td>Varies with cell type</td></tr>
          <tr><td>Size</td><td>Large</td><td>Small</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<section class="chapter" id="ch2">
  <div class="wrap">
    <p class="chap-no">Chapter 02</p>
    <h2>The Watson &amp; Crick double helix (1953)<small>B-DNA is a right-handed helix whose two strands run in opposite directions</small></h2>
    <p class="intro">Tap “Unwind to ladder” to count the hydrogen bonds in each base pair and see the 5′→3′ direction of each strand.</p>
    <div class="stage">
      <div class="cv-box"><canvas id="cvHelix" aria-label="DNA double helix model"></canvas></div>
      <div class="ctrl">
        <button class="btn" id="hxHelix" aria-pressed="true">Double helix</button>
        <button class="btn" id="hxLadder" aria-pressed="false">Unwind to ladder</button>
        <span class="sp"></span>
        <button class="btn icon" data-play="helix" aria-label="Pause or play">❚❚</button>
      </div>
    </div>
    <div class="notes">
      <div class="note"><h4>Structure</h4>
        <ul>
          <li>Two <b>antiparallel</b> polynucleotide strands (5′→3′ paired with 3′←5′)</li>
          <li>The outer backbone is deoxyribose + phosphate, joined by phosphodiester bonds</li>
          <li>Bases sit inside, perpendicular to the axis; the twist creates a major groove and a minor groove</li>
        </ul>
      </div>
      <div class="note"><h4>Complementary base pairing</h4>
        <ul>
          <li><span class="k"><span class="bA">A</span> = <span class="bT">T</span></span> 2 hydrogen bonds</li>
          <li><span class="k"><span class="bG">G</span> ≡ <span class="bC">C</span></span> 3 hydrogen bonds</li>
          <li>Other forms: A-form (dehydrated), Z-form (high salt / methylation)</li>
        </ul>
      </div>
    </div>

    <h3>Why a purine always pairs with a pyrimidine</h3>
    <p class="intro">X-ray data showed DNA has the same width all along its length. Try each pairing and see which one fits between the dashed lines.</p>
    <div class="stage pairgame">
      <div style="padding:10px 12px 0"><svg id="pairSvg" viewBox="0 0 340 130" role="img" aria-label="Comparing base-pair widths"></svg></div>

        <button class="btn" data-pair="yy">Pyrimidine + pyrimidine</button>
        <button class="btn" data-pair="py" aria-pressed="true">Purine + pyrimidine</button>
      </div>
    </div>
  </div>
</section>

    <h3>Griffith’s experiment (1920s)</h3>

    <div class="notes">
      <div class="note"><h4>What is gene transformation</h4>
        <ul>
          <li>The recipient cell takes up outside DNA (free DNA or a plasmid)</li>
          <li>That DNA joins the recipient cell’s genome</li>
          <li>The new gene is expressed as protein, giving the cell a new trait</li>

      </div>

        <div style="font-size:.875rem;color:var(--muted)">A = T and G = C every time, so purines (A+G) = pyrimidines (T+C) = 50%</div>
      </div>

    <h3>Timeline of discovery</h3>
    <ol class="tl">
      <li><span class="yr">1860s</span><div><div class="who">Friedrich Miescher</div><div class="what">Isolated a non-protein substance from cell nuclei and named it nuclein</div></div></li>
      <li class="hot"><span class="yr">1920s</span><div><div class="who">Frederick Griffith<span class="hotTag">Key in handout</span></div><div class="what">Used mice and two strains of pneumococcus; discovered transformation</div></div></li>
      <li><span class="yr">1930s</span><div><div class="who">Joachim Hämmerling</div><div class="what">Worked with the alga Acetabularia; proposed that hereditary information is stored in the nucleus</div></div></li>
      <li><span class="yr">1944</span><div><div class="who">Avery, MacLeod &amp; McCarty</div><div class="what">Showed that DNA is the transforming principle in pneumococcus</div></div></li>
      <li class="hot"><span class="yr">1949</span><div><div class="who">Erwin Chargaff<span class="hotTag">Key in handout</span></div><div class="what">Found that A = T and G = C, and that base composition differs between species</div></div></li>
      <li><span class="yr">1952</span><div><div class="who">Hershey &amp; Chase</div><div class="what">Used radioactively labelled viruses; the viral DNA entered the bacteria, so DNA is the hereditary material</div></div></li>

      <li class="hot"><span class="yr">1953</span><div><div class="who">James Watson &amp; Francis Crick<span class="hotTag">Key in handout</span></div><div class="what">Built the double-helix model from the data of Chargaff, Franklin and Wilkins</div></div></li>
    </ol>
  </div>

    <h2>DNA replication<small>Semiconservative · new strands always grow 5′→3′</small></h2>
    <p class="intro">Blue strands are the original templates, red strands are new DNA, and orange is RNA primer. Tap an enzyme name to see where it works and what it does.</p>
    <div class="stage">
      <div class="cv-box"><canvas id="cvRep" aria-label="Animation of a DNA replication fork"></canvas></div>
      <div class="chips" id="repChips">
        <button class="btn" data-enz="all" aria-pressed="true">Show all</button>
        <button class="btn" data-enz="topo">Topoisomerase</button>
        <button class="btn" data-enz="heli">Helicase</button>
        <button class="btn" data-enz="ssb">SSB</button>
        <button class="btn" data-enz="prim">Primase</button>
        <button class="btn" data-enz="pol">DNA polymerase</button>
        <button class="btn" data-enz="lig">DNA ligase</button>
      </div>

        <button class="btn" data-speed="rep" data-v="1" aria-pressed="true">Normal</button>

    <div class="notes">
      <div class="note"><h4>Leading vs lagging strand</h4>
        <ul>
          <li><b>Leading strand</b> is made continuously, toward the fork</li>
          <li><b>Lagging strand</b> is made in short pieces, away from the fork, called <b>Okazaki fragments</b>; each one starts from an RNA primer</li>
          <li>DNA polymerase can only add to a 3′ end, which is why the two strands differ</li>
        </ul>
      </div>
      <div class="note semi"><h4>Semiconservative</h4>
        <svg viewBox="0 0 300 120" role="img" aria-label="Each daughter DNA has one old and one new strand">

          <text x="245" y="55" fill="var(--old)" font-size="11" font-family="IBM Plex Sans Thai, sans-serif">Old strand</text>
          <text x="245" y="72" fill="var(--new)" font-size="11" font-family="IBM Plex Sans Thai, sans-serif">New strand</text>
        </svg>
        <div style="font-size:.875rem;color:var(--muted)">Each of the two DNA molecules produced keeps one old strand and gains one new strand.</div>

<!-- 5 -->
<section class="chapter" id="ch5">
  <div class="wrap">
    <p class="chap-no">Chapter 05</p>
    <h2>Transcription<small>DNA → mRNA in the nucleus, by RNA polymerase</small></h2>
    <p class="intro">RNA polymerase binds DNA and opens a small bubble. It reads the template 3′→5′ and builds mRNA 5′→3′, using <span class="k bU">U</span> in place of <span class="k bT">T</span>.</p>
    <div class="stage">
      <div class="cv-box"><canvas id="cvTx" aria-label="Transcription animation"></canvas></div>
      <div class="caption"><span style="font-size:.78rem;color:var(--muted)">mRNA made so far</span><div class="readout" id="txOut"></div></div>
      <div class="ctrl">
        <button class="btn icon" data-play="tx" aria-label="Pause or play">❚❚</button>
        <button class="btn" data-speed="tx" data-v="0.5">Slow</button>
        <button class="btn" data-speed="tx" data-v="1" aria-pressed="true">Normal</button>
        <button class="btn" data-speed="tx" data-v="2">Fast</button>
      </div>
    </div>
    <div class="notes">
      <div class="note"><h4>Three kinds of RNA</h4>
        <ul>
          <li><b class="bU">mRNA</b> A copy of the gene that carries it from DNA to the ribosome; length depends on the gene</li>
          <li><b>tRNA</b> Delivers amino acids to the ribosome; only 70–90 nucleotides long, with an anticodon</li>
          <li><b>rRNA</b> Combines with proteins to form the ribosome, which has 2 subunits</li>
        </ul>
      </div>
      <div class="note"><h4>Pairing rules during transcription</h4>
        <ul>
          <li class="k">DNA <span class="bA">A</span> → mRNA <span class="bU">U</span></li>
          <li class="k">DNA <span class="bT">T</span> → mRNA <span class="bA">A</span></li>
          <li class="k">DNA <span class="bG">G</span> → mRNA <span class="bC">C</span> · DNA <span class="bC">C</span> → mRNA <span class="bG">G</span></li>
        </ul>
      </div>
    </div>
  </div>
</section>

<section class="chapter" id="ch6">

    <h2>Translation<small>mRNA → protein on ribosomes in the cytoplasm</small></h2>
    <p class="intro">Three bases on mRNA make one codon, which codes for one amino acid. Each tRNA pairs its anticodon with a codon. The ribosome has three sites: E, P and A.</p>
    <div class="stage">
      <div class="cv-box"><canvas id="cvTl" aria-label="Translation animation on a ribosome"></canvas></div>

      <div class="note"><h4>Special codons</h4>
        <ul>
          <li>Start codon <b class="k" style="color:var(--warm)">AUG</b> = Met (methionine)</li>
          <li>Stop codons <b class="k" style="color:var(--bad)">UAA UAG UGA</b> have no matching tRNA, so translation ends</li>
        </ul>
      </div>
      <div class="note"><h4>One gene one polypeptide</h4>
        <ul>
          <li>One gene is transcribed into mRNA and translated into one polypeptide chain</li>
          <li>The P site holds the growing chain, the A site receives the next tRNA, and the E site releases the empty tRNA</li>
        </ul>

function buildTable(){let h='<table><thead><tr><th></th>'+[...NU].map(b=>`<th>${b}</th>`).join('')+'</tr></thead><tbody>';
 for(const a of NU){h+=`<tr><th>${a}</th>`;for(const b of NU){h+='<td>';for(const c3 of NU){const cod=a+b+c3,aa=aaOf(cod);const cls=hlSet.has(cod)?'hl':aa==='Stop'?'st':cod==='AUG'?'mt':'';h+=`<div class="${cls}">${cod} ${aa}</div>`;}h+='</td>';}h+='</tr>';}
 $('#ctab').innerHTML=h+'</tbody></table>';}
function decodeMine(){const raw=myIn.value.toUpperCase().replace(/[^ATCG]/g,'');if(raw!==myIn.value.toUpperCase())myIn.value=raw;
 const cods=[];for(let i=0;i+3<=raw.length;i+=3)cods.push(raw.slice(i,i+3));
 hlSet=new Set();let stopped=false;const rows={d:[],m:[],t:[],a:[]};
 cods.forEach(tr=>{const m=tr.split('').map(b=>DNA2M[b]).join(''),aa=aaOf(m);const after=stopped;if(!after)hlSet.add(m);const cls=after?'after':aa==='Stop'?'stop':m==='AUG'?'start':'';
  rows.d.push(`<span class="tok ${after?'after':''}">${cbase(tr)}</span>`);rows.m.push(`<span class="tok ${cls}">${cbase(m)}</span>`);rows.t.push(`<span class="tok ${after?'after':''}">${cbase(tr.replace(/T/g,'U'))}</span>`);rows.a.push(`<span class="tok ${cls}">${aa}</span>`);if(aa==='Stop')stopped=true;});
 const rem=raw.length%3;
 const prot=[];for(const tr of cods){const aa=aaOf(tr.split('').map(b=>DNA2M[b]).join(''));if(aa==='Stop')break;prot.push(aa);}
 $('#myOut').innerHTML=cods.length?`<div class="row"><span>DNA 3′→5′</span><div class="toks">${rows.d.join('')}</div></div><div class="row"><span>mRNA 5′→3′</span><div class="toks">${rows.m.join('')}</div></div><div class="row"><span>tRNA anticodon</span><div class="toks">${rows.t.join('')}</div></div><div class="row"><span>amino acid</span><div class="toks">${rows.a.join('')}</div></div><div class="row"><span>protein</span><div style="font-family:var(--f-display);color:var(--warm)">${prot.join('–')||'—'}${rem?` <span style="color:var(--muted);font-family:var(--f-body);font-size:.82rem">(เหลือ ${rem} base ไม่ครบ codon)</span>`:''}</div></div>`:'<div style="color:var(--muted);font-family:var(--f-body)">พิมพ์อย่างน้อย 3 base</div>';
 buildTable();}
myIn.oninput=decodeMine;
$('#myRand').onclick=()=>{let s='TAC';const n=4+Math.floor(Math.random()*4);for(let i=0;i<n;i++){let c3;do{c3=Array.from({length:3},()=>'ATCG'[Math.floor(Math.random()*4)]).join('');}while(['ATT','ATC','ACT'].includes(c3));s+=c3;}s+=['ATT','ATC','ACT'][Math.floor(Math.random()*3)];myIn.value=s;decodeMine();};
decodeMine();

/* ---------- quiz ---------- */
const Q=[
 ['sugar ที่เป็นองค์ประกอบของ DNA คือข้อใด',['deoxyribose','ribose','กลูโคส','ฟรักโทส'],'DNA = deoxyribose (C2′ มีแค่ H) ส่วน RNA ใช้ ribose'],
 ['base ใดพบใน RNA แต่ไม่พบใน DNA',['ยูราซิล (U)','ไทมีน (T)','อะดีนีน (A)','กัวนีน (G)'],'RNA ใช้ U แทน T'],
 ['A จับคู่กับ T ด้วย hydrogen bond กี่พันธะ',['2 พันธะ','1 พันธะ','3 พันธะ','4 พันธะ'],'A=T มี 2 พันธะ ส่วน G≡C มี 3 พันธะ'],
 ['DNA ตัวอย่างหนึ่งมี G = 20% จะมี A กี่ %',['30%','20%','40%','60%'],'G = C = 20% รวม 40% ที่เหลือ 60% แบ่งให้ A = T เท่ากัน จึงได้ A = 30%'],
 ['B-DNA หนึ่ง turn มีกี่ bp',['10 bp','3.4 bp','2 bp','20 bp'],'1 รอบยาว 3.4 nm มี 10 bp diameter 2 nm'],
 ['ใครถ่ายภาพ X-ray diffraction ที่ชี้ว่า DNA เป็น double helix',['Rosalind Franklin','Erwin Chargaff','Frederick Griffith','Hershey & Chase'],'Franklin (ร่วมกับ Wilkins) ใช้ X-ray crystallography'],
 ['Griffith ค้นพบกระบวนการใด',['Transformation','Transcription','Translation','Replication'],'R มีชีวิต + S ตายด้วยความร้อน ทำให้หนูตาย R ได้รับสารพันธุกรรมจาก S'],
 ['enzyme ใดคลาย double helix โดยสลาย hydrogen bond',['Helicase','DNA ligase','Primase','RNA polymerase'],'Helicase ใช้พลังงานจาก ATP แยกสายคู่เป็น single strand'],
 ['Okazaki fragment เกิดบนสายใด',['Lagging strand','Leading strand','mRNA','template strand เดิม'],'lagging strand สร้างเป็นช่วงๆ ทิศออกจาก fork แล้ว DNA ligase เชื่อมต่อ'],
 ['ข้อใดคือหน้าที่ของ primase',['สร้าง RNA primer','เชื่อมพันธะ phosphodiester','คลายปมเหนือ fork','จับ DNA single strand'],'Primase สร้าง RNA primer ให้ DNA polymerase เริ่มต่อสาย'],
 ['DNA template 3′-TAC-5′ ให้ codon บน mRNA ใด',['AUG','UAC','ATG','TAC'],'T→A, A→U, C→G จึงได้ AUG = Met start codon'],
 ['RNA ชนิดใดขน amino acid มาที่ ribosome',['tRNA','mRNA','rRNA','DNA'],'tRNA มี anticodon จับคู่กับ codon บน mRNA']
];
let qi=0,score=0,order=[];const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function qRender(){const box=$('#quiz');
 if(qi>=Q.length){const pct=Math.round(score/Q.length*100);box.innerHTML=`<div class="qend"><div class="score">${score}/${Q.length}</div><p style="margin-top:10px">${pct>=80?'เยี่ยม พร้อมสอบแล้ว':pct>=50?'ดีแล้ว ทบทวนบทที่ตอบผิดอีกรอบ':'ลองดูแอนิเมชันอีกรอบแล้วกลับมาทำใหม่'}</p><button class="btn" id="qAgain">ทำใหม่</button></div>`;$('#qAgain').onclick=()=>{qi=0;score=0;qRender();};return;}
 const[q,opts,why]=Q[qi];order=shuf(opts.map((o,i)=>i));
 box.innerHTML=`<div class="qtop"><span>ข้อ ${qi+1}/${Q.length}</span><span>คะแนน ${score}</span></div><div class="qbar"><i style="width:${qi/Q.length*100}%"></i></div><p class="qq">${q}</p><div class="qopts">${order.map(i=>`<button class="qopt" data-i="${i}">${opts[i]}</button>`).join('')}</div><div class="qfb" id="qfb"></div>`;
 $$('.qopt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ok=i===0;if(ok)score++;$$('.qopt').forEach(x=>{x.disabled=true;if(+x.dataset.i===0)x.classList.add('right');});if(!ok)b.classList.add('wrong');
  $('#qfb').innerHTML=`<b class="${ok?'r':'w'}">${ok?'ถูกต้อง':'ยังไม่ถูก'}</b> ${why}<div class="qnext"><button class="btn" id="qNext">${qi+1<Q.length?'ข้อต่อไป':'ดูคะแนน'}</button></div>`;$('#qNext').onclick=()=>{qi++;qRender();};$('#qNext').focus();});}

const links=$$('#rail a');const secs=links.map(a=>$(a.getAttribute('href')));

<script>
(()=>{if(window.__LANG!=='en')return;

(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL={};let TSC=1.12;
const TOK={A:'--A',T:'--T',G:'--G',C:'--C',U:'--U',old:'--old',nw:'--new',primer:'--primer',sugar:'--sugar',phos:'--phos',fg:'--fg',muted:'--muted',line:'--line',accent:'--accent',warm:'--warm',warmFill:'--warm-fill',bg:'--bg',bg2:'--bg2',panel:'--panel',panel2:'--panel2',ink:'--ink',good:'--good',bad:'--bad',ssb:'--ssb',pol1:'--pol1',pol2:'--pol2',prim:'--prim',lig:'--lig',heli:'--heli',topo:'--topo',ribS:'--ribS',ribL:'--ribL',ribLine:'--ribLine',ribText:'--ribText',trna:'--trna',trna2:'--trna2',rf:'--rf'};
function readCols(){const cs=getComputedStyle(document.getElementById('pane-lab'));for(const k in TOK)COL[k]=cs.getPropertyValue(TOK[k]).trim();}
readCols();
const FONT='"IBM Plex Sans Thai",system-ui,sans-serif', DISP='"Mitr","IBM Plex Sans Thai",sans-serif', MONO='"JetBrains Mono",ui-monospace,monospace';
const COMP={A:'T',T:'A',G:'C',C:'G'};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const baseAt=i=>'ATGC'[(Math.imul((i|0)^0x5bd1e995,2654435761)>>>13)%4];

/* ---------- canvas scene engine ---------- */
const scenes={};let frameDt=0;
function scene(id,canvas,ratio,draw,state={}){
  const sc={canvas,ctx:canvas.getContext('2d'),ratio,draw,t:0,speed:1,playing:!RM,visible:true,W:0,H:0,state};
  const box=canvas.parentElement;
  const resize=()=>{const w=box.clientWidth;if(!w)return;const h=Math.round(ratio(w));const d=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);canvas.style.height=h+'px';sc.ctx.setTransform(d,0,0,d,0,0);sc.W=w;sc.H=h;paint(sc);};
  new ResizeObserver(resize).observe(box);
  if('IntersectionObserver' in window)new IntersectionObserver(es=>es.forEach(e=>sc.visible=e.isIntersecting),{rootMargin:'120px'}).observe(canvas);
  resize();scenes[id]=sc;return sc;
}
function paint(sc){if(!sc.W)return;const c=sc.ctx;c.save();c.clearRect(0,0,sc.W,sc.H);c.lineCap='round';c.lineJoin='round';sc.draw(c,sc.W,sc.H,sc.t,sc);c.restore();}
let last=performance.now();
function loop(now){frameDt=Math.min(.05,(now-last)/1000);last=now;for(const k in scenes){const sc=scenes[k];if(!sc.visible)continue;if(sc.playing)sc.t+=frameDt*sc.speed;paint(sc);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Object.values(scenes).forEach(paint));

function T(c,s,x,y,o={}){c.globalAlpha=o.alpha??1;c.fillStyle=o.color||COL.fg;c.font=`${o.weight||500} ${((o.size||12)*TSC).toFixed(1)}px ${o.font||FONT}`;c.textAlign=o.align||'left';c.textBaseline=o.base||'alphabetic';c.fillText(s,x,y);c.globalAlpha=1;}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function label(c,s,x,y,o={}){const size=(o.size||11)*TSC;c.font=`${o.weight||600} ${size}px ${o.font||FONT}`;const w=c.measureText(s).width+12,h=size+9;let lx=o.align==='left'?x:o.align==='right'?x-w:x-w/2;lx=clamp(lx,4,(o.W||9999)-w-4);c.globalAlpha=o.alpha??1;rr(c,lx,y-h/2,w,h,h/2);c.fillStyle=o.bg||COL.bg2;c.fill();c.strokeStyle=o.stroke||COL.line;c.lineWidth=1;c.stroke();c.fillStyle=o.color||COL.fg;c.textAlign='left';c.textBaseline='middle';c.fillText(s,lx+6,y+.5);c.globalAlpha=1;}
function line(c,x1,y1,x2,y2,col,w,a=1){c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.globalAlpha=1;}
function glow(c,x,y,r,t,col){const p=(Math.sin(t*3)+1)/2;c.globalAlpha=.18+.18*p;c.fillStyle=col;c.beginPath();c.arc(x,y,r+p*6,0,7);c.fill();c.globalAlpha=.9;c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(x,y,r+p*6,0,7);c.stroke();c.globalAlpha=1;}

/* ---------- helix renderer ---------- */
function helix(c,o){
  const {x0,x1,mid,amp,rot=0,delta=Math.PI,m=0,flat=amp,seed=0,lw=3,letters=false,c1=COL.old,c2=COL.accent}=o;
  const period=amp*3.4,k=2*Math.PI/period,step=period/10;
  const p1=x=>{const ph=(x-x0)*k+rot;return[lerp(mid+amp*Math.sin(ph),mid-flat,m),Math.cos(ph)*(1-m)];};
  const p2=x=>{const ph=(x-x0)*k+rot+delta;return[lerp(mid+amp*Math.sin(ph),mid+flat,m),Math.cos(ph)*(1-m)];};
  const seg=(fn,col,front)=>{for(let x=x0;x<x1;x+=3){const xe=Math.min(x+3,x1);const[ya,za]=fn(x),[yb,zb]=fn(xe);const z=(za+zb)/2;if((z>=0)!==front)continue;const d=(z+1)/2;c.globalAlpha=.3+.7*d;c.strokeStyle=col;c.lineWidth=lw*(.7+.5*d);c.beginPath();c.moveTo(x,ya);c.lineTo(xe,yb);c.stroke();}c.globalAlpha=1;};
  const n=Math.floor((x1-x0)/step),R=[];
  for(let i=0;i<n;i++){const x=x0+(i+.5)*step;const[a,za]=p1(x),[b,zb]=p2(x);R.push({x,a,b,za,zb,i});}
  const dots=front=>{for(const r of R){for(const[y,z]of[[r.a,r.za],[r.b,r.zb]]){if((z>=0)!==front)continue;const d=(z+1)/2;c.globalAlpha=.35+.65*d;c.fillStyle=COL.phos;c.beginPath();c.arc(r.x,y,lw*(.55+.45*d),0,7);c.fill();}}c.globalAlpha=1;};
  seg(p1,c1,false);seg(p2,c2,false);dots(false);
  for(const r of R){
    const b=baseAt(r.i+seed),cp=COMP[b];const d=((r.za+r.zb)/2+1)/2;const al=lerp(.2+.65*d,1,m);
    const dir=Math.sign(r.b-r.a)||1,ym=(r.a+r.b)/2,gap=m*7;
    c.lineCap='butt';
    line(c,r.x,r.a,r.x,ym-dir*gap,COL[b],lerp(2.2,4.5,m),al);
    line(c,r.x,ym+dir*gap,r.x,r.b,COL[cp],lerp(2.2,4.5,m),al);
    c.lineCap='round';
    if(m>.3){const cnt=(b==='A'||b==='T')?2:3;c.setLineDash([2,2]);for(let j=0;j<cnt;j++){const xx=r.x+(j-(cnt-1)/2)*3.4;line(c,xx,ym-gap+1,xx,ym+gap-1,COL.fg,1,(m-.3)/.7);}c.setLineDash([]);}
    if(letters&&m>.5){const al2=(m-.5)*2;for(const[ch,y]of[[b,r.a+dir*19],[cp,r.b-dir*19]]){c.globalAlpha=al2;c.fillStyle=COL.panel;c.beginPath();c.arc(r.x,y,10.5,0,7);c.fill();c.strokeStyle=COL[ch];c.lineWidth=1.5;c.stroke();T(c,ch,r.x,y+.5,{size:11,weight:700,font:MONO,color:COL[ch],align:'center',base:'middle',alpha:al2});}}
  }
  seg(p1,c1,true);seg(p2,c2,true);dots(true);
  return{period,k};
}

/* ---------- HERO ---------- */
const motes=Array.from({length:18},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,s:Math.random()*.02+.005,p:Math.random()*6}));
scene('hero',$('#cvHero'),w=>clamp(w*.34,150,280),(c,W,H,t)=>{
  for(const d of motes){const x=((d.x+t*d.s)%1)*W,y=d.y*H+Math.sin(t+d.p)*6;c.globalAlpha=.12+.1*Math.sin(t*1.3+d.p);c.fillStyle=COL.accent;c.beginPath();c.arc(x,y,d.r,0,7);c.fill();}
  c.globalAlpha=1;
  const amp=H*.3;helix(c,{x0:-30,x1:W+30,mid:H/2,amp,rot:t*.5,delta:Math.PI*.78,lw:clamp(W/160,2.5,4.5)});
});

/* ---------- 1. NUCLEOTIDE ---------- */
const nucSc=scene('nuc',$('#cvNuc'),w=>clamp(w*.6,300,420),(c,W,H,t,sc)=>{
  const st=sc.state,RNA=st.rna;const C=7.5,tc=t%C,cyc=Math.floor(t/C);
  const set=RNA?['A','U','G','C']:['A','T','G','C'];const b=set[cyc%4];
  const s=clamp(Math.min(W/390,H/270),.72,1.5);const cx=W/2-6*s,cy=H*.56;
  const fadeOut=1-smooth(6.7,7.4,tc);
  const inP=ease(clamp(tc/1.1,0,1)),inS=ease(clamp((tc-.35)/1.1,0,1)),inB=ease(clamp((tc-.7)/1.1,0,1)),bond=clamp((tc-1.9)/.6,0,1),lab=smooth(2.4,3,tc),br1=smooth(3,3.6,tc),br2=smooth(3.7,4.3,tc);
  // positions
  const sx=cx-8*s,sy=cy+12*s,R=40*s;
  const V=[-90,-18,54,126,198].map(a=>[sx+R*Math.cos(a*Math.PI/180),sy+R*Math.sin(a*Math.PI/180)]);
  const c5=[V[4][0]-30*s,V[4][1]-46*s];
  const px=lerp(-80,c5[0]-62*s,inP),py=c5[1]-6*s;
  const br=24*s,bx=lerp(W+120,V[1][0]+70*s,inB),by=V[1][1]-58*s;
  c.globalAlpha=fadeOut;
  // bonds
  const bl=(x1,y1,x2,y2,p)=>{if(p<=0)return;line(c,x1,y1,lerp(x1,x2,p),lerp(y1,y2,p),COL.fg,2.5,.85*fadeOut);};
  bl(px+22*s,py,c5[0]-8*s,c5[1],bond);bl(c5[0]+6*s,c5[1]+6*s,V[4][0],V[4][1],bond);bl(V[1][0],V[1][1],bx-br*.9,by+br*.55,bond);
  c.globalAlpha=fadeOut;
  // brackets (behind)
  if(br1>0){c.globalAlpha=br1*fadeOut;c.strokeStyle=COL.accent;c.lineWidth=1.5;c.setLineDash([4,4]);rr(c,V[4][0]-14*s,by-br*1.9,(bx+br*2.3)-(V[4][0]-14*s),(V[3][1]+18*s)-(by-br*1.9),14);c.stroke();c.setLineDash([]);T(c,'Nucleoside = sugar + base',bx+br*2.3,by-br*1.9-8,{size:12*Math.min(s,1.1),color:COL.accent,align:'right',alpha:br1*fadeOut});}
  if(br2>0){c.globalAlpha=br2*fadeOut;c.strokeStyle=COL.warm;c.lineWidth=1.5;c.setLineDash([2,5]);const lx=px-30*s,ty=by-br*1.9-26*s;rr(c,lx,ty,(bx+br*2.3+10*s)-lx,(V[3][1]+32*s)-ty,18);c.stroke();c.setLineDash([]);T(c,'Nucleotide = phosphate + sugar + base',lx+6,ty-8,{size:12*Math.min(s,1.1),color:COL.warm,alpha:br2*fadeOut,weight:600});}
  c.globalAlpha=fadeOut;
  // phosphate
  c.fillStyle=COL.phos;c.beginPath();c.arc(px,py,22*s,0,7);c.fill();
  T(c,'P',px,py+1,{size:20*s,weight:700,font:MONO,color:COL.ink,align:'center',base:'middle',alpha:fadeOut});
  T(c,'Phosphate',px,py+38*s,{size:12*s,align:'center',color:COL.phos,alpha:lab*fadeOut});
  // sugar
  const sOff=(1-inS)*-H;c.save();c.translate(0,sOff);
  c.globalAlpha=fadeOut;c.fillStyle=COL.sugar;c.beginPath();V.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();
  c.fillStyle=COL.bg;c.beginPath();c.arc(V[0][0],V[0][1],8*s,0,7);c.fill();T(c,'O',V[0][0],V[0][1]+1,{size:11*s,weight:700,font:MONO,color:COL.sugar,align:'center',base:'middle',alpha:fadeOut});
  T(c,'CH₂',c5[0],c5[1]+2,{size:12*s,weight:600,font:MONO,align:'center',base:'middle',alpha:fadeOut});
  const cl=(s2,x,y,al)=>T(c,s2,x,y,{size:11*s,weight:700,font:MONO,color:COL.ink,align:'center',base:'middle',alpha:al});
  cl("1′",V[1][0]-9*s,V[1][1]+2*s,lab*fadeOut);cl("2′",V[2][0]-4*s,V[2][1]-9*s,lab*fadeOut);cl("3′",V[3][0]+4*s,V[3][1]-9*s,lab*fadeOut);cl("4′",V[4][0]+11*s,V[4][1],lab*fadeOut);
  T(c,'5′',c5[0]-2,c5[1]-14*s,{size:10*s,weight:700,font:MONO,color:COL.sugar,align:'center',alpha:lab*fadeOut});

/* pairing width */
function pairSvg(kind){

  const hex=(hcx)=>{let s='';for(let i=0;i<6;i++){const a=(30+60*i)*Math.PI/180;s+=`${(hcx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)} `;}return s;};
  const pent=(ex,d)=>{const ap=.688*r,R=.8507*r,pc=ex+d*ap;let s='';for(let i=0;i<5;i++){const a=(d>0?Math.PI:0)+36*Math.PI/180+i*72*Math.PI/180;s+=`${(pc+R*Math.cos(a)).toFixed(1)},${(cy+R*Math.sin(a)).toFixed(1)} `;}return s;};
  let g='';
  const fillP='var(--primer)',fillY='var(--phos)';
  if(L==='p'){const hc=x0+pw+hw/2;g+=`<polygon points="${pent(x0+pw,-1)}" fill="${fillP}"/><polygon points="${hex(hc)}" fill="${fillP}"/>`;}else{g+=`<polygon points="${hex(x0+hw/2)}" fill="${fillY}"/>`;}
  const xr=x0+wl+gap;
  if(Rr==='p'){g+=`<polygon points="${hex(xr+hw/2)}" fill="${fillP}"/><polygon points="${pent(xr+hw,1)}" fill="${fillP}"/>`;}else{g+=`<polygon points="${hex(xr+hw/2)}" fill="${fillY}"/>`;}
  for(let j=-1;j<=1;j++)g+=`<line x1="${x0+wl+2}" y1="${cy+j*9}" x2="${xr-2}" y2="${cy+j*9}" stroke="var(--fg)" stroke-dasharray="2 3" stroke-width="1.5"/>`;
  const ok=kind==='py',lx=cx-rail,rx=cx+rail;
  let warn='';
  if(kind==='pp')warn=`<rect x="${x0}" y="${cy-34}" width="${lx-x0}" height="68" fill="var(--bad)" opacity=".25"/><rect x="${rx}" y="${cy-34}" width="${x0+tot-rx}" height="68" fill="var(--bad)" opacity=".25"/>`;
  if(kind==='yy')warn=`<rect x="${lx}" y="${cy-34}" width="${x0-lx}" height="68" fill="var(--bad)" opacity=".18"/><rect x="${x0+tot}" y="${cy-34}" width="${rx-x0-tot}" height="68" fill="var(--bad)" opacity=".18"/>`;
  return `<g style="animation:pop .4s ease">${warn}${g}</g>
  <line x1="${lx}" y1="8" x2="${lx}" y2="118" stroke="var(--U)" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="${rx}" y1="8" x2="${rx}" y2="118" stroke="var(--U)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="${cx}" y="126" fill="var(--muted)" font-size="10" text-anchor="middle" font-family="IBM Plex Sans Thai, sans-serif">DNA width from X-ray data (~2 nm)</text>`;
}

  line(c,-10,mY,W+10,mY,COL.U,4);
  for(let i=-2;i<8;i++){const x=X(i);if(x<-cw||x>W+cw)continue;const cod=i>=0&&i<6?TLc[i]:(i<0?'GCC':'GCA');const isS=i===5;
    for(let q=0;q<3;q++){const bx=x+(q-1)*cw/3.2,b=cod[q];line(c,bx,mY,bx,mY-10,COL[b],3);T(c,b,bx,mY+18,{size:12,font:MONO,weight:700,color:COL[b],align:'center',alpha:i>=0&&i<6?1:.45});}
    if(i>=0&&i<6){c.globalAlpha=.6;c.strokeStyle=isS?COL.bad:(i===0?COL.warm:COL.muted);c.lineWidth=1.2;c.beginPath();c.moveTo(x-cw*.44,mY+25);c.lineTo(x-cw*.44,mY+29);c.lineTo(x+cw*.44,mY+29);c.lineTo(x+cw*.44,mY+25);c.stroke();c.globalAlpha=1;}}
  const x5=X(-2)-cw*.6;if(x5>4)T(c,"5′",x5,mY+5,{size:12,font:MONO,weight:700,color:COL.U,align:'center'});T(c,"3′",W-8,mY+5,{size:12,font:MONO,weight:700,color:COL.U,align:'right'});

  ['E','P','A'].forEach((n,q)=>{const sx=cx+(q-1)*cw;c.globalAlpha=.18*ribA;c.fillStyle=COL.bg;rr(c,sx-cw*.42,largeY-52,cw*.84,108,10);c.fill();T(c,n,sx,largeY-58,{size:13,font:MONO,weight:700,color:COL.ribText,align:'center',alpha:ribA});});

  // tRNA helper

  const drawT=(i,dx,dy,a,carry)=>{if(a<=0)return;const x=X(i)+dx,y=tY0+dy;c.globalAlpha=a;c.fillStyle=COL.trna;rr(c,x-cw*.4,y-62,cw*.8,58,12);c.fill();c.fillStyle=COL.trna2;rr(c,x-cw*.4,y-14,cw*.8,16,6);c.fill();

/* custom decoder + codon table */
const myIn=$('#myIn');let hlSet=new Set();
function buildTable(){let h='<table><thead><tr><th></th>'+[...NU].map(b=>`<th>${b}</th>`).join('')+'</tr></thead><tbody>';
  for(const a of NU){h+=`<tr><th>${a}</th>`;for(const b of NU){h+='<td>';for(const c3 of NU){const cod=a+b+c3,aa=aaOf(cod);const cls=hlSet.has(cod)?'hl':aa==='Stop'?'st':cod==='AUG'?'mt':'';h+=`<div class="${cls}">${cod} ${aa}</div>`;}h+='</td>';}h+='</tr>';}
  $('#ctab').innerHTML=h+'</tbody></table>';}
function decodeMine(){const raw=myIn.value.toUpperCase().replace(/[^ATCG]/g,'');if(raw!==myIn.value.toUpperCase())myIn.value=raw;
  const cods=[];for(let i=0;i+3<=raw.length;i+=3)cods.push(raw.slice(i,i+3));
  hlSet=new Set();let stopped=false;const rows={d:[],m:[],t:[],a:[]};
  cods.forEach(tr=>{const m=tr.split('').map(b=>DNA2M[b]).join(''),aa=aaOf(m);const after=stopped;if(!after)hlSet.add(m);const cls=after?'after':aa==='Stop'?'stop':m==='AUG'?'start':'';
    rows.d.push(`<span class="tok ${after?'after':''}">${cbase(tr)}</span>`);rows.m.push(`<span class="tok ${cls}">${cbase(m)}</span>`);rows.t.push(`<span class="tok ${after?'after':''}">${cbase(tr.replace(/T/g,'U'))}</span>`);rows.a.push(`<span class="tok ${cls}">${aa}</span>`);if(aa==='Stop')stopped=true;});
  const rem=raw.length%3;
  const prot=[];for(const tr of cods){const aa=aaOf(tr.split('').map(b=>DNA2M[b]).join(''));if(aa==='Stop')break;prot.push(aa);}
  $('#myOut').innerHTML=cods.length?`<div class="row"><span>DNA 3′→5′</span><div class="toks">${rows.d.join('')}</div></div><div class="row"><span>mRNA 5′→3′</span><div class="toks">${rows.m.join('')}</div></div><div class="row"><span>tRNA anticodon</span><div class="toks">${rows.t.join('')}</div></div><div class="row"><span>Amino acid</span><div class="toks">${rows.a.join('')}</div></div><div class="row"><span>Protein</span><div style="font-family:var(--f-display);color:var(--warm)">${prot.join('–')||'—'}${rem?` <span style="color:var(--muted);font-family:var(--f-body);font-size:.82rem">(${rem} leftover base(s), not a full codon)</span>`:''}</div></div>`:'<div style="color:var(--muted);font-family:var(--f-body)">Type at least 3 bases</div>';
  buildTable();}
myIn.oninput=decodeMine;

rep:{k:"3.1",title:"DNA replication",sub:"Semiconservative · enzymes ที่ replication fork",steps:[
 T(`<p>ก่อนเซลล์แบ่งตัว DNA ต้องถูก replicate ให้ได้ 2 ชุด วิธีที่เซลล์ใช้คือ <b>semiconservative</b></p><p>double helix แยกออกจากกัน แต่ละสายเป็น template ให้สร้าง new strand มาประกบ ได้ DNA 2 molecule ที่ <span class="key">แต่ละ molecule มี parental strand 1 สาย และ new strand 1 สาย</span></p>`,"semi"),
 Q(`DNA 1 molecule replicate 3 รอบ ได้ 8 molecule มีกี่ molecule ที่ยังมี parental strand ของ molecule แม่`,["1","2","4","8"],1,`parental strand มี 2 สายและไม่เคยถูกตัดแบ่ง จึงอยู่ใน 2 molecule เสมอ ไม่ว่า replicate กี่รอบ`,`ดูสีน้ำเงินในรุ่นที่ 2 ของภาพ`),
 T(`<p>ที่ <b>replication fork</b> มีทีมงานทำหน้าที่ต่อกันตามลำดับ</p><ul><li><b>Topoisomerase</b> คลายปมเกลียวที่บิดแน่นด้านหน้า</li><li><b>Helicase</b> สลาย hydrogen bond แยก double helix ใช้พลังงานจาก ATP</li><li><b>SSB</b> จับ single strand ไม่ให้กลับมาประกบหรือถูกย่อย</li><li><b>Primase</b> สร้าง RNA primer เป็นจุดเริ่ม</li><li><b>DNA polymerase</b> ต่อ new strand 5′→3′ และตรวจแก้ base ที่ผิด</li><li><b>DNA ligase</b> เชื่อมรอยต่อด้วยพันธะ phosphodiester</li></ul>`,"fork",LEG_FORK),
 Q(`enzyme ใดสลาย hydrogen bond เพื่อแยก double helix`,["DNA ligase","Primase","Helicase","Topoisomerase"],2,`Helicase ใช้พลังงานจาก ATP สลาย hydrogen bond ระหว่าง base`,`ในภาพคือสามเหลี่ยมสีม่วงที่หัว fork`),

 {t:"sum",pts:["semiconservative: DNA ลูกมี parental strand 1 + new strand 1","ลำดับที่ fork: Topoisomerase → Helicase → SSB → Primase → DNA polymerase → DNA ligase","DNA polymerase ต่อสาย 5′→3′ และตรวจแก้ base ที่ผิด","Fluoroquinolone ยับยั้ง DNA gyrase ของ bacteria"]}
]},
lag:{k:"3.2",title:"Leading, lagging & Okazaki fragment",sub:"ทำไม lagging strand ต้องสร้างเป็นช่วงๆ",steps:[
 T(`<p>กฎเหล็กของ DNA polymerase: <span class="key">ต่อ nucleotide ใหม่ได้เฉพาะที่ปลาย 3′-OH</span> new strand จึงยาวไปทาง 5′→3′ เสมอ</p>`,"pol53"),
 T(`<p>แต่สอง template strand วิ่งสวนทางกัน ผลคือ</p><ul><li><b>Leading strand</b> สร้างต่อเนื่องเข้าหา fork</li><li><b>Lagging strand</b> ต้องสร้างออกจาก fork ทีละช่วงสั้นๆ เรียกว่า <b>Okazaki fragment</b> แต่ละช่วงเริ่มจาก RNA primer</li></ul><p>จากนั้น DNA polymerase กำจัด primer แล้วเติม DNA แทน และ <b>DNA ligase</b> เชื่อมรอยต่อจนเป็นสายเดียว</p>`,"fork",LEG_FORK),
 Q(`Okazaki fragment เกิดบนสายใด`,["Leading strand","Lagging strand","mRNA","ทั้งสองสายเท่ากัน"],1,`lagging strand สร้างเป็นช่วงสั้นๆ ทิศออกจาก fork ช่วงเหล่านี้คือ Okazaki fragment`),
 Q(`ทำไม lagging strand จึงต้องสร้างเป็นช่วงๆ`,["เพราะ DNA polymerase ต่อได้เฉพาะปลาย 3′ แต่สายนี้ต้องยาวออกจาก fork","เพราะ helicase ทำงานช้า","เพราะ primase ทำงานได้แค่บนสายนี้","เพราะสายนี้ไม่มี hydrogen bond"],0,`เมื่อ fork เปิดเพิ่ม DNA polymerase ต้องเริ่มช่วงใหม่จาก primer ใหม่ เพราะต่อได้ทางเดียวคือ 5′→3′`,`ย้อนดูกฎเหล็กของ DNA polymerase`),
 Q(`DNA ligase ทำหน้าที่อะไร`,["สร้าง RNA primer","เชื่อม Okazaki fragment ด้วยพันธะ phosphodiester","แยก double helix","ตรวจแก้ base ที่ผิด"],1,`DNA ligase ปิดรอยต่อระหว่าง Okazaki fragment ด้วยพันธะ phosphodiester`),
 {t:"sum",pts:["DNA polymerase ต่อได้เฉพาะปลาย 3′-OH → new strand ยาว 5′→3′","Leading: ต่อเนื่องเข้าหา fork","Lagging: เป็นช่วง Okazaki fragment ออกจาก fork แต่ละช่วงเริ่มจาก RNA primer","Primer ถูกแทนด้วย DNA แล้ว DNA ligase เชื่อมรอยต่อ"]}
]},
tx:{k:"4.1",title:"RNA & transcription",sub:"mRNA · tRNA · rRNA · RNA polymerase",steps:[
 T(`<p>DNA อยู่ใน nucleus แต่โรงงานสร้าง protein (ribosome) อยู่ใน cytoplasm จึงต้องมี RNA เป็นตัวกลาง RNA มี 3 ชนิด</p><ul><li><b>mRNA</b> สำเนาของ gene สร้างใน nucleus โดยใช้ DNA เป็น template แล้วส่งไป ribosome</li><li><b>tRNA</b> สั้นเพียง 70–90 nucleotide ขน amino acid มาตาม codon มี anticodon</li><li><b>rRNA</b> รวมกับ protein เป็น ribosome 2 subunit สร้างช่องให้ tRNA มาจับกับ mRNA</li></ul>`,"rnatypes"),
 Q(`RNA ชนิดใดขน amino acid มาที่ ribosome`,["mRNA","rRNA","tRNA","DNA"],2,`tRNA ใช้ anticodon จับคู่กับ codon บน mRNA แล้วส่ง amino acid ให้ ribosome`),

 C(`DNA template ${sq("3′-TAC GGA-5′")} transcribe เป็น mRNA (5′→3′) ได้ลำดับใด`,"rna","AUGCCU",`TAC → AUG และ GGA → CCU จึงได้ 5′-AUG CCU-3′`,`T→A, A→U, G→C, C→G`,[["codon แรก TAC → ?","AUG","T→A, A→U, C→G","rna"],["codon ที่สอง GGA → ?","CCU","G→C, G→C, A→U","rna"]]),

 C(`mRNA ${sq("5′-AUG UUU GGC UGA AAA-3′")} translate ได้ amino acid กี่ตัว`,"num","3",`AUG (Met), UUU (Phe), GGC (Gly) แล้วเจอ UGA จึงหยุด ได้ 3 ตัว`,`มองหา stop codon`,[["codon ที่เท่าไรเป็น stop codon","4","AUG, UUU, GGC แล้วตัวที่ 4 คือ UGA"],["ก่อนถึง stop codon มี amino acid กี่ตัว","3","Met, Phe, Gly"]],"ตัว"),

const eqAns=(v,a,k)=>k==="num"?(v!==""&&Math.abs(parseFloat(v)-parseFloat(a))<1e-9):v===a;

function entry(host,kind,unit,onChange,onEnter){
 host.innerHTML=`<div class="abox"></div><div class="kp">${PADK[kind].map(k=>`<button type="button" class="${kind!=="num"?"b"+k:""}" data-k="${k}">${k}</button>`).join("")}${kind!=="num"?`<button type="button" class="fn" data-k="clear">ล้าง</button>`:""}<button type="button" class="fn" data-k="back">ลบ</button></div>`;
 const box=host.querySelector(".abox"),E={val:"",kind,box,onEnter,max:kind==="num"?7:9};
 const draw=()=>{box.classList.remove("wrong");box.innerHTML=E.val?`${fmtAns(E.val,kind)}${unit?` <span class="unit">${unit}</span>`:""}`:`<span class="ph">แตะปุ่มด้านล่าง หรือพิมพ์บนคีย์บอร์ด</span>`;};
 E.set=v=>{E.val=v;draw();onChange&&onChange(v);};
 E.press=k=>{if(k==="back")E.set(E.val.slice(0,-1));else if(k==="clear")E.set("");else if(E.val.length<E.max){if(k==="."&&(E.val.includes(".")||!E.val))return;E.set(E.val+k);}};

 if(e.key==="Backspace"){pad.press("back");e.preventDefault();e.stopImmediatePropagation();}
 else if(e.key==="Enter"){if(e.target.closest("button"))return;pad.onEnter&&pad.onEnter();e.preventDefault();}
 else if(PADK[pad.kind].includes(k)||(pad.kind==="num"&&e.key===".")){pad.press(pad.kind==="num"?e.key:k);e.stopImmediatePropagation();}},true);
function renderCalc(box,st){
 const a=ans[si]=ans[si]||{done:false,tries:0,val:"",guided:false};
 box.insertAdjacentHTML("beforeend",`<span class="qtag">โจทย์ · พิมพ์คำตอบ${st.unit?` (หน่วย ${st.unit})`:""}</span><p class="q">${st.q}</p>`);
 if(st.vis)mountVis(box,st.vis);
 const w=document.createElement("div");w.className="calc";box.appendChild(w);
 const worked=()=>st.steps?`<ol class="worked">${st.steps.map((s,i)=>`<li style="--d:${(.1+i*.1).toFixed(2)}s"><span>${s[0]} → <b>${fmtAns(s[1],s[3]||"num")}</b><small>${s[2]}</small></span></li>`).join("")}</ol>`:"";
 const finalBox=()=>`<div class="abox right">${fmtAns(st.a,st.k)}${st.unit?` <span class="unit">${st.unit}</span>`:""}</div>`;
 const head=()=>a.guided?"ทำครบทุกขั้นแล้ว":a.first?null:"ถูกแล้ว ในครั้งที่ 2";
 if(a.done){w.innerHTML=finalBox()+(a.guided?"":worked());feedback(box,true,st,[a.val],head());return;}
 if(a.guided){a.guided=false;}
 w.innerHTML=`<div class="ent"></div><div class="btns"><button class="btn ghost" type="button" data-teach>สอนทีละขั้น</button><button class="btn" type="button" data-chk disabled>ตรวจคำตอบ</button></div>`;
 const chk=w.querySelector("[data-chk]");
 const E=entry(w.querySelector(".ent"),st.k,st.unit,v=>{chk.disabled=!v;a.val=v;},()=>check());
 if(a.val)E.set(a.val);
 function check(){if(a.done||a.guided||!E.val)return;a.tries++;
  if(eqAns(E.val,st.a,st.k)){a.done=true;a.first=a.tries===1;pad=null;w.innerHTML=finalBox()+worked();burst(w.firstChild);feedback(box,true,st,[a.val],head());record(a.first);return;}
  E.box.classList.add("wrong");shake(E.box);
  if(a.tries<2)showHint(box,{hint:`${st.hint||GENERIC_HINT} · หรือกด "สอนทีละขั้น"`});else startGuide();}
 chk.onclick=check;
 w.querySelector("[data-teach]").onclick=startGuide;
 function startGuide(){if(a.done||a.guided||!st.steps)return;a.guided=true;pad=null;box.querySelectorAll(".hintbox").forEach(e=>e.remove());
  w.classList.add("guide");w.innerHTML=sayHTML(`<p>มาแยกเป็นขั้นย่อยกัน ตอบให้ถูกทีละขั้น ถ้าผิด 2 ครั้งผมจะเฉลยขั้นนั้นให้</p>`)+`<div class="gsteps"></div>`;step(0);}
 function step(i){const g=w.querySelector(".gsteps");
  if(i>=st.steps.length){a.done=true;a.first=false;pad=null;g.insertAdjacentHTML("beforeend",finalBox());feedback(box,true,st,[],head());record(false);return;}
  const[p,an,x,k="num"]=st.steps[i];let wrong=0;
  const d=document.createElement("div");d.className="gstep";d.innerHTML=`<p><span class="sn">ขั้นที่ ${i+1}/${st.steps.length}</span>${p}</p><div class="ent"></div><button class="btn" type="button" disabled>ตรวจขั้นนี้</button><div class="smsg"></div>`;g.appendChild(d);
  const b=d.querySelector(".btn");const E2=entry(d.querySelector(".ent"),k,"",v=>{b.disabled=!v;},()=>test());
  setTimeout(()=>d.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"}),60);
  const fin=ok=>{d.classList.add("done");d.innerHTML=`<p><span class="sn">ขั้นที่ ${i+1}/${st.steps.length}</span>${p}</p><div class="res">${ok?"✓ ถูก":"เฉลยขั้นนี้"} <b>${fmtAns(an,k)}</b><small>${x}</small></div>`;step(i+1);};
  function test(){if(!E2.val)return;if(eqAns(E2.val,an,k)){fin(true);return;}wrong++;E2.box.classList.add("wrong");shake(E2.box);if(wrong>=2)fin(false);else d.querySelector(".smsg").textContent="ยังไม่ใช่ ลองอีกครั้ง (ผิดอีกครั้งจะเฉลยขั้นนี้ให้)";}
  b.onclick=test;}
}

function burst(el){if(reduce)return;const b=document.createElement("span");b.className="burst";const C=["var(--ok)","var(--accent)","var(--ab)","var(--rec)"];

function renderMCQ(box,st,a,rec){
 const multi=st.t==="multi";
 box.insertAdjacentHTML("beforeend",`<span class="qtag">คำถาม${multi?" · เลือกได้หลายข้อ":""}</span><p class="q">${st.q}</p>`);

 const ol=document.createElement("div");ol.className="opts";box.appendChild(ol);
 st.o.forEach((o,i)=>{const b=document.createElement("button");b.type="button";b.className="opt";b.innerHTML=`<span class="lt">${LET[i]}</span><span>${o}</span><span class="mk"></span>`;b.dataset.i=i;ol.appendChild(b);});
 const btns=[...ol.children];
 const correct=multi?st.a:[st.a];
 function paintDone(){btns.forEach((b,i)=>{b.disabled=true;const isC=correct.includes(i),picked=a.sel.includes(i);
  b.classList.toggle("right",isC&&(picked||!multi));b.classList.toggle("miss",multi&&isC&&!picked);b.classList.toggle("wrong",!isC&&(picked||a.wrong.includes(i)));b.classList.toggle("dim",!isC&&!picked&&!a.wrong.includes(i));
  b.querySelector(".mk").innerHTML=isC?MARK_OK:(picked||a.wrong.includes(i))?MARK_NO:"";});}
 let chk=null;
 if(multi){chk=document.createElement("div");chk.className="btns";chk.innerHTML=`<button class="btn" type="button" disabled>ตรวจคำตอบ</button>`;box.appendChild(chk);chk=chk.firstChild;}
 if(a.done){paintDone();if(chk)chk.parentNode.remove();feedback(box,a.first,st,a.sel);return;}
 btns.forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
  if(multi){const k=a.sel.indexOf(i);if(k<0)a.sel.push(i);else a.sel.splice(k,1);b.classList.toggle("sel",k<0);chk.disabled=!a.sel.length;return;}
  a.tries++;a.sel=[i];
  if(i===st.a){paintDone();burst(b);feedback(box,a.tries===1,st,[i]);rec(a.tries===1);}
  else{a.wrong.push(i);b.classList.add("wrong");b.disabled=true;b.querySelector(".mk").innerHTML=MARK_NO;shake(b);
   if(a.tries<2)showHint(box,st);else{paintDone();feedback(box,false,st,[i]);rec(false);}}
 });
 if(multi)chk.onclick=()=>{a.tries++;const ok=a.sel.length===correct.length&&a.sel.every(i=>correct.includes(i));
  if(ok){paintDone();burst(chk);chk.parentNode.remove();feedback(box,a.tries===1,st,a.sel);rec(a.tries===1);}
  else if(a.tries<2){shake(ol);showHint(box,st);}
  else{paintDone();chk.parentNode.remove();feedback(box,false,st,a.sel);rec(false);}};
}

function renderPF(box,st){
 const a=ans[si]=ans[si]||{done:false,tries:0,cells:[null,null,null,null]};
 const all=[...new Set([...st.mom,...st.dad])];const opts=[];
 all.forEach((x,i)=>all.forEach((y,j)=>{if(j<i)return;if(x==="Ych"&&y==="Ych")return;const k=sortPair(x,y).join(" ");if(!opts.includes(k))opts.push(k);}));
 opts.sort((p,q)=>{const r=s=>s.split(" ").reduce((t,x)=>t+tok(x)[2],0);return r(p)-r(q);});
 const key=(i,j)=>sortPair(st.mom[i],st.dad[j]).join(" ");
 box.insertAdjacentHTML("beforeend",`<span class="qtag">แบบฝึก · Punnett square</span><p class="q">${st.q}</p>`);
 const pf=document.createElement("div");pf.className="pf";
 pf.innerHTML=`<div class="pfp"><div class="par"><small>♀ แม่</small>${gt(st.mom.join(" "))}</div><span class="x">×</span><div class="par"><small>♂ พ่อ</small>${gt(st.dad.join(" "))}</div></div>
  <div class="pgrid"><div class="corner">♀↓ ♂→</div>${st.dad.map((d,j)=>`<div class="gh"><span class="gam" style="--d:${.2+j*.12}s">${alH(d)}</span></div>`).join("")}
  ${st.mom.map((m,i)=>`<div class="gh"><span class="gam" style="--d:${.45+i*.12}s">${alH(m)}</span></div>${st.dad.map((d,j)=>`<button type="button" class="pcell" data-c="${i*2+j}" aria-label="ช่อง แถว ${i+1} คอลัมน์ ${j+1}">?</button>`).join("")}`).join("")}</div>
  <p class="ptip">แตะช่องซ้ำเพื่อเลือก: ${opts.map(o=>gt(o)).join(" → ")}</p>`;
 box.appendChild(pf);
 const cells=[...pf.querySelectorAll(".pcell")];
 const ck=document.createElement("div");ck.className="btns";ck.innerHTML=`<button class="btn" type="button" disabled>ตรวจคำตอบ</button>`;box.appendChild(ck);const cb=ck.firstChild;
 const paint=c=>{const v=a.cells[c];cells[c].innerHTML=v==null?"?":gt(v);cells[c].classList.toggle("filled",v!=null);};
 const reveal=()=>{cells.forEach((el,c)=>{const i=c>>1,j=c&1,k=key(i,j);const ok=a.cells[c]===k;el.disabled=true;el.classList.remove("filled");el.classList.add(ok?"right":"wrong");if(!ok){a.cells[c]=k;el.innerHTML=gt(k)+"<small>เฉลย</small>";}else paint(c);});ck.remove();};
 cells.forEach((el,c)=>{paint(c);el.onclick=()=>{const v=a.cells[c];const n=v==null?0:(opts.indexOf(v)+1)%opts.length;a.cells[c]=opts[n];el.classList.remove("wrong");paint(c);cb.disabled=a.cells.some(x=>x==null);};});
 if(a.done){reveal();feedback(box,a.first,st,[]);return;}
 cb.disabled=a.cells.some(x=>x==null);
 cb.onclick=()=>{a.tries++;let bad=0;cells.forEach((el,c)=>{const k=key(c>>1,c&1);if(a.cells[c]!==k){bad++;el.classList.add("wrong");shake(el);}else{el.classList.add("right");}});
  if(!bad){cells.forEach(el=>el.disabled=true);burst(cb);ck.remove();feedback(box,a.tries===1,st,[]);record(a.tries===1);}
  else if(a.tries<2){showHint(box,st);cells.forEach(el=>{if(!el.classList.contains("wrong"))el.classList.remove("right");});}
  else{reveal();feedback(box,false,st,[]);record(false);}};
}

function renderSum(box,st){
 const tot=qCount(cur),got=ans.filter((a,i)=>a&&a.first&&isQ(L[cur].steps[i])).length;
 const answered=ans.filter((a,i)=>a&&a.done&&isQ(L[cur].steps[i])).length;
 const p=prog[cur];if(answered===tot){p.done=true;p.best=Math.max(p.best||0,got);}saveProg();renderIndex();
 const C=2*Math.PI*40,frac=tot?got/tot:1;
 const nx=ORDER[ORDER.indexOf(cur)+1];
 const msg=answered<tot?`ยังมี ${tot-answered} ข้อที่ยังไม่ได้ตอบ ย้อนกลับไปทำให้ครบได้`:frac===1?"ตอบถูกตั้งแต่ครั้งแรกทุกข้อ เข้าใจบทนี้แล้ว":frac>=.6?"ดีมาก ทบทวนข้อที่พลาดอีกนิดจะแน่นขึ้น":"ไม่เป็นไร ลองทำบทนี้ใหม่อีกรอบ หรือถามติวเตอร์ในจุดที่ยังไม่เข้าใจ";
 box.innerHTML=`<div class="sum">${sayHTML(`<p><b>สรุปบท ${L[cur].k} ${L[cur].title}</b></p><p>${msg}</p>`)}
  <div class="scorebig"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bgc" cx="50" cy="50" r="40"/><circle class="fgc" id="sring" cx="50" cy="50" r="40" transform="rotate(-90 50 50)" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"/></svg><div class="num">${got}<small> / ${tot} ข้อ</small><br><small>ตอบถูกในครั้งแรก</small></div></div>
  <ul class="keypts">${st.pts.map((t,i)=>`<li style="--d:${.15+i*.1}s"><span>${t}</span></li>`).join("")}</ul>
  <div class="btns">${nx?`<button class="btn" type="button" data-nx>บทถัดไป: ${L[nx].k} ${L[nx].title} →</button>`:`<button class="btn" type="button" data-home>กลับหน้าแรก</button>`}<button class="btn ghost" type="button" data-redo>ทำบทนี้ใหม่</button>${sample?`<button class="btn ghost" type="button" data-gen>ให้ติวเตอร์ออกโจทย์เพิ่ม</button>`:""}</div>
  <div id="genBox" style="display:grid;gap:12px;width:100%"></div></div>`;
 const ring=box.querySelector("#sring");loop(t=>A(ring,"stroke-dashoffset",(C*(1-frac*span(t,200,1300))).toFixed(1)),1400);
 const nb=box.querySelector("[data-nx]");if(nb)nb.onclick=()=>{location.hash=nx;};
 const hb=box.querySelector("[data-home]");if(hb)hb.onclick=()=>{location.hash="home";};
 box.querySelector("[data-redo]").onclick=()=>startLesson(cur,0);
 const gb=box.querySelector("[data-gen]");if(gb)gb.onclick=()=>genPractice(gb,box.querySelector("#genBox"));
}

function renderHome(box){
 const next=ORDER.find(l=>!(prog[l]&&prog[l].done));
 box.innerHTML=`<div class="home">${sayHTML(`<p>สวัสดีครับ ผมจะพาเรียน <b>สารพันธุกรรม: โครงสร้าง หน้าที่ และการทำงาน</b> ทีละขั้น เริ่มจาก subunit nucleotide ไปสู่ double helix ผู้ค้นพบ DNA replication จนถึง protein synthesis แล้วจบด้วยแบบฝึกถอดรหัสท้ายสไลด์</p><p>ทุกบทจะอธิบายสั้นๆ พร้อมภาพเคลื่อนไหว แล้วถามคำถามให้ลองคิด ถ้าตอบผิดครั้งแรกจะมีคำใบ้ให้ลองใหม่</p>`)}
  <div class="howto"><div style="--d:.1s"><b>1 · ฟังอธิบาย</b>อ่านสั้นๆ ดูภาพเคลื่อนไหว</div><div style="--d:.2s"><b>2 · ลองตอบ</b>ผิดครั้งแรกได้คำใบ้ ลองใหม่ได้อีกครั้ง</div><div style="--d:.3s"><b>3 · ถามได้ตลอด</b>${sample?"กดปุ่ม \"ถามติวเตอร์\" มุมขวาล่าง":"ใช้ปุ่มย้อนกลับเพื่อทบทวน"}</div></div>
  <div class="btns"><button class="btn" type="button" id="goNext">${next?(prog[next]?`เรียนต่อ: ${L[next].k} ${L[next].title} →`:`เริ่ม ${L[next].k} ${L[next].title} →`):"ทบทวนอีกรอบตั้งแต่บทแรก →"}</button></div>
  <div class="chmap">${CH.map((c,i)=>{const d=c.ls.filter(l=>prog[l]&&prog[l].done).length;return`<a class="chcard" href="#${c.ls[0]}" style="--d:${.2+i*.08}s"><span class="n">${c.n}</span><b>${c.t}</b><small>${d}/${c.ls.length} บท</small><span class="bar"><i style="width:${(d/c.ls.length*100).toFixed(0)}%"></i></span></a>`;}).join("")}</div>
  ${Object.keys(prog).length?`<button class="linkbtn" type="button" id="resetAll">ล้างความคืบหน้าทั้งหมด</button>`:""}</div>`;
 box.querySelector("#goNext").onclick=()=>{location.hash=next||ORDER[0];};
 const r=box.querySelector("#resetAll");if(r)r.onclick=()=>{if(r.dataset.c){prog={};saveProg();renderIndex();renderStep(0);}else{r.dataset.c="1";r.textContent="แตะอีกครั้งเพื่อยืนยันการล้าง";}};
}

/* ---------- focus mode ---------- */
const IC_EXP=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4v4M6 14H2v-4M14 2 9.5 6.5M2 14l4.5-4.5"/></svg>`;
const IC_CLS=`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>`;
function focusMode(on){const p=$("#player");p.classList.toggle("focus",on);document.documentElement.classList.toggle("lock",on);const b=$("#focusBtn");b.innerHTML=(on?IC_CLS+"ออก":IC_EXP+"เต็มจอ");b.setAttribute("aria-pressed",on);}
$("#focusBtn").onclick=()=>focusMode(!$("#player").classList.contains("focus"));
focusMode(false);

/* ---------- routing ---------- */
function route(){const h=location.hash.slice(1);
 if(L[h]){startLesson(h,0);}else if(h===""||h==="home"||cur===null){cur=null;ans=[];renderIndex();renderStep(1);}}
window.addEventListener("hashchange",route);

/* ---------- ask the tutor (sample capability) ---------- */
let sample=null,turns=[],ctl=null;
const RULES=`คุณคือ "ติวเตอร์" วิชาชีววิทยา เรื่องสารพันธุกรรม (nucleotide โครงสร้าง DNA/RNA ผู้ค้นพบ DNA replication transcription translation) สำหรับนักศึกษาเภสัชศาสตร์ปี 1 มหาวิทยาลัยสยาม
- ตอบเป็นภาษาไทย ใช้ศัพท์เฉพาะเป็นภาษาอังกฤษ (เช่น helicase, Okazaki fragment, codon, antiparallel)
- อธิบายทีละขั้น สั้น กระชับ ไม่เกินประมาณ 150 คำ ใช้ตัวอย่างหรือการเปรียบเทียบง่ายๆ
- โจทย์คำนวณ (bp hydrogen bond ความยาวเกลียว ถอดรหัส) ให้แสดงวิธีคิดทีละขั้นและชวนผู้เรียนคิดตาม ถ้าผู้เรียนขอคำตอบตรงๆ จึงบอก
- เขียน base sequence พร้อมทิศ เช่น 5′-AUG-3′ ใช้ค่าตามสไลด์: B-DNA กว้าง 2 nm, 3.4 nm ต่อรอบ, 10 bp ต่อรอบ, A=T 2 พันธะ, G≡C 3 พันธะ
- ใช้ข้อความธรรมดา ใช้ **ตัวหนา** และรายการขึ้นต้นด้วย "- " ได้ ห้ามใช้ตาราง หัวข้อ # หรือ code block
- ข้อมูลต้องถูกต้องตามหลักวิชาการ ถ้าไม่แน่ใจให้บอกตรงๆ
- ถ้าคำถามไม่เกี่ยวกับชีววิทยาหรือเภสัชศาสตร์ ตอบสั้นๆ แล้วชวนกลับมาที่บทเรียน`;
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();};
function stepText(){if(cur===null)return"หน้าแรก";const st=L[cur].steps[si];let s="";
 if(st.say)s+=plain(st.say);if(st.q)s+="คำถาม: "+plain(st.q)+" ตัวเลือก: "+(st.o||[]).map((o,i)=>LET[i]+") "+plain(o)).join(" ");
 if(st.t==="punnett")s+=" (แบบฝึก Punnett square แม่ "+st.mom.join(" ")+" × พ่อ "+st.dad.join(" ")+")";
 if(st.pts)s+="สรุป: "+st.pts.map(plain).join("; ");
 const a=ans[si];if(a&&a.done&&st.why)s+=" เฉลย: "+plain(st.why);return s.slice(0,1500);}
function md(t){let h=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\^(\w+)/g,"<sup>$1</sup>");
 const lines=h.split(/\n/);let out="",ul=false;
 lines.forEach(l=>{const m=l.match(/^\s*[-•]\s+(.*)/);if(m){if(!ul){out+="<ul>";ul=true;}out+=`<li>${m[1]}</li>`;}else{if(ul){out+="</ul>";ul=false;}if(l.trim())out+=`<p>${l}</p>`;}});
 if(ul)out+="</ul>";return out;}
const ERR={not_granted:"ยังไม่ได้อนุญาตให้หน้านี้ใช้ Claude จึงถามติวเตอร์ไม่ได้",sampling_disabled:"บัญชีนี้ใช้ Claude จากหน้านี้ไม่ได้",rate_limited:"ถามถี่เกินไปหรือถึงขีดจำกัดการใช้งาน รอสักครู่แล้วลองใหม่",session_expired:"ต้องลงชื่อเข้าใช้ใหม่ก่อน",refused:"ติวเตอร์ตอบคำถามนี้ไม่ได้ ลองถามใหม่อีกแบบ",prompt_too_large:"คำถามยาวเกินไป ลองถามให้สั้นลง"};
const errMsg=c=>ERR[c]||"การเชื่อมต่อขัดข้อง ลองส่งใหม่อีกครั้ง";
const HIDE=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
function hideSample(){sample=null;$("#fab").hidden=true;closeChat();document.querySelectorAll(".again,[data-gen]").forEach(e=>e.remove());}

function addMsg(cls,html){const m=document.createElement("div");m.className="m "+cls;m.innerHTML=html;$("#msgs").appendChild(m);$("#msgs").scrollTop=1e9;return m;}
const THINK=`<span class="thinking"><i></i><i></i><i></i></span>`;
function updateChatCtx(){$("#chatCtx").textContent=cur?`กำลังเรียน ${L[cur].k} ${L[cur].title}`:"หน้าแรก";}
function openChat(){$("#chat").hidden=false;$("#fab").hidden=true;updateChatCtx();if(!$("#msgs").children.length)addMsg("a",md("ถามอะไรก็ได้เกี่ยวกับบทเรียน ผมเห็นหน้าที่คุณกำลังเรียนอยู่ด้วย เช่น \"ทำไมข้อนี้ได้ 270 พันธะ\" หรือ \"ขอตัวอย่างอีกข้อ\""));setTimeout(()=>$("#chatIn").focus(),50);}
function closeChat(){$("#chat").hidden=true;if(sample)$("#fab").hidden=false;if(ctl)ctl.abort();}
$("#fab").onclick=openChat;$("#chatClose").onclick=closeChat;
const CHIPS=["อธิบายหน้านี้ให้ง่ายกว่านี้","ขอโจทย์คล้ายๆ กันอีก 1 ข้อ","เกี่ยวกับงานเภสัชกรยังไง","จำยังไงไม่ให้สับสน"];
$("#chips").innerHTML=CHIPS.map(c=>`<button type="button">${c}</button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("button");if(b)ask(b.textContent);};
$("#compose").onsubmit=e=>{e.preventDefault();const v=$("#chatIn").value.trim();if(v){$("#chatIn").value="";ask(v);}};
$("#chatIn").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#compose").requestSubmit();}});
async function ask(q){
 if(!sample)return;
 if(ctl){ctl.abort();}
 addMsg("u",esc(q));
 const content=`[บทเรียนตอนนี้: ${cur?L[cur].k+" "+L[cur].title:"หน้าแรก"}]\n[สิ่งที่ผู้เรียนเห็นบนหน้าจอ: ${stepText()}]\n\nคำถามของผู้เรียน: ${q}`;
 turns.push({role:"user",content});
 const m=addMsg("a",THINK);const sb=$("#sendBtn");sb.textContent="หยุด";sb.type="button";
 ctl=new AbortController();const my=ctl;sb.onclick=()=>my.abort();
 try{
  const{text}=await sample([{role:"user",content:RULES},...turns.slice(-10)],{cache:false,signal:my.signal,onText:({text})=>{m.innerHTML=md(text);$("#msgs").scrollTop=1e9;}});
  m.innerHTML=md(text);turns.push({role:"assistant",content:text});
 }catch(e){turns.pop();
  if(e&&e.code==="cancelled"){m.innerHTML=e.text?md(e.text):"<i>หยุดแล้ว</i>";}
  else if(e&&HIDE.includes(e.code)){m.remove();addMsg("note",esc(errMsg(e.code)));if(e.code!=="not_granted")hideSample();}
  else{m.innerHTML=(e&&e.text?md(e.text):"")+`<p><i>${esc(errMsg(e&&e.code))}</i></p>`;}
 }finally{if(ctl===my)ctl=null;sb.textContent="ส่ง";sb.type="submit";sb.onclick=null;}
}
async function explainAgain(box,st,picked){
 const b=box.querySelector("button"),out=box.querySelector(".ans");b.disabled=true;out.hidden=false;out.innerHTML=THINK;
 const prompt=`${RULES}\n\nผู้เรียนตอบคำถามนี้ผิด ช่วยอธิบายใหม่อีกแบบที่ต่างจากเฉลยเดิม ใช้การเปรียบเทียบหรือวิธีคิดทีละขั้น ไม่เกิน 120 คำ ชี้ด้วยว่าคำตอบที่ผู้เรียนเลือกผิดตรงไหน\n\nคำถาม: ${plain(st.q)}\n${st.o?"ตัวเลือก: "+st.o.map((o,i)=>LET[i]+") "+plain(o)).join(" | "):"โจทย์ให้พิมพ์คำตอบ คำตอบที่ถูกคือ "+st.a}\nผู้เรียนเลือก: ${picked&&picked.length&&st.o?picked.map(i=>LET[i]+") "+plain(st.o[i])).join(", "):"เติมช่องไม่ถูก"}\nคำตอบที่ถูก: ${st.o?(Array.isArray(st.a)?st.a:[st.a]).map(i=>LET[i]+") "+plain(st.o[i])).join(", "):""}\nเฉลยเดิม: ${plain(st.why)}`;
 try{const{text}=await sample(prompt,{onText:({text})=>{out.innerHTML=md(text);}});out.innerHTML=md(text);b.remove();}
 catch(e){if(e&&HIDE.includes(e.code)){box.remove();if(e.code!=="not_granted")hideSample();return;}out.innerHTML=esc(errMsg(e&&e.code));b.disabled=false;}
}
async function genPractice(btn,host){
 btn.disabled=true;const old=btn.textContent;btn.textContent="ติวเตอร์กำลังออกโจทย์…";
 const prompt=`${RULES}\n\nออกโจทย์ปรนัยใหม่ 1 ข้อ ระดับนักศึกษาเภสัชศาสตร์ปี 1 สำหรับบทเรียน "${L[cur].title}" ให้ต่างจากตัวอย่างเหล่านี้: ${L[cur].steps.filter(s=>s.q).map(s=>plain(s.q)).join(" | ").slice(0,1500)}\nตอบเป็น JSON เท่านั้น รูปแบบ {"question": string, "options": [4 strings], "answer": 0-3, "explanation": string} ห้ามใส่ markdown ใน string ใช้ข้อความธรรมดา เขียน base sequence พร้อมทิศ เช่น 5′-AUG-3′`;
 try{const d=await sample.json(prompt,{cache:false});
  if(!d||typeof d.question!=="string"||!Array.isArray(d.options)||d.options.length!==4||!(d.answer>=0&&d.answer<=3))throw{code:"invalid_json"};
  const st={t:"mcq",q:md(String(d.question)).replace(/^<p>|<\/p>$/g,""),o:d.options.map(o=>md(String(o)).replace(/^<p>|<\/p>$/g,"")),a:Number(d.answer),why:md(String(d.explanation||""))};
  const card=document.createElement("div");card.className="step in-next";card.style.cssText="padding:16px;border:1px dashed var(--accent);border-radius:14px";host.prepend(card);
  renderMCQ(card,st,{done:false,tries:0,sel:[],wrong:[]},()=>{});
  card.querySelector(".qtag").textContent="โจทย์เพิ่มจากติวเตอร์ (ไม่นับคะแนน)";
  card.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
 }catch(e){if(e&&HIDE.includes(e.code)){if(e.code!=="not_granted")hideSample();btn.remove();return;}host.insertAdjacentHTML("afterbegin",`<p class="ptip">${esc(e&&e.code==="invalid_json"?"ติวเตอร์ออกโจทย์ไม่สำเร็จ กดอีกครั้งได้":errMsg(e&&e.code))}</p>`);}
 finally{btn.disabled=false;btn.textContent=old;}
}
if(window.claude&&window.claude.use){window.claude.use("sample").then(s=>{if(!s)return;sample=s;$("#fab").hidden=false;if(cur===null||L[cur].steps[si].t==="sum")renderStep(0);}).catch(()=>{});}

route();
})();

</script>
<script>
(()=>{

/* codon table */
const B='UCAG',AA='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const A3={F:'Phe',L:'Leu',S:'Ser',Y:'Tyr','*':'Stop',C:'Cys',W:'Trp',P:'Pro',H:'His',Q:'Gln',R:'Arg',I:'Ile',M:'Met',T:'Thr',N:'Asn',K:'Lys',V:'Val',A:'Ala',D:'Asp',E:'Glu',G:'Gly'};
function codonTable(){let h='<table><thead><tr><th></th>'+[...B].map(b=>'<th>'+b+'</th>').join('')+'</tr></thead><tbody>';
 for(let i=0;i<4;i++){h+='<tr><th>'+B[i]+'</th>';for(let j=0;j<4;j++){h+='<td>';for(let k=0;k<4;k++){const cd=B[i]+B[j]+B[k],a=AA[i*16+j*4+k];h+='<div class="'+(a==='*'?'st':cd==='AUG'?'mt':'')+'">'+cd+' '+A3[a]+'</div>';}h+='</td>';}h+='</tr>';}
 return h+'</tbody></table>';}

const SIZES={s15:{n:15,label:'15 ข้อ',sub:'ทบทวนเร็ว ราว 15 นาที'},s30:{n:30,label:'30 ข้อ',sub:'สุ่มครอบคลุมทุกส่วน'},all:{n:BANK.length,label:'ชุดเต็ม',sub:'ทั้ง '+BANK.length+' ข้อในคลัง'}};
const MODES={exam:{label:'สอบจริง',sub:'จับเวลา 1 นาที/ข้อ เฉลยหลังส่ง'},practice:{label:'ฝึกทำ',sub:'ไม่จับเวลา เฉลยทันทีทุกข้อ'}};
const LET=['ก','ข','ค','ง'];
const KEY='dnaExam.v2';
let S={view:'cover',size:'s30',mode:'exam',exam:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtQ=s=>esc(s).replace(/([35]′[-\s]?[ACGTU ]{3,}[-\s]?[35]′|\b[ACGU]{3}(?:\s[ACGU]{3})+\b)/g,'<span class="seq">$1</span>');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&SIZES[v.size]&&MODES[v.mode])return v;}catch(e){}return null;}
try{if(localStorage.getItem('dnaLab.big')==='1')document.documentElement.classList.add('big');const t=localStorage.getItem('dnaLab.theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}

function quotas(n){const by={};BANK.forEach(q=>(by[q.c]=by[q.c]||[]).push(q.id));const tot=BANK.length,ks=Object.keys(by);
 const raw=ks.map(k=>({k,v:n*by[k].length/tot}));raw.forEach(r=>{r.f=Math.floor(r.v);});let left=n-raw.reduce((s,r)=>s+r.f,0);
 raw.slice().sort((a,b)=>(b.v-b.f)-(a.v-a.f)).forEach(r=>{if(left>0){r.f++;left--;}});
 const out={};raw.forEach(r=>out[r.k]=Math.min(r.f,by[r.k].length));return {out,by};}
function build(ids,practice,label){
 const items=ids.map(id=>{const q=BANK[id];const idx=[0,1,2,3];const opts=q.a!=null?idx:shuf(idx);return {id,opts,ans:opts.indexOf(q.a!=null?q.a:0)};});
 return {label,practice,items,resp:items.map(()=>-1),flag:items.map(()=>false),cur:0,el:0,limit:practice?0:ids.length*60000,done:false};}
function newExam(){const sz=SIZES[S.size],pr=S.mode==='practice';const {out,by}=quotas(sz.n);let ids=[];
 Object.keys(out).sort().forEach(k=>{ids=ids.concat(shuf(by[k]).slice(0,out[k]).sort((a,b)=>a-b));});
 S.exam=build(ids,pr,(S.size==='all'?'ชุดเต็ม '+ids.length+' ข้อ':ids.length+' ข้อ')+' · '+MODES[S.mode].label);S.view='exam';save();render();}

 const per={};E.items.forEach((it,i)=>{const c=BANK[it.id].c;per[c]=per[c]||[0,0];per[c][1]++;if(ok[i])per[c][0]++;});

 (weak.length?'<p class="tip">ควรทบทวน: '+weak.map(k=>'บทที่ '+String(k).padStart(2,'0')+' '+SH[k]).join(', ')+'</p>':'<p class="tip">ทำได้ดีทุกบท ลองชุดใหม่เพื่อเจอข้อที่ยังไม่เคยทำ</p>')+

 '<div class="res-actions">'+(wrongN?'<button class="btn primary" data-act="retry">ทำซ้ำเฉพาะข้อที่พลาด ('+wrongN+')</button>':'')+

function paintReview(){const E=S.exam;const list=E.items.map((it,i)=>({it,i})).filter(({it,i})=>filter==='all'||(filter==='wrong'&&E.resp[i]!==it.ans)||(filter==='flag'&&E.flag[i]));
