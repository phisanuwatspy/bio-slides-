<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell &amp; Genetics Squad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* One visual world: night-blue "inside the body" stage with a sunny accent. Stage left, story card right; stacked on phones. */
  --bg:#0e1530;
  --panel:#172048;
  --line:#2a3566;
  --ink:#f4f1ff;
  --muted:#aab2da;
  --accent:#ffcf4a;
  --display:'Mitr','IBM Plex Sans Thai','Loma',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai','Sukhumvit Set','Thonburi','Loma',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top top" "stage card" "ctl card";gap:12px 18px;padding:14px 18px}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:500;font-size:20px}
.brand b{color:var(--accent);font-weight:500}
.count{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.stage-wrap{grid-area:stage;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
.stage{position:relative;aspect-ratio:8/5;width:100%;border-radius:20px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#22306a 0%,#141d44 55%,#0b1129 100%);box-shadow:0 0 0 1px var(--line) inset;cursor:pointer}
.scene{position:absolute;inset:0}
.scene svg{width:100%;height:100%;display:block}
.card{grid-area:card;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;overflow-y:auto;min-height:0}
.tag{display:inline-block;font-family:var(--display);font-size:13px;color:#141a36;background:var(--c,var(--accent));padding:4px 12px;border-radius:999px}
.card h2{font-family:var(--display);font-weight:500;font-size:28px;line-height:1.25;margin:12px 0 4px;text-wrap:balance}
.card .sub{color:var(--muted);font-size:15.5px;margin:0 0 12px;line-height:1.5}
.facts{margin:0}
.facts .f{border-top:1px solid var(--line);padding:10px 0}
.facts dt{font-family:var(--display);font-size:14px;color:var(--c,var(--accent))}
.facts dd{margin:3px 0 0;font-size:16.5px;line-height:1.55}
.controls{grid-area:ctl;display:flex;flex-direction:column;gap:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.btn:hover{border-color:var(--accent)}
.btn.main{background:var(--accent);color:#141a36;border-color:var(--accent);width:54px;height:54px}
.btn svg{width:22px;height:22px}
.btn:focus-visible,.dot:focus-visible,.stage:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.kw{color:var(--ink);font-weight:600;background:rgba(255,255,255,.1);background:color-mix(in srgb,var(--c) 28%,transparent);border-radius:5px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.ez{color:#7ad7f0;font-weight:600;border-bottom:2px dotted #7ad7f0}
.num{color:#ffcf4a;font-weight:600}
.use,.gain{font-weight:600;border-radius:5px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.use{color:#ff8a73;background:rgba(255,138,115,.16)}
.gain{color:#3ddc97;background:rgba(61,220,151,.16)}
.subs{margin:4px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.subs-h{font-family:var(--display);font-size:13px;color:var(--muted);margin-bottom:8px}
.subs-h b{color:var(--c,var(--accent));font-weight:600}
.subs-l{display:flex;flex-wrap:wrap;gap:6px}
.tp{font-family:var(--body);font-size:12.5px;line-height:1.35;text-align:left;padding:5px 9px;border-radius:10px;border:1px solid var(--line);background:#1f2a5c;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.tp:hover{border-color:var(--c,var(--accent));color:var(--ink)}
.tp .sn{font-family:var(--display);color:var(--c,var(--accent));font-weight:600}
.tp[aria-current="true"]{background:var(--c,var(--accent));color:#141a36;border-color:var(--c,var(--accent))}
.tp[aria-current="true"] .sn{color:#141a36}
.tp:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.8}
.chap{font-family:var(--display);font-size:13px;color:var(--muted);margin-bottom:8px}
.chap-b{font-family:var(--display);font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.chap-b[aria-current="true"]{background:var(--accent);color:#141a36;border-color:var(--accent)}
.chap-b b{color:var(--lc,var(--accent));font-weight:700}
.chap-b[aria-current="true"] b{color:#141a36}
.chap-b[aria-current="true"]{background:var(--lc,var(--accent));border-color:var(--lc,var(--accent))}
.chap{font-size:14px}.chap b{font-weight:700}
.grp{flex-basis:100%;font-family:var(--display);font-size:12px;color:var(--c,var(--accent));margin:6px 0 0;font-weight:600}
.chap-b:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pt{font-family:var(--display);fill:#f4f1ff;font-size:16px}
.pt2{font-family:var(--body);fill:#aab2da;font-size:14px}
.chip .ban-r{fill:#24336e;stroke:#4a5fb0;stroke-width:2}
.chip .ban-t{fill:#f4f1ff;font-size:15px}
.chip.on .ban-r{fill:var(--accent);stroke:#141a36}
.chip.on .ban-t{fill:#141a36}
.dot{width:12px;height:12px;border-radius:6px;border:0;background:#3a4785;padding:0;cursor:pointer;transition:width .3s,background .3s}
.dot[aria-current="true"]{background:var(--accent);width:28px}
#full{position:fixed;inset:0;z-index:50;background:#070b1c;display:none;align-items:center;justify-content:center;overflow:hidden}
body.expanded #full{display:flex}
body.expanded{overflow:hidden}
.full-in{display:flex;flex-direction:column;align-items:center;gap:10px;transform-origin:center center}
.full-in.rot{transform:rotate(90deg)}
.mini{display:flex;gap:10px;align-items:center}
.mini .btn{width:44px;height:44px;background:rgba(23,32,72,.9)}
.mini .btn.main{width:50px;height:50px;background:var(--accent);color:#141a36}
/* SVG text */
.lbl{font-family:var(--display);fill:#f4f1ff;paint-order:stroke;stroke:#0e1530;stroke-width:5px;stroke-linejoin:round;font-weight:500}
.ttl{font-family:var(--display);fill:var(--accent);font-weight:600;paint-order:stroke;stroke:#0e1530;stroke-width:6px}
.ban-t{font-family:var(--display);fill:#141a36;font-weight:500;font-size:23px}
.ban-r{fill:var(--accent);stroke:#141a36;stroke-width:3}
.ban.warn .ban-r{fill:#ff8a73}
@media (orientation:landscape) and (max-height:540px){
  .top{display:none}
  .app{grid-template-columns:minmax(0,1fr) 290px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage card" "ctl card";padding:8px 12px;gap:8px 12px}
  .btn{width:40px;height:40px}.btn.main{width:46px;height:46px}
  .card{padding:16px}.card h2{font-size:22px}.facts dd{font-size:15px}
}
@media (max-width:600px), (orientation:portrait){
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;grid-template-areas:"top" "stage" "ctl" "card";padding:12px 14px 22px}
  .card{overflow:visible}
  .card h2{font-size:25px}
  .brand{font-size:18px}
}
html.embed .top,html.embed .dots,html.embed .card>.chap{display:none!important}
html.embed .app{grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage card" "ctl card";padding-top:12px}
@media (max-width:600px),(orientation:portrait){html.embed .app{grid-template-rows:auto auto auto;grid-template-areas:"stage" "ctl" "card"}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Cell &amp; Genetics <b>Squad</b></div>
    <div class="count" id="count">ฉาก 1</div>
  </header>
  <div class="stage-wrap" id="wrap">
    <div class="stage" id="stage" tabindex="0" role="img" aria-label="ภาพเคลื่อนไหวตัวละครยา"></div>
  </div>
  <aside class="card" id="card" aria-live="polite"></aside>
  <nav class="controls" aria-label="ควบคุมการเล่น">
    <div class="bar"><i id="prog"></i></div>
    <div class="row">
      <button class="btn" id="prev" aria-label="ฉากก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn main" id="play" aria-label="หยุดชั่วคราว"></button>
      <button class="btn" id="next" aria-label="ฉากถัดไป"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="btn" id="replay" aria-label="เล่นฉากนี้ใหม่"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
      <button class="btn" id="expand" aria-label="ขยายภาพเต็มจอ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <div class="dots" id="dots"></div>
    </div>
  </nav>
</div>
<div id="full" role="dialog" aria-label="ภาพขยาย">
  <div class="full-in" id="fullIn">
    <div id="fullSlot"></div>
    <div class="mini">
      <button class="btn" id="fprev" aria-label="ฉากก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn main" id="fplay" aria-label="หยุดชั่วคราว"></button>
      <button class="btn" id="fnext" aria-label="ฉากถัดไป"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="btn" id="fclose" aria-label="ย่อกลับ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    </div>
  </div>
</div>
<script>
(()=>{
const K='#141a36';
const S=`stroke="${K}" stroke-width="3" stroke-linejoin="round"`;
const f1=n=>Math.round(n*10)/10;
const P=(x,y,inner,cls='',extra='')=>`<g transform="translate(${x},${y})${extra}"><g class="${cls}">${inner}</g></g>`;
const label=(x,y,t,size=20,anchor='middle',fill)=>`<text class="lbl" x="${x}" y="${y}" font-size="${Math.round(size*1.12)}" text-anchor="${anchor}"${fill?` style="fill:${fill}"`:''}>${t}</text>`;
const banner=(x,y,t,cls='',warn=false)=>P(x,y,`<rect class="ban-r" rx="14"/><text class="ban-t" text-anchor="middle" y="7">${t}</text>`,`ban ${warn?'warn ':''}${cls}`);

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function blob(r,n=12,amp=.08,seed=1){
  const R=rng(seed),pts=[];
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r*(1+(R()*2-1)*amp);pts.push([rr*Math.cos(a),rr*Math.sin(a)])}
  const mid=(p,q)=>[f1((p[0]+q[0])/2),f1((p[1]+q[1])/2)];
  let m=mid(pts[n-1],pts[0]),d=`M${m}`;
  for(let i=0;i<n;i++){const q=mid(pts[i],pts[(i+1)%n]);d+=` Q${f1(pts[i][0])},${f1(pts[i][1])} ${q}`}
  return d+'Z';
}
const star=(r,c,cls='')=>`<path class="${cls}" d="M0 ${-r} L${r*.22} ${-r*.22} L${r} 0 L${r*.22} ${r*.22} L0 ${r} L${-r*.22} ${r*.22} L${-r} 0 L${-r*.22} ${-r*.22}Z" fill="${c}"/>`;
function burst(r,c){let d='';for(let i=0;i<16;i++){const a=i/16*Math.PI*2,rr=i%2?r*.5:r;d+=(i?'L':'M')+f1(rr*Math.cos(a))+' '+f1(rr*Math.sin(a))}return `<path d="${d}Z" fill="${c}" ${S}/>`}

/* ---------- faces ---------- */
const MOUTH={
  smile:`<path d="M-9 8 Q0 16 9 8" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  grin:`<path d="M-11 6 Q0 21 11 6 Z" fill="${K}" stroke="${K}" stroke-width="2" stroke-linejoin="round"/><path d="M-6 12.5 Q0 16.5 6 12.5" fill="#ff7a8a"/>`,
  sad:`<path d="M-8 14 Q0 7 8 14" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  o:`<ellipse cx="0" cy="11" rx="4.5" ry="5.5" fill="${K}"/>`,
  flat:`<path d="M-7 11 H7" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  evil:`<path d="M-11 5 Q-2 15 11 3" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  firm:`<path d="M-8 10 Q0 13 8 10" fill="none" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`
};
const BROW={
  angry:`<path d="M-18 -16 L-5 -11 M18 -16 L5 -11" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  worried:`<path d="M-17 -11 L-6 -16 M17 -11 L6 -16" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`,
  firm:`<path d="M-17 -15 L-5 -13 M17 -15 L5 -13" stroke="${K}" stroke-width="3" stroke-linecap="round"/>`
};
function face(x,y,s=1,o={}){
  let h=`<g transform="translate(${x},${y}) scale(${s})">`;
  if(o.cheek!==false)h+=`<circle cx="-19" cy="7" r="4.5" fill="#ff8fa3" opacity=".65"/><circle cx="19" cy="7" r="4.5" fill="#ff8fa3" opacity=".65"/>`;
  h+=`<g class="eyes"><circle cx="-11" cy="-4" r="7" fill="#fff" stroke="${K}" stroke-width="2.5"/><circle cx="11" cy="-4" r="7" fill="#fff" stroke="${K}" stroke-width="2.5"/><g class="pupils"><circle cx="-10" cy="-3" r="3.6" fill="${K}"/><circle cx="12" cy="-3" r="3.6" fill="${K}"/></g></g>`;
  if(o.lid)h+=`<g class="lid"><path d="M-18.5 -4 A7.5 7.5 0 0 1 -3.5 -4 Z M3.5 -4 A7.5 7.5 0 0 1 18.5 -4 Z" fill="${o.lid}" stroke="${K}" stroke-width="2.5"/></g>`;
  if(o.brow)h+=`<g class="b-a">${BROW[o.brow]}</g>`;
  if(o.toBrow)h+=`<g class="b-b" style="opacity:0">${BROW[o.toBrow]}</g>`;
  h+=`<g class="m-a">${MOUTH[o.m||'smile']}</g>`;
  if(o.to)h+=`<g class="m-b" style="opacity:0">${MOUTH[o.to]}</g>`;
  return h+'</g>';
}

/* ---------- characters ---------- */
function capsule(c1,c2,o={}){
  const sign=o.sign?`<g class="stop"><line x1="52" y1="-24" x2="52" y2="-78" stroke="${K}" stroke-width="5" stroke-linecap="round"/><g transform="translate(52,-104)"><path d="M-12 -29 H12 L29 -12 V12 L12 29 H-12 L-29 12 V-12Z" fill="#ff4d5e" ${S}/><text y="6" text-anchor="middle" font-size="15" font-family="Mitr, Loma, sans-serif" font-weight="600" fill="#fff">STOP</text></g></g>`:'';
  return `<path d="M-12 58 L-15 80 M12 58 L15 80" stroke="${K}" stroke-width="5" stroke-linecap="round"/><ellipse cx="-17" cy="82" rx="10" ry="5" fill="${K}"/><ellipse cx="17" cy="82" rx="10" ry="5" fill="${K}"/>
  <path d="M-29 8 Q-48 22 -46 44" stroke="${K}" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M29 6 Q46 0 52 -22" stroke="${K}" stroke-width="5" fill="none" stroke-linecap="round"/>
  ${sign}
  <rect x="-30" y="-60" width="60" height="120" rx="30" fill="${c2}"/><path d="M-30 0 V-30 A30 30 0 0 1 30 -30 V0 Z" fill="${c1}"/>
  <rect x="-30" y="-60" width="60" height="120" rx="30" fill="none" ${S}/><line x1="-30" y1="0" x2="30" y2="0" ${S}/>
  <path d="M-18 -42 Q-12 -50 -3 -52" stroke="#fff" stroke-opacity=".55" stroke-width="4" fill="none" stroke-linecap="round"/>
  ${face(0,-22,.85,o)}`;
}
function antibody(c,ang=0,o={}){
  const arm=r=>`<g transform="rotate(${r})"><rect x="-10" y="-82" width="20" height="66" rx="10" fill="${c}" ${S}/><rect x="-6" y="-78" width="12" height="18" rx="6" fill="#fff" fill-opacity=".35"/></g>`;
  const extra=o.bomb?`<g class="bomb"><path d="M0 52 Q-30 60 -44 46" stroke="${K}" stroke-width="3" fill="none"/><circle cx="-56" cy="60" r="21" fill="#2b2f4a" ${S}/><path d="M-50 40 q4 -10 12 -10" stroke="#ffcf4a" stroke-width="3" fill="none"/><text x="-56" y="65" text-anchor="middle" font-size="13" font-family="Mitr, Loma, sans-serif" font-weight="600" fill="#fff">DM1</text></g>`:'';
  return `<g transform="rotate(${ang})"><rect x="-10" y="12" width="20" height="70" rx="10" fill="${c}" ${S}/>${arm(-38)}${arm(38)}${extra}</g><circle r="28" fill="${c}" ${S}/>${face(0,2,.8,o)}`;
}
function tablet(c,name,o={}){
  return `<ellipse cx="-12" cy="33" rx="9" ry="5" fill="${K}"/><ellipse cx="12" cy="33" rx="9" ry="5" fill="${K}"/>${o.cape?`<path d="M-20 -18 Q-58 10 -46 44 Q-20 30 0 34 Z" fill="#ff4d6d" ${S}/>`:''}<circle r="30" fill="${c}" ${S}/><path d="M-21 -17 Q-14 -25 -4 -26" stroke="#fff" stroke-opacity=".6" stroke-width="4" fill="none" stroke-linecap="round"/>${o.badge?`<circle cx="22" cy="-22" r="11" fill="#ffcf4a" ${S}/><text x="22" y="-17" text-anchor="middle" font-size="13" font-family="Mitr, Loma, sans-serif" font-weight="600" fill="${K}">${o.badge}</text>`:''}${face(0,4,.72,o)}${name?label(0,58,name,17):''}`;
}
const ANT='#ffffff';
function ambient(seed){
  const R=rng(seed);let h='';
  for(let i=0;i<9;i++){h+=P(f1(R()*800),f1(R()*500),`<circle r="${f1(4+R()*14)}" fill="${ANT}" fill-opacity="${f1(.03+R()*.05)}"/>`,'amb')}
  return h;
}

/* ---------- scenes ---------- */
const OLD=[];

function punnett(x0,y0,cw,chh,cols,rows,cells,o={}){
  let h='';
  cols.forEach((t,c)=>h+=P(f1(x0+c*cw+cw/2),y0-22,`<circle r="17" fill="${o.cc||'#ff9ad5'}" ${S}/>${tx(0,5,t,o.hs||13,'middle','#141a36',600)}`,'ph'));
  rows.forEach((t,r)=>h+=P(x0-24,f1(y0+r*chh+chh/2),`<circle r="17" fill="${o.rc||'#7ad7f0'}" ${S}/>${tx(0,5,t,o.hs||13,'middle','#141a36',600)}`,'ph'));
  cells.forEach((row,r)=>row.forEach(([t,c,hl],k)=>{const [a,b]=t.split('|');h+=P(f1(x0+k*cw+cw/2),f1(y0+r*chh+chh/2),`<rect x="${-cw/2+3}" y="${-chh/2+3}" width="${cw-6}" height="${chh-6}" rx="8" fill="${c}" stroke="${hl?'#ff4d5e':K}" stroke-width="${hl?4:2}"/>${b?tx(0,-3,a,o.fs||14,'middle','#141a36',600)+tx(0,15,b,12,'middle','#141a36',400):tx(0,5,a,o.fs||14,'middle','#141a36',600)}`,`pc${hl?' hl':''}`)}));
  return h;
}
const rbcAg=(r=12)=>rbcD(r)+[[-6,-r*.8],[7,-r*.75],[r,0]].map(([x,y])=>`<circle cx="${f1(x)}" cy="${f1(y)}" r="3" fill="#ffcf4a" stroke="${K}" stroke-width="1"/>`).join('');

/* ---------- L12 Meiosis & Reproduction ---------- */
function hom(c,o,cls,swap){ // homolog: two sister chromatids in colour c; swap = which inner lower arm gets crossing-over class
  const L=88,W=24,a=(th,col,k)=>`<g transform="rotate(${th})"><rect class="${k||''}" x="${-W/2}" y="${-L}" width="${W}" height="${L}" rx="${W/2}" fill="${col}" stroke="${K}" stroke-width="2.5"/></g>`;
  return `<g class="${cls}">${a(-12,c)}${a(192,c,swap==='L'?'xo':'')}${a(12,c)}${a(168,c,swap==='R'?'xo':'')}<circle r="9" fill="#ffcf4a" stroke="${K}" stroke-width="2"/></g>`;
}
const miniX=(c1,c2,s=1)=>`<g transform="scale(${s})">${chromX(c1,c2,13,6)}</g>`;
const cellC=(r,c,inner,o={})=>`<circle r="${r}" fill="${c}" fill-opacity="${o.op||.9}" ${S}/>${o.face!==false?face(0,-r*.45,r/70,{m:o.m||'smile',cheek:false}):''}${inner||''}`;
const sperm=(cls,s=1)=>`<g transform="scale(${s})"><path class="${cls}" d="M12 0 q10 -8 20 0 t20 0 t20 0" stroke="#e8f7ff" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse rx="12" ry="8" fill="#e8f7ff" stroke="${K}" stroke-width="2"/></g>`;

facts:[['การปฏิสนธิ (fertilization)','อสุจิสลัดหางและย่อยส่วนหัว ปล่อย chromosome 23 แท่งเข้าสู่ไข่ จับคู่กับ chromosome อีก 23 แท่งในไข่ หลอมรวมเป็นเซลล์เดียว'],['Morula → Blastocyst','แบ่งตัวแบบทวีคูณจนเป็นก้อนคล้ายผลน้อยหน่า (morula) แล้วเข้าสู่ blastocyst ซึ่งผ่านเข้าโพรงมดลูกและฝังตัว'],['Endometrium','เยื่อบุผนังชั้นในของมดลูก (เยื่อบุโพรงมดลูก) เป็นที่ฝังตัวของตัวอ่อน'],['Trophoblast','ชั้นนอกของเซลล์ตัวอ่อนระยะ blastocyst ช่วยฝังตัวกับผนังมดลูก และเจริญเป็นรก (placenta) ที่แลกเปลี่ยนก๊าซและอาหารให้เอมบริโอ'],['Germ layer','จากนั้นสร้างเนื้อเยื่อ 3 ชั้น: ectoderm, mesoderm, endoderm']],
svg(){
  let co='';for(let i=0;i<14;i++){const a=i/14*Math.PI*2;co+=`<circle cx="${f1(Math.cos(a)*78)}" cy="${f1(Math.sin(a)*78)}" r="6" fill="#ffd6e0" opacity=".8"/>`}

L.mens={ch:11,tag:'L12 · ประจำเดือน',color:'#ff7a8a',dur:16500,title:'รอบประจำเดือน (Menstruation)',sub:'ตอบคำถามในสไลด์: รังไข่ อุณหภูมิ hormone และเยื่อบุมดลูก สัมพันธ์กันอย่างไร',
facts:[['หมายเหตุ','สไลด์ให้กราฟพร้อมคำถาม คำอธิบายนี้สรุปจากกราฟ และความรู้มาตรฐานเพิ่มเติม'],['Follicular phase (วันที่ 0–14)','FSH กระตุ้น follicle ในรังไข่ให้เจริญ follicle สร้าง estradiol สูงขึ้น เยื่อบุมดลูกหนาขึ้น (หลังช่วงมีประจำเดือนวันแรกๆ) อุณหภูมิกายต่ำ'],['Ovulation (ประมาณวันที่ 14)','estradiol สูงสุดก่อนไข่ตก กระตุ้นให้ LH พุ่งสูง (LH surge) และ FSH สูงขึ้นเล็กน้อย ทำให้ไข่ตก'],['Luteal phase (วันที่ 14–28)','follicle ที่เหลือกลายเป็น corpus luteum สร้าง progesterone (และ estradiol) เยื่อบุมดลูกหนาสุดพร้อมรับการฝังตัว อุณหภูมิกายสูงขึ้นประมาณ 0.3–0.5°C จาก progesterone'],['Menses','ถ้าไม่ตั้งครรภ์ corpus luteum เสื่อมเป็น corpus albicans progesterone และ estradiol ลดลง เยื่อบุมดลูกหลุดลอกเป็นประจำเดือน แล้วเริ่มรอบใหม่']],

L.eubac={ch:C,tag:'L13 · Eubacteria',color:'#5aa9ff',dur:14000,title:'Eubacteria: ประโยชน์และโทษ',sub:'ตารางที่ 1 อาณาจักร Monera (Eubacteria) 3 กลุ่ม',
facts:[['1. Gram positive bacteria','รูปร่าง 3 แบบ (กลม ท่อน เกลียว) ผนัง peptidoglycan ติด crystal violet สืบพันธุ์โดยสร้าง endospore ทนสภาพแวดล้อม หรือแบ่งตัว (binary fission)'],['Gram positive: ประโยชน์','Streptomyces sp. (ยาปฏิชีวนะ streptomycin) · Lactobacillus sp. (อุตสาหกรรมหมัก)'],['Gram positive: โทษ','Staphylococcus aureus (สิว หนองอักเสบ) · Clostridium botulinum (สารพิษ) · Bacillus stearothermophilus, B. coagulans (มีแก๊ส ถ่ายท้อง) · B. subtilis (ปนเปื้อนขนมปัง ขนมอบ) · B. cereus (อาหารเป็นพิษ)'],['ข้อผิดพลาดในสไลด์ 1','สไลด์ใส่ Salmonella sp. ไว้ในกลุ่ม Gram positive แต่ Salmonella เป็นแบคทีเรีย Gram negative'],['2. Gram negative bacteria','ประโยชน์: Rhizobium sp. (ตรึงไนโตรเจนในอากาศ) · โทษ: Escherichia coli (อาหารเป็นพิษ ท้องเสีย) · Proteobacteria (ใช้ H2S) · Chlamydia · Spirochete เช่น Leptospira (โรคฉี่หนู) และ Treponema (โรคซิฟิลิส)'],['ข้อผิดพลาดในสไลด์ 2','สไลด์เขียน Chlamydia เป็น "เชื้อโกโนเรีย (หนองใน)" แต่หนองในแท้ (gonorrhea) เกิดจาก Neisseria gonorrhoeae ส่วน Chlamydia trachomatis ทำให้เกิดหนองในเทียม'],['3. Cyanophyta','ประโยชน์: ผลิตอาหารและ O2 · แหล่งโปรตีน (Spirulina) · ตรึงไนโตรเจนโดยสร้าง heterocyst (Nostoc, Anabaena, Oscillatoria) · โทษ: Cyanobacteria blooms น้ำขุ่นและเน่าเสีย · บางชนิดสร้าง cyanotoxin (Microcystis, Anabaena, Oscillatoria)']],

L.fungidiv={ch:C,tag:'L13 · Fungi 4 divisions',color:'#c08a5a',dur:14000,title:'Fungi 4 Divisions',sub:'ตารางที่ 2: แยกตามชนิดสปอร์ พร้อมประโยชน์และโทษ',
facts:[['1. Zygomycota','เส้นใยไม่มีผนังกั้น สปอร์ไม่อาศัยเพศ sporangiospore อยู่ใน sporangium รูปกลม (zygospore) · ประโยชน์: Rhizopus oryzae (อาหารหมัก ผลิต amylase) · R. oligosporus (เทมเป้) · R. nigricans (กรดฟูมาริก) · โทษ: R. stolonifer (ราขนมปัง, bread mold)'],['หมายเหตุ Zygomycota','สไลด์ใส่ Plasmopara viticola (ราน้ำค้างองุ่น) ไว้ในกลุ่มนี้ แต่ปัจจุบันจัดเป็น oomycete (water mold) ไม่ใช่เชื้อราแท้'],['2. Deuteromycota','เส้นใยมีผนังกั้น สืบพันธุ์แบบไม่อาศัยเพศโดยสร้าง conidia · ประโยชน์: Penicillium sp. (ผลิตยา) · Aspergillus oryzae (โคจิ สาเก มิโซะ ซอสถั่วเหลือง) · โทษ: Aspergillus flavus สร้าง aflatoxin ก่อมะเร็งตับ พบในถั่วลิสง ถั่วเหลือง เมล็ดธัญพืชแห้ง'],['3. Ascomycota','เซลล์เดียว (ยีสต์) หรือเส้นใยมีผนังกั้น อยู่บนบก สร้าง ascospore ในถุง ascus (อาศัยเพศ) · conidia และแตกหน่อ (ไม่อาศัยเพศ) · ประโยชน์: Saccharomyces cerevisiae (แอลกอฮอล์ ไวน์ เบียร์ สุรา ขนมปังขึ้นฟู) · Monascus purpureus (อังคัก สีแดงในเต้าหู้ยี้) · โทษ: Candida albicans (ทางเดินอาหาร ผิวหนัง ช่องคลอด) · Cryptococcus albidus (ติดเชื้อฉวยโอกาส)'],['4. Basidiomycota','เส้นใยมีผนังกั้น อัดแน่นเป็นแท่งคล้ายลำต้น สร้าง basidiospore บน basidium · ประโยชน์: เห็ดกินได้ (เห็ดโคน เห็ดหอม เห็ดฟาง เห็ดนางฟ้า) · โทษ: เห็ดพิษ และโรคราสนิมในพืช']],

const fullIn=document.getElementById('fullIn'),fullSlot=document.getElementById('fullSlot');
function fitFull(){
  const W=innerWidth,H=innerHeight,rot=H>W*1.15;
  fullIn.classList.toggle('rot',rot);
  const aw=(rot?H:W)*.97,ah=(rot?W:H)*.97-64;
  const w=Math.max(200,Math.min(aw,ah*1.6));
  stage.style.width=w+'px';stage.style.borderRadius='14px';
}
function setExpanded(on){
  expanded=on;document.body.classList.toggle('expanded',on);
  if(on){fullSlot.appendChild(stage);fitFull();
    const de=document.documentElement;try{const r=de.requestFullscreen&&de.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}catch(e){}
  }else{wrap.appendChild(stage);stage.style.borderRadius='';
    try{if(document.fullscreenElement){const r=document.exitFullscreen();if(r&&r.catch)r.catch(()=>{})}}catch(e){}
    fit();
  }
}
document.getElementById('expand').onclick=()=>setExpanded(true);
document.getElementById('fclose').onclick=()=>setExpanded(false);
document.getElementById('fprev').onclick=()=>document.getElementById('prev').click();
document.getElementById('fnext').onclick=()=>document.getElementById('next').click();
document.getElementById('fplay').onclick=()=>setPlaying(!playing);
document.addEventListener('fullscreenchange',()=>{if(expanded)fitFull()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&expanded)setExpanded(false)});
function fit(){
  if(expanded){fitFull();return}
  const portrait=matchMedia('(max-width:600px), (orientation:portrait)').matches;
  if(portrait){stage.style.width='100%';return}
  const w=wrap.clientWidth,h=wrap.clientHeight;stage.style.width=Math.min(w,h*1.6)+'px';
}
addEventListener('resize',fit);fit();
setPlayIcon();
window.__pause=()=>{if(playing)setPlaying(false)};
const start=()=>{const m=/^#scene-(\d+)$/.exec(location.hash);show(m?Math.min(SC.length-1,Math.max(0,+m[1]-1)):0)};
start();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(curEl)fitBanners(curEl)});
})();
</script>
</body>
</html>
