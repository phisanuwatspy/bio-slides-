<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bio 07–13">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="bio13-touch-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="bio13-icon-192.png">
<title>Bio 07–13 · เรียนครบในที่เดียว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F7F2EA; --surface:#FFFDF9; --ink:#2A2420; --muted:#7A6E64; --line:#E7DED2; --soft:#F0E8DC;
  --brand:#B85A2E; --brand-ink:#FFF8F2;
  --c07:#5E8C2F; --c08:#C27A12; --c09:#A8592A; --c10:#C2364B; --c11:#2F6DB0; --c12:#B8407F; --c13:#16735F;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font:15px/1.5 "IBM Plex Sans Thai Looped",-apple-system,BlinkMacSystemFont,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
.no{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:10px;
  background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);font:700 13px/1 "IBM Plex Sans Thai Looped",sans-serif;font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- home ---------- */
#home{min-height:100%;overflow:auto;padding:calc(var(--st) + 28px) calc(var(--sr) + 20px) calc(var(--sb) + 36px) calc(var(--sl) + 20px)}
.hin{max-width:960px;margin:0 auto;display:grid;gap:22px}
.hd h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.hd p{margin:4px 0 0;color:var(--muted)}
.resume{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;
  background:var(--brand);color:var(--brand-ink);box-shadow:0 14px 30px -18px rgba(184,90,46,.9);transition:transform .2s var(--ease)}
.resume:hover{transform:translateY(-2px)}
.resume:active{transform:scale(.985)}
.resume:focus-visible{outline:3px solid #E8B48F;outline-offset:3px}
.resume .no{background:rgba(255,255,255,.18);color:#fff;width:42px;height:42px;font-size:15px;border-radius:13px}
.resume .tx{flex:1;min-width:0;display:grid}
.resume small{opacity:.85;font-size:13px}
.resume b{font-size:17px;font-weight:600}
.resume .go{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{--c:var(--muted);all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:grid;gap:10px;align-content:start;padding:16px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--ease),box-shadow .25s,border-color .2s;
  animation:rise .5s var(--ease) both;animation-delay:calc(var(--k) * 45ms)}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 45%,var(--line));box-shadow:0 16px 32px -22px color-mix(in srgb,var(--c) 70%,#000)}
.card:active{transform:scale(.98)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.card .top{display:flex;align-items:center;justify-content:space-between}
.card .no{width:40px;height:40px;font-size:15px;border-radius:12px}
.card b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.card span.th{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}
.card .meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.card .pill{padding:2px 8px;border-radius:999px;background:var(--soft)}
.card .bar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.card .bar i{display:block;height:100%;width:var(--p,0%);background:var(--c);border-radius:2px;transition:width .6s var(--ease)}
.card.map{--c:var(--brand);background:linear-gradient(135deg,#FFF7EE,#FFFDF9)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ---------- study ---------- */
#study{position:fixed;inset:0;display:flex;flex-direction:column}
.bar-top{flex:none;position:relative;z-index:5;display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(var(--st) + 8px) calc(var(--sr) + 12px) 8px calc(var(--sl) + 12px)}
.ib{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);transition:color .15s,border-color .15s}
.ib:hover:not(:disabled){color:var(--brand);border-color:var(--brand)}
.ib:disabled{opacity:.4;cursor:not-allowed}
.ib:focus-visible,.chap:focus-visible,.tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.chap{--c:var(--muted);flex:0 1 auto;min-width:0;display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 6px;border-radius:13px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}
.chap:disabled{cursor:not-allowed;opacity:.6}
.chap .no{background:var(--c);color:#fff}
.chap .nm{min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chap .car{flex:none;color:var(--muted);transition:transform .2s}
.chap[aria-expanded="true"] .car{transform:rotate(180deg)}
.sp{flex:1}
.tabs{position:relative;flex:none;display:flex;gap:2px;padding:4px;border-radius:16px;background:var(--soft)}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:12px;background:var(--surface);box-shadow:0 1px 3px rgba(42,36,32,.14);transition:transform .35s var(--ease),width .35s var(--ease)}
.tab{position:relative;z-index:1;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;transition:color .2s}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--c,var(--brand))}
.tab:disabled{cursor:not-allowed;opacity:.38}
.tab svg.i{width:19px;height:19px}
.tab span{line-height:1.7;padding-bottom:1px}
.ovt{font-weight:700;font-size:16px;padding:0 4px}
.menu{position:absolute;z-index:20;top:calc(100% + 6px);left:calc(var(--sl) + 62px);width:min(360px,calc(100vw - 24px));display:grid;gap:2px;padding:8px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 22px 44px -18px rgba(42,36,32,.35);transform-origin:top left;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.menu button{--c:var(--muted);display:flex;align-items:center;gap:11px;min-height:46px;padding:6px 10px 6px 7px;border:0;border-radius:12px;background:transparent;cursor:pointer;text-align:left}
.menu button span.t{display:grid;line-height:1.3}
.menu button small{color:var(--muted);font-size:12.5px}
.menu button:hover,.menu button:focus-visible{background:color-mix(in srgb,var(--c) 8%,#fff);outline:none}
.menu button[aria-current="true"]{background:color-mix(in srgb,var(--c) 12%,#fff)}
.menu button[aria-current="true"] .no{background:var(--c);color:#fff}
.scrim{position:fixed;inset:0;z-index:4}
main{flex:1;min-height:0;position:relative;background:#fff}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:block;opacity:1;transition:opacity .28s ease}
main iframe.ld{opacity:0}
main iframe[hidden]{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--brand);opacity:.25;animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:1;transform:translateY(-4px)}}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 86px);z-index:40;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);animation:pop .25s var(--ease);max-width:calc(100vw - 32px);text-align:center}
.ovh{font-weight:700}

/* phones: tabs move to a bottom bar within thumb reach */
@media (max-width:820px){
  .bar-top{gap:6px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;border-radius:0;gap:0;padding:6px calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px);background:var(--surface);border-top:1px solid var(--line);justify-content:space-around}
  .tabs .ind{display:none}
  .tab{flex:1;flex-direction:column;justify-content:center;gap:2px;height:52px;padding:0 2px;font-size:12px;border-radius:12px}
  .tab[aria-selected="true"]{background:color-mix(in srgb,var(--c,var(--brand)) 10%,#fff)}
  .tab svg.i{width:22px;height:22px}
  main{margin-bottom:calc(var(--sb) + 64px)}
  .toast{bottom:calc(var(--sb) + 80px)}
}
@media (max-width:560px){
  .menu{left:calc(var(--sl) + 10px);right:calc(var(--sr) + 10px);width:auto}
  .menu button small{white-space:normal}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{padding:14px;gap:8px;border-radius:18px}
  .card b{font-size:15.5px}
  .card span.th{font-size:12.5px}
  #home{padding-left:calc(var(--sl) + 14px);padding-right:calc(var(--sr) + 14px)}
}
@media (max-width:420px){.chap .nm{font-size:14px}.hd h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section id="home" hidden>
  <div class="hin">
    <div class="hd"><h1>ชีววิทยา Slide 07–13</h1><p>เลือกบทครั้งเดียว แล้วสลับ ดู · Explore · Tutor · แผนที่ · สอบ ได้ทันที</p></div>
    <button type="button" class="resume" id="resume" hidden></button>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section id="study" hidden>
  <header class="bar-top" id="top">
    <button type="button" class="ib" id="homeBtn" aria-label="หน้าแรก" title="หน้าแรก"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11.5h13V9"/><path d="M10 20.5v-6h4v6"/></svg></button>
    <button type="button" class="chap" id="chapBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><span class="no" id="chapNo"></span><span class="nm" id="chapNm"></span><svg class="i car" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="m6 9 6 6 6-6"/></svg></button>
    <span class="ovt" id="ovt" hidden>แผนที่รวม 7 บท</span>
    <span class="sp"></span>
    <nav class="tabs" id="tabs" role="tablist" aria-label="โหมด"><span class="ind" id="ind"></span></nav>
    <div class="menu" id="menu" role="menu" hidden></div>
  </header>
  <div class="scrim" id="scrim" hidden></div>
  <main id="stage"><div class="loading" id="loading"><div class="dots"><i></i><i></i><i></i></div></div></main>
</section>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const T=[
  {id:"s07",no:"07",lec:1,c:"--c07",sh:"Cell Respiration",th:"การหายใจระดับเซลล์"},
  {id:"s08",no:"08",lec:2,c:"--c08",sh:"Nucleic Acid",th:"โครงสร้าง หน้าที่ของ DNA · RNA"},
  {id:"s09",no:"09",lec:3,c:"--c09",sh:"Gene Expression",th:"การควบคุม gene · ความผิดปกติของ chromosome"},
  {id:"s10",no:"10",lec:4,c:"--c10",sh:"Gene Disorders",th:"โรคทางพันธุกรรม · กฎของ Mendel"},
  {id:"s11",no:"11",lec:5,c:"--c11",sh:"Cell Cycle & Mitosis",th:"วัฏจักรเซลล์ · มะเร็ง · ชะลอวัย"},
  {id:"s12",no:"12",lec:6,c:"--c12",sh:"Meiosis",th:"ไมโอซิส · การสืบพันธุ์"},
  {id:"s13",no:"13",lec:7,c:"--c13",sh:"Microorganisms",th:"ความหลากหลายของจุลินทรีย์"}
];
const IC={
  watch:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>',
  lab:'<path d="M9 3.5h6M10 3.5v5.2L4.8 18a2 2 0 0 0 1.8 2.9h10.8a2 2 0 0 0 1.8-2.9L14 8.7V3.5"/><path d="M7.5 14.5h9"/>',
  tutor:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 1 4 17.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>',
  map:'<circle cx="6" cy="6.5" r="2.3"/><circle cx="18" cy="8" r="2.3"/><circle cx="10" cy="18" r="2.3"/><path d="M8.2 7l7.5.7M7 8.6l2.2 7.2M16.6 10l-5 6.3"/>',
  exam:'<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="m8 12 2.6 2.6L16 9"/>'
};
const TABS=[["watch","ดู"],["lab","Explore"],["tutor","Tutor"],["map","แผนที่"],["exam","สอบ"]];
const LEARN={lab:1,tutor:1,exam:1};
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const byId=id=>T.find(t=>t.id===id);
const lastTab=id=>{const m=ls.get("app-tab-"+id);return TABS.some(t=>t[0]===m)?m:"watch"};
const best=id=>{try{const h=JSON.parse(ls.get("xk-"+id+"-hist")||"[]");return h.length?Math.max(...h.map(x=>x.p)):null}catch(e){return null}};
const seen=id=>{try{return JSON.parse(ls.get("app-seen-"+id)||"{}")}catch(e){return {}}};
const ico=k=>'<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg>';
const home=$("home"),study=$("study"),stage=$("stage"),loading=$("loading"),chapBtn=$("chapBtn"),menu=$("menu"),scrim=$("scrim"),tabsEl=$("tabs"),ind=$("ind");

/* ---------- toast ---------- */
let tt=0;function toast(m){const e=$("toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2200);}

/* ---------- home ---------- */
function renderHome(){
  const g=$("grid");g.innerHTML="";
  T.forEach((t,k)=>{
    const b=best(t.id),s=seen(t.id),n=TABS.filter(x=>s[x[0]]).length;
    const el=document.createElement("button");el.type="button";el.className="card";el.style.setProperty("--c","var("+t.c+")");el.style.setProperty("--k",k);
    el.innerHTML='<div class="top"><span class="no">'+t.no+'</span>'+(b!=null?'<span class="meta"><span class="pill">สอบสูงสุด '+b+'%</span></span>':'')+'</div>'+
      '<div><b>'+t.sh+'</b><span class="th">'+t.th+'</span></div>'+
      '<div class="bar" title="เปิดแล้ว '+n+'/5 โหมด"><i style="--p:'+(n/5*100)+'%"></i></div>';
    el.onclick=()=>go(t.id,lastTab(t.id));
    g.appendChild(el);
  });
  const m=document.createElement("button");m.type="button";m.className="card map";m.style.setProperty("--k",T.length);
  m.innerHTML='<div class="top"><span class="no" style="--c:var(--brand)">'+ico("map").replace('class="i"','class="i" style="width:20px;height:20px"')+'</span></div><div><b>แผนที่รวม 7 บท</b><span class="th">เห็นเส้นเชื่อมข้ามบททั้งหมด · TPAT1</span></div>';
  m.onclick=()=>{location.hash="overview";};
  g.appendChild(m);
  let last=null;try{last=JSON.parse(ls.get("app-last")||"null")}catch(e){}
  const r=$("resume");
  if(last&&byId(last.id)){
    const t=byId(last.id),tb=TABS.find(x=>x[0]===last.tab)||TABS[0];
    r.hidden=false;r.style.setProperty("--c","var("+t.c+")");
    r.innerHTML='<span class="no">'+t.no+'</span><span class="tx"><small>เรียนต่อจากครั้งก่อน</small><b>'+t.sh+' · '+tb[1]+'</b></span><span class="go"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
    r.onclick=()=>go(t.id,tb[0]);
  }else r.hidden=true;
}
function go(id,tab){location.hash=id+"-"+(tab||lastTab(id));}

/* ---------- tabs ---------- */
TABS.forEach(([k,l],i)=>{
  const b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");b.dataset.t=k;
  b.innerHTML=ico(k)+'<span>'+l+'</span>';b.title=l+" ("+(i+1)+")";
  b.onclick=()=>{if(cur)setTab(k);};
  tabsEl.appendChild(b);
});
const tabBtns=[...tabsEl.querySelectorAll(".tab")];
function moveInd(){const a=tabBtns.find(b=>b.getAttribute("aria-selected")==="true");if(!a||getComputedStyle(ind).display==="none")return;ind.style.width=a.offsetWidth+"px";ind.style.transform="translateX("+a.offsetLeft+"px)";}
addEventListener("resize",moveInd);

/* ---------- chapter menu ---------- */
T.forEach(t=>{
  const b=document.createElement("button");b.type="button";b.setAttribute("role","menuitem");b.dataset.id=t.id;b.style.setProperty("--c","var("+t.c+")");
  b.innerHTML='<span class="no">'+t.no+'</span><span class="t">'+t.sh+'<small>'+t.th+'</small></span>';
  b.onclick=()=>{openMenu(false);if(t.id!==cur)go(t.id,tab);};
  menu.appendChild(b);
});
function openMenu(on){menu.hidden=!on;scrim.hidden=!on;chapBtn.setAttribute("aria-expanded",String(on));if(on){const c=menu.querySelector('[aria-current="true"]');c&&c.focus();}}
chapBtn.onclick=()=>openMenu(menu.hidden);scrim.onclick=()=>openMenu(false);
$("homeBtn").onclick=()=>{location.hash="home";};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!menu.hidden){openMenu(false);chapBtn.focus();return;}
  if(study.hidden||!cur||e.altKey||e.ctrlKey||e.metaKey)return;
  const n=+e.key;if(n>=1&&n<=5&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||""))setTab(TABS[n-1][0]);
});

/* ---------- frames ---------- */
let cur=null,tab=null,frames={},examLock=false;
const MODE={
  s07:{sel:"#hubbar .hubtab[data-t]",m:e=>e.dataset.t},
  s08:{sel:".shell .tabs button[data-tab]",m:e=>e.dataset.tab},
  s09:{sel:".tabbar .tabs a[role=tab]",m:e=>e.id.replace("tab-","")},
  s10:{sel:"#gdModes a[data-m]",m:e=>e.dataset.m},
  s11:{sel:".modebar button[data-mode-go]",m:e=>e.dataset.modeGo},
  s12:{sel:".modebar button[data-mode-go]",m:e=>e.dataset.modeGo},
  s13:{sel:".modebar button[data-mode-go]",m:e=>e.dataset.modeGo}
};
const kind=k=>LEARN[k]?"learn":k;
function srcFor(k,t){return k==="learn"?"learn/"+t.id+".html":k==="watch"?"watch.html?lec="+t.lec:"map/p"+t.lec+".html";}
function frame(k){
  if(frames[k])return frames[k];
  const t=byId(cur),f=document.createElement("iframe");
  f.title=t.sh+" · "+k;f.className="ld";f.setAttribute("allow","fullscreen; clipboard-write; autoplay");f.setAttribute("allowfullscreen","");
  f.addEventListener("load",()=>{f.classList.remove("ld");if(frames[kind(tab)]===f)loading.hidden=true;if(k==="learn")wireLearn(f);});
  f.src=srcFor(k,t);stage.appendChild(f);frames[k]=f;return f;
}
function dropFrames(){Object.values(frames).forEach(f=>f.remove());frames={};examLock=false;}
function childDoc(){try{const f=frames.learn;return f&&f.contentDocument&&f.contentDocument.readyState!=="loading"&&f.contentDocument.body?f.contentDocument:null}catch(e){return null}}
const locked=d=>!!(d&&d.body&&d.body.classList.contains("xk-lock"));
let pendingMode=null;
function pickMode(m){const d=childDoc(),cfg=MODE[cur];if(!d||!cfg)return false;const el=[...d.querySelectorAll(cfg.sel)].find(e=>cfg.m(e)===m);if(!el)return false;if(!locked(d)&&el.getAttribute("aria-selected")!=="true"){const top=()=>{try{frames.learn.contentWindow.scrollTo({top:0,behavior:"instant"})}catch(e){}};top();el.click();setTimeout(top,60);}return true;}
function applyPending(){if(pendingMode&&pickMode(pendingMode))setTimeout(sync,80);}
function wireLearn(f){
  let d;try{d=f.contentDocument}catch(e){return}
  if(!d)return;
  new MutationObserver(()=>sync()).observe(d.documentElement,{subtree:true,attributes:true,attributeFilter:["aria-selected","class"]});
  applyPending();setTimeout(applyPending,300);setTimeout(applyPending,900);sync();
}
function sync(){
  const d=childDoc(),cfg=MODE[cur];
  let active=null,lk=false;
  if(d&&cfg){const a=[...d.querySelectorAll(cfg.sel)].find(e=>e.getAttribute("aria-selected")==="true");if(a)active=cfg.m(a);lk=locked(d);}
  if(d){try{d.documentElement.classList.toggle("hub-exam",active==="exam")}catch(e){}}
  if(pendingMode&&active===pendingMode)pendingMode=null;
  if(pendingMode&&LEARN[pendingMode]&&d&&!lk&&active&&active!==pendingMode)setTimeout(applyPending,120);
  // the child's own controls can change mode (e.g. "ไปสอบ" buttons inside Tutor): follow it
  if(active&&LEARN[tab]&&!pendingMode&&active!==tab){tab=active;paintTabs();remember();}
  examLock=lk&&LEARN[tab];
  tabBtns.forEach(b=>{b.disabled=examLock&&b.dataset.t!==tab;b.title=examLock&&b.dataset.t!==tab?"กำลังสอบ ส่งคำตอบก่อนจึงสลับได้":b.title;});
  $("homeBtn").disabled=examLock;chapBtn.disabled=examLock;
}
function remember(){
  ls.set("app-tab-"+cur,tab);ls.set("app-last",JSON.stringify({id:cur,tab}));
  const s=seen(cur);if(!s[tab]){s[tab]=1;ls.set("app-seen-"+cur,JSON.stringify(s));}
  const want="#"+cur+"-"+tab;if(location.hash!==want)history.replaceState(null,"",want);
}
function paintTabs(){
  tabBtns.forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===tab)));
  requestAnimationFrame(moveInd);
}
function setTab(k){
  if(examLock&&k!==tab){toast("กำลังสอบอยู่ ส่งคำตอบก่อนจึงสลับโหมดได้");return;}
  const prev=tab;tab=k;paintTabs();
  const kd=kind(k),f=frame(kd);
  Object.entries(frames).forEach(([x,fr])=>fr.hidden=x!==kd);
  loading.hidden=!f.classList.contains("ld");
  if(prev==="watch"&&k!=="watch"&&frames.watch){try{frames.watch.contentWindow.__pause&&frames.watch.contentWindow.__pause()}catch(e){}}
  if(kd==="learn"){pendingMode=k;applyPending();}
  remember();
}

/* ---------- views ---------- */
function showStudy(id,k){
  const t=byId(id);
  if(cur!==id){dropFrames();cur=id;}
  home.hidden=true;study.hidden=false;openMenu(false);
  study.style.setProperty("--c","var("+t.c+")");
  chapBtn.style.setProperty("--c","var("+t.c+")");$("chapNo").textContent=t.no;$("chapNm").textContent=t.sh;chapBtn.title="Slide "+t.no+" · "+t.th;
  chapBtn.style.display="";tabsEl.style.display="";$("ovt").hidden=true;
  menu.querySelectorAll("button").forEach(b=>b.dataset.id===id?b.setAttribute("aria-current","true"):b.removeAttribute("aria-current"));
  document.title="Slide "+t.no+" · "+t.sh;
  setTab(k);
}
function showOverview(){
  dropFrames();cur=null;tab=null;
  home.hidden=true;study.hidden=false;openMenu(false);
  chapBtn.style.display="none";tabsEl.style.display="none";$("ovt").hidden=false;
  const f=document.createElement("iframe");f.className="ld";f.title="แผนที่รวม";f.setAttribute("allow","fullscreen");
  f.addEventListener("load",()=>{f.classList.remove("ld");loading.hidden=true;});
  f.src="map/p0.html";stage.appendChild(f);frames.over=f;loading.hidden=false;
  document.title="แผนที่รวม · Bio 07–13";
}
function showHome(){dropFrames();cur=null;tab=null;study.hidden=true;home.hidden=false;renderHome();document.title="Bio 07–13 · เรียนครบในที่เดียว";}
// map pages call parent.__show(i): i = chapter index → open its map, null → overview list
window.__show=i=>{if(i==null)location.hash="home";else if(T[i])go(T[i].id,"map");};

/* ---------- routing: #home · #overview · #s09-exam ---------- */
let booted=false;
function route(){
  const h=location.hash.slice(1),m=/^(s\d\d)-(\w+)$/.exec(h);
  if(examLock&&cur){const want="#"+cur+"-"+tab;if(location.hash!==want){history.replaceState(null,"",want);toast("กำลังสอบอยู่ ส่งคำตอบก่อนจึงออกได้");}return;}
  if(m&&byId(m[1])){showStudy(m[1],TABS.some(t=>t[0]===m[2])?m[2]:lastTab(m[1]));}
  else if(h==="overview")showOverview();
  else if(!booted&&!h){ // open straight to where the student left off
    let last=null;try{last=JSON.parse(ls.get("app-last")||"null")}catch(e){}
    booted=true;if(last&&byId(last.id)){showStudy(last.id,last.tab);return;}
    showHome();
  }else showHome();
  booted=true;
}
addEventListener("hashchange",route);
route();
if("serviceWorker" in navigator&&location.protocol==="https:"){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
})();
</script>
