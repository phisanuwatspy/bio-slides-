<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}.back{display:none!important}</style></head><body><style>.top .back{display:none!important}.wrap{padding-block:10px 24px!important}</style><title>DNA · TPAT1 เชื่อมโยง</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: lab-notebook graph-paper stage where a TPAT1-style concept map builds step by step; narration + relation chain in a side panel. Base colors follow Sanger chromatogram convention (A green, C blue, G black, T red). */
:root{
  --bg:#E8EDF0; --surface:#FBFCFD; --ink:#13212C; --muted:#56687A; --line:#C3CFD8; --grid:#E2E9EE;
  --cause:#1E4F8F; --part:#6A7C8B; --inhib:#C7372F; --pair:#0B807C;
  --keyFill:#E1EAF5; --ok:#1C7F46; --bad:#C2372E; --okBg:#E3F3E9; --badBg:#FBE6E4;
  --bA:#178A3E; --bC:#2158C4; --bG:#1B1B1B; --bT:#D02B23; --bU:#8B3FC0;
  --sS:#2158C4; --sR:#B5730C; --agar:#F2E2B0; --dead:#F5D6E1; --new:#0B807C;
  --fd:"Anuphan","IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --fb:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C141B; --surface:#131E27; --ink:#E3EBF1; --muted:#93A6B5; --line:#2B3B48; --grid:#17242E;
  --cause:#86B6F2; --part:#8FA1AF; --inhib:#FF7A70; --pair:#4AC9C1;
  --keyFill:#1A2D41; --ok:#5ED18E; --bad:#FF7D73; --okBg:#123224; --badBg:#3A1A1A;
  --bA:#52D686; --bC:#78AAFF; --bG:#E4E8EC; --bT:#FF716A; --bU:#C78EF8;
  --sS:#78AAFF; --sR:#F0B44C; --agar:#4A3F22; --dead:#4C2335; --new:#4AC9C1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#131E27; --ink:#E3EBF1; --muted:#93A6B5; --line:#2B3B48; --grid:#17242E;
  --cause:#86B6F2; --part:#8FA1AF; --inhib:#FF7A70; --pair:#4AC9C1;
  --keyFill:#1A2D41; --ok:#5ED18E; --bad:#FF7D73; --okBg:#123224; --badBg:#3A1A1A;
  --bA:#52D686; --bC:#78AAFF; --bG:#E4E8EC; --bT:#FF716A; --bU:#C78EF8;
  --sS:#78AAFF; --sR:#F0B44C; --agar:#4A3F22; --dead:#4C2335; --new:#4AC9C1; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6}
.wrap{max-width:1360px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{margin:0;font:500 13px var(--fm);letter-spacing:.06em;color:var(--muted)}
h1{margin:2px 0 0;font:700 32px/1.15 var(--fd);text-wrap:balance}
h1 em{font-style:normal;color:var(--cause)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.legend li{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.legend svg{width:46px;height:16px;flex:none;overflow:visible}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;font:500 16px var(--fb);cursor:pointer}
.tab .n{font:600 13px var(--fm);color:var(--muted)}
.tab[aria-current="true"]{background:var(--cause);border-color:var(--cause);color:var(--surface)}
.tab[aria-current="true"] .n{color:var(--surface);opacity:.75}
.tab:focus-visible,.btn:focus-visible,.opt:focus-visible,.rel:focus-visible{outline:3px solid var(--pair);outline-offset:2px}

.player{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:980px){.player{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:25px 25px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
#svg{display:block;width:100%;height:auto}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:981px){.panel{position:sticky;top:12px;min-height:420px}}
.kicker{margin:0;font:600 13px var(--fm);letter-spacing:.05em;color:var(--cause)}
.panel h2{margin:0;font:700 25px/1.3 var(--fd);text-wrap:balance}
.stext{margin:0;font-size:17.5px;line-height:1.75}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chain:empty{display:none}
.chain .lbl{width:100%;font:600 12px var(--fm);letter-spacing:.06em;color:var(--muted)}
.tok{border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:15px;background:var(--bg)}
.sym{font:700 20px var(--fd);line-height:1}
.sym.cause{color:var(--cause)}.sym.part{color:var(--part)}.sym.inhib{color:var(--inhib)}.sym.pair{color:var(--pair)}.sym.sep{color:var(--muted);font-size:16px}
.controls{margin-top:auto;display:flex;align-items:center;gap:10px}
.dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.on{background:var(--cause)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;font:600 16px var(--fb);cursor:pointer}
.btn.primary{background:var(--cause);border-color:var(--cause);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.score div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.score b{display:block;font:700 28px var(--fd);font-variant-numeric:tabular-nums}
.score span{font-size:14px;color:var(--muted)}

/* ---------- SVG ---------- */
.bA{--c:var(--bA)}.bC{--c:var(--bC)}.bG{--c:var(--bG)}.bT{--c:var(--bT)}.bU{--c:var(--bU)}
.cS{--c:var(--sS)}.cR{--c:var(--sR)}.cX{--c:var(--cause)}
.rv{opacity:0;transform:translateY(10px);transform-box:fill-box;transform-origin:center;transition:opacity .5s ease,transform .5s ease}
.rv.on{opacity:1;transform:none}
.nl{font:600 22px var(--fd);fill:var(--ink)}
.nl.big{font-size:30px;font-weight:700}
.ns{font:400 15px var(--fb);fill:var(--muted)}
.ny{font:500 13px var(--fm);fill:var(--cause)}
.node rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.key rect{fill:var(--keyFill);stroke:var(--cause);stroke-width:2}
.node.now:not(.base):not(.chip) rect{stroke:var(--cause);stroke-width:3}
.node.base rect,.node.chip rect{stroke:var(--c);stroke-width:2.5}
.node.base .nl,.node.chip .nl{fill:var(--c)}
.e path{fill:none;stroke-linecap:round}
.e.cause path{stroke:var(--cause);stroke-width:2.5}
.e.part path{stroke:var(--part);stroke-width:2;stroke-dasharray:6 6}
.e.inhib path{stroke:var(--inhib);stroke-width:2.5}
.e.pair path{stroke:var(--pair);stroke-width:2}
.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease}
.on .draw{stroke-dashoffset:0}
.e.done.cause .main{marker-end:url(#m-cause)}
.e.done.part .main{marker-end:url(#m-part)}
.e.done.inhib .main{marker-end:url(#m-inhib)}
.mk-cause{fill:var(--cause)}.mk-part{fill:var(--surface);stroke:var(--part);stroke-width:1.6}.mk-inhib{fill:var(--inhib)}
.elab rect{fill:var(--surface);stroke:var(--line);stroke-width:1}
.el{font:500 14.5px var(--fb);fill:var(--ink)}
.elab.cause .el{fill:var(--cause)}.elab.inhib .el{fill:var(--inhib)}.elab.pair .el{fill:var(--pair)}.elab.part .el{fill:var(--muted)}.elab.warn .el{fill:var(--inhib)}
.prop{font:500 15px var(--fb);fill:var(--muted)}
.pill rect{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.pill.d rect{stroke:var(--cause)}.pill.r rect{stroke:var(--pair)}
.pt{font:500 18px var(--fb);fill:var(--ink)}
.tb{font:700 19px var(--fm);fill:var(--c)}.sep{fill:var(--muted)}
.rowline{stroke:var(--grid);stroke-width:1.5}
.guide{stroke:var(--line);stroke-width:2;stroke-dasharray:3 6;fill:none}
.cap{font:500 15px var(--fb);fill:var(--muted)}
.cap.strong{fill:var(--ink);font-weight:600}
.mono{font:600 15px var(--fm);fill:var(--ink)}
.bb1{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.bb2{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round}
.nt1{fill:var(--ink)}.nt2{fill:var(--muted)}
.rung{stroke:var(--c);stroke-width:5;stroke-linecap:round}
.bracket{fill:none;stroke:var(--cause);stroke-width:1.8}
.band{fill:var(--bg);stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.mouse .body{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.mouse.dead .body{fill:var(--dead)}
.mouse .tail,.mouse .feet{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.mouse .ear{fill:var(--dead);stroke:var(--ink);stroke-width:2}
.mouse .eye,.mouse .nose{fill:var(--ink)}
.mouse .xeye{stroke:var(--inhib);stroke-width:2.6;stroke-linecap:round}
.dish{fill:var(--surface);stroke:var(--line);stroke-width:2}
.agar{fill:var(--agar)}
.colS{fill:var(--sS)}.colR{fill:var(--sR)}
.old{stroke:var(--ink);stroke-width:5;stroke-linecap:round;fill:none}
.new{stroke:var(--new);stroke-width:5;stroke-linecap:round;fill:none}
.arrowtxt{font:600 26px var(--fd);fill:var(--muted)}
.tile rect{fill:var(--surface);stroke:var(--c);stroke-width:2.2}
.tile.anti rect{stroke-dasharray:5 4;fill:var(--bg)}
.tile text{font:600 24px var(--fm);fill:var(--c)}
.rowl{font:600 19px var(--fd);fill:var(--ink)}
.rows{font:400 14px var(--fb);fill:var(--muted)}
.codon{fill:none;stroke:var(--cause);stroke-width:2}
.pep{stroke:var(--cause);stroke-width:3;stroke-linecap:round}

/* ---------- quiz ---------- */
.quiz{padding:22px clamp(16px,3vw,32px) 32px;background:var(--surface);display:flex;flex-direction:column;gap:22px}
.quiz h3{margin:0;font:700 22px var(--fd)}
.quiz .lead{margin:4px 0 0;color:var(--muted)}
.codes{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.codes span{font-size:15px}
.qa{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.pairq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:17.5px}
.pairq .no{font:600 14px var(--fm);color:var(--muted);min-width:22px}
.pairq .t{border:1px solid var(--line);border-radius:8px;padding:2px 10px;background:var(--bg)}
.pairq .q{font:700 20px var(--fd);color:var(--muted)}
.rels{display:flex;flex-wrap:wrap;gap:6px}
.rel{min-width:64px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font:600 17px var(--fb);cursor:pointer;display:flex;align-items:center;gap:6px;justify-content:center}
.rel .s{font:700 19px var(--fd)}
.rel.cause .s{color:var(--cause)}.rel.part .s{color:var(--part)}.rel.inhib .s{color:var(--inhib)}.rel.pair .s{color:var(--pair)}.rel.none .s{color:var(--muted)}
.qtext{font-size:17.5px;line-height:1.65;margin:0}
.qtext .no{font:600 14px var(--fm);color:var(--muted);margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 16.5px/1.5 var(--fb);cursor:pointer;display:flex;gap:8px}
.opt .k{font-weight:600;color:var(--muted)}
.right{border-color:var(--ok)!important;background:var(--okBg)!important}
.wrong{border-color:var(--bad)!important;background:var(--badBg)!important}
.rel:disabled,.opt:disabled{cursor:default}
.fb{margin:0;font-size:15.5px;line-height:1.65;padding:8px 12px;border-radius:10px;background:var(--bg);border-left:3px solid var(--cause)}
.fb b{font-weight:600}
.fb.ok b{color:var(--ok)}.fb.no b{color:var(--bad)}


/* ---------- motion ---------- */
.rv{transform:translateY(12px) scale(.92);transition:opacity .55s ease,transform .65s cubic-bezier(.34,1.56,.64,1)}
.flowg{opacity:0;transition:opacity .4s}
.e.done .flowg{opacity:1}
.flow{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.e.cause .flow{stroke:var(--cause)}.e.inhib .flow{stroke:var(--inhib)}
@keyframes march{to{stroke-dashoffset:-12}}
.e.part.done .main{animation:march .9s linear infinite}
@keyframes pairPulse{50%{opacity:.3}}
.e.pair.on path{animation:pairPulse 1.8s ease-in-out infinite}
@keyframes nowPulse{0%,100%{stroke-opacity:1}50%{stroke-opacity:.3}}
.node.now rect{animation:nowPulse 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07)}}
.breathe{animation:breathe 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes shrinkp{50%{transform:scale(.88)}}
.shrinkp{animation:shrinkp 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes squish{50%{transform:scaleX(.86)}}
.squish{animation:squish 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.spin{animation:spin 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.drift{animation:drift 2.4s ease-out infinite}
@keyframes blink{50%{opacity:.2}}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.floaty{animation:floaty 2.8s ease-in-out infinite}
.mouse:not(.dead) .body{animation:breathe 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- fullscreen ---------- */
.app{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;align-items:flex-start;gap:10px;min-width:0}
.bar .tabs{flex:1;min-width:0}
.fsb{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px}
.fsb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app.full{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;gap:10px;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app.full .player{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 330px;align-items:stretch}
.app.full .stage{overflow:auto;display:flex;flex-direction:column;justify-content:center}
.app.full #svg{flex:1;height:100%;min-height:0}
.app.full .quiz{flex:none}
.app.full .stage:has(.quiz:not([hidden])){justify-content:flex-start}
.app.full .panel{position:static;overflow:auto;min-height:0}
@media (max-width:980px){
  .app.full .player{flex:none;grid-template-columns:minmax(0,1fr)}
  .app.full #svg{flex:none;height:auto}
}

/* ---------- transitions (on by default, toggle adds .still) ---------- */
.rv{transform:translateY(26px) scale(.82);transition:opacity .6s ease,transform .85s cubic-bezier(.34,1.56,.64,1)}
.draw{transition:stroke-dashoffset 1.1s cubic-bezier(.65,0,.35,1)}
@keyframes stageIn{from{opacity:0;transform:translateX(56px) scale(.96)}}
#svg.in,#quiz.in{animation:stageIn .65s cubic-bezier(.22,1,.36,1)}
.swap{display:flex;flex-direction:column;gap:12px}
@keyframes textIn{from{opacity:0;transform:translateY(16px)}}
.swap.in>*{animation:textIn .55s cubic-bezier(.22,1,.36,1) both}
.swap.in>*:nth-child(2){animation-delay:.07s}.swap.in>*:nth-child(3){animation-delay:.14s}.swap.in>*:nth-child(4){animation-delay:.21s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.node.now.on{animation:bob 2.4s ease-in-out 1.1s infinite}
.elab.now.on rect{animation:nowPulse 1.6s ease-in-out infinite}
.dot{transition:background .3s,transform .3s}
.still .rv,.still .draw,.still .ph rect,.still .ph text{transition:none!important}
.still *,.still *::before{animation:none!important}
.still .flowg{display:none}

/* ---------- relation icons ---------- */
.ico{width:1.25em;height:1.25em;flex:none;vertical-align:-.27em;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ico.cause{color:var(--cause)}.ico.part{color:var(--part)}.ico.inhib{color:var(--inhib)}.ico.pair{color:var(--pair)}.ico.none{color:var(--muted)}
.legend .lg{display:flex;align-items:center;gap:7px;padding:5px 13px 5px 9px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:15.5px;color:var(--ink)}
.legend .lg b{font-weight:600}
.legend .lg svg.ico{width:22px;height:22px;overflow:visible}
.legend .lg.cause{border-color:var(--cause)}.legend .lg.part{border-color:var(--part)}.legend .lg.inhib{border-color:var(--inhib)}.legend .lg.pair{border-color:var(--pair)}
.mk-cause{fill:var(--cause)}
.mk-part{fill:var(--part);stroke:var(--surface);stroke-width:1.6}
.ico.part path{fill:currentColor}
.mk-inhib{fill:var(--surface);stroke:var(--inhib);stroke-width:2.4;stroke-linecap:round}

/* ---------- touch: no double-tap-zoom delay, clear press feedback ---------- */
button,.chip,.tab,.rel,.opt,.rl,.pth,.nd,.eb{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active,.chip:active,.tab:active{filter:brightness(.9)}
button,.chip,.tab{transition:filter .12s,background .25s,border-color .25s,color .25s}
.back{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font:500 14px var(--fb);color:var(--cause);text-decoration:none}.back:hover{text-decoration:underline}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">สารพันธุกรรม · โครงสร้าง หน้าที่ และการทำงาน</p>
      <h1>DNA <em>TPAT1 เชื่อมโยง</em></h1>
    </div>
    <ul class="legend" aria-label="ความหมายของสัญลักษณ์"><li class="lg cause"><svg class="ico cause" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg><b>ทำให้เกิด</b></li><li class="lg part"><svg class="ico part" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h3.5M8 12h3.5M17.5 12m-3.6 0a3.6 3.6 0 1 0 7.2 0a3.6 3.6 0 1 0-7.2 0"/></svg><b>ประกอบด้วย</b></li><li class="lg inhib"><svg class="ico inhib" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0M4.9 4.9l14.2 14.2"/></svg><b>ยับยั้ง</b></li><li class="lg pair"><svg class="ico pair" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg><b>จับคู่กับ</b></li></ul>
