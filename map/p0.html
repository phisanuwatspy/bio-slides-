}

  --cause:#86B6F2; --part:#8FA1AF; --inhib:#FF7A70; --pair:#4AC9C1;
  --keyFill:#1A2D41; --ok:#5ED18E; --bad:#FF7D73; --okBg:#123224; --badBg:#3A1A1A;
  --t-disc:#D9AE62; --t-str:#86B6F2; --t-exp:#B9A2F2; --t-rep:#4AC9C1; --t-chr:#F089BA;
  --t-cyc:#79C77D; --t-div:#F2A15A; --t-can:#FF8A7A; --t-age:#A9B5C1; --t-trt:#5CC6E8; --t-resp:#C4D45A; --t-reg:#A5A8F5; --t-chd:#E58AF0; --t-men:#F0A27A; --t-mon:#5FC8DD; --t-euk:#A3D063; --t-mapp:#F48FB6; --t-rpd:#F2C14E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C141B; --surface:#131E27; --hlk:rgba(255,200,40,.16); --hlb:#D9A520; --ink:#E3EBF1; --muted:#93A6B5; --line:#2B3B48; --grid:#17242E;
  --cause:#86B6F2; --part:#8FA1AF; --inhib:#FF7A70; --pair:#4AC9C1;
  --keyFill:#1A2D41; --ok:#5ED18E; --bad:#FF7D73; --okBg:#123224; --badBg:#3A1A1A;

  --t-cyc:#79C77D; --t-div:#F2A15A; --t-can:#FF8A7A; --t-age:#A9B5C1; --t-trt:#5CC6E8; --t-resp:#C4D45A; --t-reg:#A5A8F5; --t-chd:#E58AF0; --t-men:#F0A27A; --t-mon:#5FC8DD; --t-euk:#A3D063; --t-mapp:#F48FB6; --t-rpd:#F2C14E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6}
.wrap{max-width:1440px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{margin:0;font:500 13px var(--fm);letter-spacing:.06em;color:var(--muted)}
h1{margin:2px 0 0;font:700 32px/1.15 var(--fd);text-wrap:balance}

.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px}
.legend li{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.legend b{color:var(--ink);font-weight:600}
.legend svg{width:46px;height:16px;flex:none;overflow:visible}
.app{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar{display:flex;align-items:flex-start;gap:10px;min-width:0}
.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font:500 14px var(--fb);cursor:pointer;transition:background .25s,border-color .25s}
.chip i{width:11px;height:11px;border-radius:50%;background:var(--tc);flex:none}
.chip[aria-pressed="true"]{border-color:var(--tc);background:var(--tc);color:var(--surface);font-weight:600}
.chip[aria-pressed="true"] i{background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:600 15.5px var(--fb);cursor:pointer}
.btn.primary{background:var(--cause);border-color:var(--cause);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.fsb{flex:none;display:flex;align-items:center;gap:6px;padding:8px 14px}
.fsb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.rl:focus-visible,.rel:focus-visible,.pth:focus-visible,.zoom button:focus-visible{outline:3px solid var(--pair);outline-offset:2px}
.player{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:980px){.player{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#svg{display:block;width:100%;height:auto;aspect-ratio:2655/1640;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#svg.grab{cursor:grabbing}
/* progress */
.cch{position:relative}
.cring{width:18px;height:18px;flex:none;margin-left:-2px}
.cring svg{width:18px;height:18px;transform:rotate(-90deg)}
.cring circle{fill:none;stroke:var(--line);stroke-width:3}
.cring circle.v{stroke:var(--ok);stroke-dasharray:50.27;stroke-dashoffset:50.27;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.prog{margin:14px 0 4px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.ph{display:flex;align-items:center;gap:14px}
.pring{--p:0;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.pring b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font:700 16px var(--fd);font-variant-numeric:tabular-nums}
.pt{margin:0;font:700 17px var(--fd)}.ps{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.pbars{display:grid;gap:4px;margin-top:12px}
.pbar{display:grid;grid-template-columns:30px 1fr 70px 38px;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:4px 2px;border-radius:8px;cursor:pointer;font:500 14px var(--fb);text-align:left}
.pbar:hover{background:var(--surface)}
.pbar .pn{font:600 12px var(--fm);color:var(--muted)}.pbar .pl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .pb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.pbar .pb i{display:block;height:100%;background:var(--ok);border-radius:3px}
.pbar .pv{font:600 12.5px var(--fm);text-align:right;color:var(--muted)}
.pw{margin:12px 0 6px;font:600 13px var(--fm);color:var(--bad)}
/* practice */
.pseg{display:flex;gap:6px;margin-bottom:12px}
.pseg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:7px 6px;font:600 14px var(--fb);cursor:pointer}
.pseg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.xstem{margin:6px 0 12px;font:500 19px/1.55 var(--fd);color:var(--ink)}
.xstem b{color:var(--cause)}
.xopts{display:grid;gap:7px}
.xo{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;font:500 16px/1.45 var(--fb);text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.xo:hover:not(:disabled){border-color:var(--muted)}
.xo .xl{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font:600 14px var(--fd);color:var(--muted)}
.xo.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}.xo.right .xl{background:var(--ok);color:var(--surface)}
.xo.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}.xo.wrong .xl{background:var(--bad);color:var(--surface)}
.xo:disabled{cursor:default}
#xfb{margin-top:12px;display:grid;gap:8px}
.xres{display:flex;gap:6px;margin:10px 0}.xres i{width:22px;height:22px;border-radius:6px;background:var(--line)}.xres i.ok{background:var(--ok)}.xres i.no{background:var(--bad)}
.xhist{display:flex;gap:8px;align-items:flex-end;height:70px;margin-top:6px}
.xhist span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.xhist i{width:100%;max-width:26px;height:calc(var(--h)*52px + 3px);background:var(--cause);border-radius:5px 5px 2px 2px;opacity:.8}
.xhist b{font:600 12px var(--fm);color:var(--muted)}
/* summary */
.sch{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.sch button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:9px;padding:5px 10px;font:600 13px var(--fm);cursor:pointer}
.sch button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.snum{display:grid;gap:6px}
.sn{display:grid;grid-template-columns:minmax(0,auto);gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer;font:400 14.5px/1.5 var(--fb)}
.sn b{font:700 17px var(--fd);color:var(--cause)}.sn span{color:var(--muted)}
.sn:hover{border-color:var(--muted)}
.strap{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15.5px;line-height:1.7}
.spair{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:14px;line-height:1.5;background:var(--surface);border-radius:10px;overflow:hidden}
.spair th,.spair td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.spair thead th{background:var(--bg);font:600 14px var(--fd)}.spair tbody th{color:var(--muted);font-weight:500;white-space:nowrap}
.anim{display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;font:600 15px var(--fd)}
.anim span{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--cause);color:var(--surface);font-size:12px}
.anim:hover{border-color:var(--cause)}
.sw{display:inline-flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.swb{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;font:600 15px var(--fb);color:var(--muted);text-decoration:none;white-space:nowrap;touch-action:manipulation}
.swb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.swb.on{background:var(--cause);color:var(--surface)}
a.swb:hover{color:var(--ink);background:var(--bg)}
.top{align-items:center}
.legend .lg{padding:3px 11px 3px 7px;font-size:14px}.legend .lg svg.ico{width:18px;height:18px}
.ptext.sm{font-size:15px;color:var(--muted);margin:2px 0 10px}
.howd{margin:14px 0 4px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.howd summary{cursor:pointer;padding:11px 14px;font:600 15px var(--fd);list-style:none;display:flex;justify-content:space-between;align-items:center}
.howd summary::-webkit-details-marker{display:none}.howd summary::after{content:"+";font:500 20px var(--fm);color:var(--muted)}.howd[open] summary::after{content:"−"}
.howd .howto{border:0;margin:0;padding:0 12px 12px;background:transparent}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.quick button,.quick a{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 10px;text-align:left;text-decoration:none;cursor:pointer;font-family:var(--fb)}
.quick b{font:600 14.5px var(--fd)}.quick span{font-size:12px;color:var(--muted);line-height:1.35}
.quick button:hover,.quick a:hover{border-color:var(--cause)}
.pbar{padding:2px 2px}.pbars{gap:1px;margin-top:10px}
.sbar{flex-wrap:wrap;gap:8px 14px}.sbar .legend{gap:5px 6px;margin-right:auto}.sbar .hint{display:none}
@media (min-width:1500px){.sbar .hint{display:block}}
#printSum{display:none}
@media print{body>*:not(#printSum){display:none!important}#printSum{display:block;color:#000;font:12px/1.55 "IBM Plex Sans Thai",sans-serif}
 #printSum h1{font:700 20px Anuphan,sans-serif;margin:0 0 8px}#printSum h2{font:700 15px Anuphan,sans-serif;margin:14px 0 4px;border-bottom:1px solid #999}
 #printSum section{break-inside:avoid-page}#printSum ul{margin:2px 0 6px;padding-left:18px}#printSum .pt{margin:4px 0 0;font-weight:600}
 #printSum table{border-collapse:collapse;margin:4px 0 8px}#printSum th,#printSum td{border:1px solid #999;padding:3px 6px;text-align:left}}

/* topic territories */
.zone{opacity:.075;transition:opacity .45s ease;pointer-events:none}.zone rect{fill:var(--tc)}
#svg.foc .zone{opacity:.03}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .zone{opacity:.11}}
:root[data-theme="dark"] .zone{opacity:.11}
/* chips grouped by slide */
.chips.chap{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;flex-wrap:wrap;gap:6px}
.trow{display:flex;flex-wrap:wrap;gap:6px}.trow:empty{display:none}
.cch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px 6px 6px;font:500 14.5px var(--fb);cursor:pointer;transition:background .25s,border-color .25s,box-shadow .25s}
.cch .cno{font:600 12.5px var(--fm);background:var(--bg);color:var(--muted);border-radius:9px;padding:3px 7px;transition:inherit}
.cch .cdots{display:flex;gap:3px}.cch .cdots i{width:7px;height:7px;border-radius:50%}
.cch:hover{border-color:var(--muted)}
.cch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.cch[aria-pressed="true"] .cno{background:var(--ink);color:var(--surface)}
/* ask box */
.ask{margin:16px 0 6px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.askq{margin:0 0 10px;font:600 16.5px var(--fd);display:flex;gap:8px;align-items:center;color:var(--ink)}
.askq .sy{color:var(--cause)}
.ask .search+.search{margin-top:8px}
.ask .btn.ghost{margin-top:10px;width:100%}
.askmsg{margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--muted)}
.askmsg:empty{display:none}
.pth-h{margin-top:18px!important}

#g3{display:block;width:100%;aspect-ratio:2655/1640;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#g3[hidden]{display:none}
#d3[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.zoom{display:flex;gap:6px;flex:none}
.zoom button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:40px;height:40px;padding:0 12px;font:600 18px var(--fb);cursor:pointer}
.zoom button.wide{font-size:15px}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.hint{margin:0;min-width:0;font-size:13.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 2px;font:600 14px var(--fb);white-space:nowrap;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#pane{display:flex;flex-direction:column;gap:12px}
.kick{margin:0;display:flex;align-items:center;gap:8px;font:600 13px var(--fm);letter-spacing:.04em;color:var(--muted)}

'ave>her':{m:'Hershey & Chase ติดฉลาก ³⁵S ที่โปรตีน (มีกำมะถัน) และ ³²P ที่ DNA (มีฟอสฟอรัส) ของ virus แล้วให้ไปติดเชื้อ bacteria พบ ³²P อยู่ในเซลล์ ส่วน ³⁵S อยู่นอกเซลล์ แปลว่าสิ่งที่ virus ฉีดเข้าไปเพื่อสร้างลูกหลานคือ DNA',v:'virus เหมือนเข็มฉีดยา เปลือกโปรตีนคือกระบอกที่อยู่ข้างนอก ส่วน DNA คือยาที่ถูกฉีดเข้าไปข้างใน',f:'การทดลองนี้ยืนยันผลของ Avery ด้วยวิธีที่ต่างกันสิ้นเชิง ทำให้วงการยอมรับว่า DNA คือสารพันธุกรรม'},
'cha>wat':{m:'ทุก species มี A = T และ G = C เสมอ แม้สัดส่วนรวมจะต่างกัน ตัวเลขที่เท่ากันพอดีแบบนี้บอกว่าเบสต้องจับเป็นคู่ A กับ T และ G กับ C',v:'เหมือนนับถุงเท้าในลิ้นชักแล้วได้ข้างซ้ายเท่าข้างขวาทุกครั้ง แสดงว่ามันถูกเก็บมาเป็นคู่',f:'ถ้าไม่มีกฎนี้ Watson & Crick จะไม่รู้ว่าเบสควรจับคู่แบบไหนในแกนกลางของเกลียว'},
'fra>wat':{m:'ภาพ X-ray (Photo 51) เป็นรูปกากบาท แสดงว่าเป็นเกลียว ระยะซ้ำบอกว่าหนึ่งรอบยาว 3.4 nm และกว้าง 2 nm และข้อมูลยังชี้ว่าหมู่ phosphate อยู่ด้านนอก',v:'เหมือนเห็นเงาของบันไดวน แม้ไม่เห็นตัวจริงก็บอกได้ว่าวนกี่รอบและกว้างเท่าไร',f:'ถ้าไม่มีภาพนี้ จะไม่รู้ขนาดและรูปร่างที่ต้องสร้างแบบจำลองให้ตรง'},
'wat>dna':{m:'Watson & Crick รวมกฎ A = T, G = C เข้ากับขนาดจากภาพ X-ray ได้แบบจำลองสองสายสวนทางกัน (antiparallel) แกน sugar–phosphate อยู่นอก คู่เบสอยู่ใน แบบจำลองนี้ยังอธิบายการจำลองตัวเองได้ทันที เพราะแต่ละสายเป็นแม่แบบให้อีกสาย',v:'บันไดลิงที่บิดเป็นเกลียว ราวบันไดคือ sugar–phosphate ส่วนขั้นบันไดคือคู่เบส',f:'ถ้าไม่รู้โครงสร้างนี้ จะอธิบายไม่ได้ว่าข้อมูลพันธุกรรมถูกคัดลอกอย่างแม่นยำได้อย่างไร'},
'nt>dna':{m:'nucleotide แต่ละตัวต่อกันด้วย phosphodiester bond ระหว่าง 3′-OH ของน้ำตาลตัวหนึ่งกับหมู่ phosphate ที่ 5′ ของตัวถัดไป เกิดเป็นสายที่มีทิศ 5′ → 3′',v:'เหมือนตัวต่อเลโก้ที่มีปุ่มด้านเดียว ต่อได้แค่ทิศทางเดียว สายจึงมีหัวและท้าย',f:'ถ้าไม่มีทิศ 5′ → 3′ ก็จะไม่มีเรื่อง antiparallel และไม่มี Okazaki fragment ในการจำลอง DNA'},
'bp>dna':{m:'purine (2 วง) จับกับ pyrimidine (1 วง) ทุกคู่จึงกว้างรวมเท่ากัน เกลียวกว้าง 2 nm ตลอดสาย hydrogen bond แต่ละพันธะอ่อน แต่มีจำนวนมาก สายจึงเกาะกันแน่นและยังแยกออกได้เมื่อต้องคัดลอก',v:'เหมือนซิปที่ฟันแต่ละซี่ยึดกันเบา ๆ แต่รูดปิดแล้วแน่น และรูดเปิดได้เมื่อต้องการ',f:'ถ้าเบสจับคู่ผิด (mismatch) เกลียวจะโป่งหรือแคบผิดรูป และถ้าไม่ได้ซ่อมจะกลายเป็นการกลายพันธุ์'},
'dna>tx':{m:'RNA polymerase อ่าน DNA สายแม่แบบจาก 3′ ไป 5′ แล้วสร้าง RNA ที่คู่สมกันทิศ 5′ → 3′ โดยใช้ U แทน T เฉพาะช่วงที่เป็น gene ที่เซลล์ต้องการใช้ในตอนนั้น',v:'DNA เป็นตำราต้นฉบับที่ห้ามนำออกจากห้องสมุด (nucleus) จึงถ่ายเอกสารเฉพาะหน้าที่ต้องใช้ออกไปแทน',f:'ถ้าถอดรหัสไม่ได้ gene ก็ไม่ถูกใช้ เซลล์จึงสร้างโปรตีนที่ต้องการไม่ได้'},
'rnap>tx':{m:'RNA polymerase จับที่ promoter ของ gene คลายเกลียวเฉพาะช่วงนั้น แล้วต่อ ribonucleotide ได้เลยโดยไม่ต้องมี primer ซึ่งต่างจาก DNA polymerase',v:'RNA polymerase คือเครื่องถ่ายเอกสาร ส่วน promoter คือจุดบอกว่าให้เริ่มถ่ายตรงไหน',f:'ถ้า RNA polymerase ถูกยับยั้ง จะไม่มี mRNA ใหม่ และการสร้างโปรตีนหยุดตามไปด้วย'},
'rif>rnap':{m:'Rifampicin จับกับ RNA polymerase ของแบคทีเรีย (β subunit) ทำให้ต่อสาย RNA ต่อไปไม่ได้ ส่วน RNA polymerase ของคนมีรูปร่างต่างกัน ยาจึงเป็นพิษเฉพาะต่อเชื้อ',v:'เหมือนกุญแจที่เสียบล็อกเครื่องถ่ายเอกสารได้เฉพาะยี่ห้อของแบคทีเรีย',fl:'ใช้ทางคลินิก',f:'เป็นยาหลักรักษาวัณโรค ทำให้ปัสสาวะ น้ำตา และเหงื่อเป็นสีส้มแดง และเป็น CYP inducer ที่ทำให้ระดับยาอื่นลดลง เช่น ยาคุมกำเนิด'},
'tx>mrna':{m:'สิ่งที่ได้ครั้งแรกในยูคาริโอตคือ pre-mRNA ซึ่งต้องเติม 5′ cap และ poly-A tail และตัด intron ออกก่อน จึงเป็น mRNA ที่ออกจาก nucleus ได้',v:'ถ่ายเอกสารมาแล้วต้องตัดหน้าโฆษณาทิ้ง เย็บปก และติดสันก่อนส่งออกไปใช้',f:'ถ้าตัดต่อผิด ลำดับ codon จะเลื่อน และได้โปรตีนผิดรูปหรือไม่ทำงาน'},
'mrna>tl':{m:'ribosome อ่าน mRNA จาก 5′ ไป 3′ ทีละ 3 เบส (codon) เริ่มที่ AUG ซึ่งแปลเป็น Met และหยุดเมื่อเจอ codon หยุด UAA, UAG หรือ UGA โดย 64 codon ใช้แทน amino acid 20 ชนิด',v:'mRNA เป็นสูตรอาหารที่เขียนเป็นคำละ 3 ตัวอักษร ribosome คือพ่อครัวที่อ่านทีละคำ',f:'ถ้าเบสหายไป 1 ตัว (frameshift) ทุก codon หลังจุดนั้นจะอ่านผิดหมด'},
'trna>tl':{m:'tRNA มี anticodon ที่จับคู่สมกับ codon และปลาย 3′ แบก amino acid ที่ตรงกัน โดยมี enzyme aminoacyl-tRNA synthetase คอยเติม amino acid ให้ถูกตัว',v:'tRNA คือพนักงานส่งของที่ถือบัตรหมายเลข (anticodon) กับของ (amino acid) มาด้วย ถ้าบัตรตรงกับช่อง (codon) ก็วางของลงได้',f:'ถ้า tRNA แบก amino acid ผิดตัว ลำดับโปรตีนจะผิด แม้ mRNA จะถูกต้อง'},
'trna>rna':{m:'RNA มี 3 ชนิดตามหน้าที่ mRNA นำรหัส tRNA เป็นตัวแปลรหัสเป็น amino acid และ rRNA เป็นโครงสร้างของ ribosome และเป็นตัวเร่งการสร้าง peptide bond',v:'ในครัวเดียวกันมีสูตรอาหาร (mRNA) คนส่งวัตถุดิบ (tRNA) และโต๊ะทำอาหาร (rRNA)',f:'ขาดชนิดใดชนิดหนึ่งก็สร้างโปรตีนไม่ได้'},
'tl>prot':{m:'amino acid ต่อกันด้วย peptide bond เป็นสาย polypeptide แล้วพับตัวเป็นรูปสามมิติจึงทำงานได้ หนึ่ง gene จึงกำหนดหนึ่ง polypeptide',v:'ร้อยลูกปัดเป็นสายแล้วพับเป็นรูปร่าง รูปร่างที่พับได้คือสิ่งที่กำหนดหน้าที่',f:'ถ้าพับผิดรูป โปรตีนอาจทำงานไม่ได้ เช่น enzyme ที่ไม่มีบริเวณเร่งปฏิกิริยา'},
'dna>rep':{m:'แต่ละสายเป็นแม่แบบ เบสใหม่จับคู่ตามกฎ A–T และ G–C จึงได้ 2 โมเลกุลที่เหมือนเดิม โดยแต่ละโมเลกุลมีสายเดิม 1 สายและสายใหม่ 1 สาย (semi-conservative) ซึ่ง Meselson & Stahl พิสูจน์ด้วย ¹⁵N และ ¹⁴N',v:'แยกซิปออกเป็น 2 ซีก แล้วสร้างอีกซีกประกบให้แต่ละซีก ได้ซิป 2 เส้นที่เหมือนกัน',f:'ถ้าจับคู่เบสผิดแล้วไม่ได้ซ่อม ความผิดนั้นจะถูกส่งต่อให้เซลล์ลูกเป็นการกลายพันธุ์'},
'hel>rep':{m:'Helicase ใช้ ATP สลาย hydrogen bond ระหว่างคู่เบส แยกสองสายออกเป็น replication fork โดยมี topoisomerase คลายการบิดสะสมด้านหน้า และ SSB จับสายเดี่ยวไม่ให้กลับมาประกบกัน',v:'Helicase คือหัวรูดซิป topoisomerase คือคนคลายเชือกที่บิดเป็นเกลียวด้านหน้า',f:'ถ้าไม่มี helicase สายจะไม่แยก และ DNA polymerase ไม่มีแม่แบบให้อ่าน'},
'prim>rep':{m:'DNA polymerase เริ่มต่อสายเองไม่ได้ ต้องมีปลาย 3′-OH ให้ต่อ primase จึงสร้าง RNA primer สั้น ๆ ไว้ก่อน แล้วภายหลังจึงตัด primer ออกและแทนด้วย DNA',v:'เหมือนต้องมีด้ายนำร่องผูกไว้ก่อน เครื่องเย็บถึงจะเย็บต่อได้',f:'ไม่มี primer ก็เริ่มจำลองไม่ได้ สาย lagging ต้องใช้ primer ใหม่ทุกท่อน'},
'pol>rep':{m:'DNA polymerase เติม nucleotide ได้ที่ปลาย 3′ เท่านั้น สายจึงยาวในทิศ 5′ → 3′ สาย leading สร้างได้ต่อเนื่อง ส่วนสาย lagging ต้องสร้างเป็นท่อน (Okazaki fragment) และมันยังตรวจทานแก้เบสที่ผิดได้ (proofreading)',v:'คนปูกระเบื้องที่เดินหน้าได้ทางเดียว อีกฝั่งจึงต้องปูเป็นช่วงสั้น ๆ ถอยหลังไปทีละช่วง',f:'ถ้า proofreading เสีย อัตราการกลายพันธุ์จะสูงขึ้นมาก'},
'lig>rep':{m:'หลังเปลี่ยน RNA primer เป็น DNA แล้ว ระหว่าง Okazaki fragment ยังมีรอยขาด DNA ligase สร้าง phosphodiester bond ปิดรอยขาดนั้น สายจึงต่อเนื่องเป็นเส้นเดียว',v:'กาวที่ทาปิดรอยต่อระหว่างแผ่นกระเบื้อง',f:'ไม่มี ligase สาย lagging จะเป็นท่อน ๆ และแตกหักง่าย'},
'g1>s':{m:'ปลาย G1 มี restriction point ถ้าเซลล์โตพอ มีสารอาหารและได้รับสัญญาณให้แบ่ง ก็จะผ่านเข้า S และมุ่งไปสู่การแบ่งเซลล์โดยไม่ย้อนกลับ',v:'ด่านเก็บค่าผ่านทาง ผ่านแล้วต้องไปต่อจนสุดทาง',f:'ถ้าผ่านด่านได้ง่ายเกินไปทั้งที่ไม่ควร เซลล์จะแบ่งตัวเกินความจำเป็น ซึ่งเป็นลักษณะของมะเร็ง'},
's>rep':{m:'S ย่อมาจาก synthesis ระยะนี้เป็นระยะเดียวที่ DNA ถูกจำลอง ปริมาณ DNA ต่อเซลล์จึงเพิ่มเป็น 2 เท่า แต่จำนวน chromosome ยังเท่าเดิม',v:'ถ่ายสำเนาทุกหน้าของตำราก่อนแบ่งให้ลูก 2 คน คนละชุด',f:'ถ้าจำลองไม่ครบ checkpoint ที่ G2 จะไม่ให้เข้าสู่การแบ่งเซลล์'},
's>g2':{m:'หลังจำลอง DNA เสร็จ เซลล์เข้า G2 เพื่อตรวจว่าจำลองครบและถูกต้อง สร้างโปรตีนที่ใช้แบ่งเซลล์ และเตรียม centrosome 2 อัน (จำลองไว้ตั้งแต่ระยะ S) ให้พร้อมสร้าง spindle',v:'ตรวจสำเนาทุกหน้าอีกรอบก่อนแจกจริง',f:'ถ้าข้าม G2 ไปเลย ความผิดพลาดจากการจำลองจะถูกส่งต่อให้เซลล์ลูก'},
'g2>m':{m:'cyclin B จับกับ CDK1 กลายเป็นสวิตช์เริ่ม mitosis ทำให้ chromosome หดตัว nuclear envelope สลาย และเริ่มสร้าง spindle',v:'ไฟเขียวที่สั่งให้ทุกขั้นตอนของการแบ่งเริ่มพร้อมกัน',f:'ถ้า cyclin B–CDK1 ไม่ทำงาน เซลล์จะค้างอยู่ที่ G2'},
'g1>g0':{m:'เซลล์ที่ไม่ได้รับสัญญาณให้แบ่งจะออกจากวัฏจักรไปอยู่ G0 และยังทำหน้าที่ปกติได้ เช่น เซลล์ประสาทและกล้ามเนื้อหัวใจ ส่วนเซลล์ตับอยู่ G0 แต่กลับมาแบ่งได้เมื่อตับเสียหาย',v:'จอดรถพักข้างทาง เครื่องยังติดอยู่ แต่ยังไม่ออกเดินทาง',f:'ยาที่ออกฤทธิ์กับเซลล์ที่กำลังแบ่งตัวจะไม่ค่อยมีผลกับเซลล์ระยะ G0'},
'cdk>s':{m:'cyclin D–CDK4/6 และ cyclin E–CDK2 เติมหมู่ phosphate ให้โปรตีน Rb ทำให้ Rb ปล่อย E2F ออกมา แล้ว E2F จึงเปิด gene ที่ใช้จำลอง DNA เซลล์จึงเข้าสู่ S',v:'Rb คือเบรกมือ CDK คือมือที่ปลดเบรกมือ ส่วน E2F คือเครื่องยนต์ที่ได้เดินหน้า',f:'ถ้า CDK ทำงานมากเกินไป เซลล์จะผ่านเข้า S ตลอดเวลา และแบ่งตัวไม่หยุด'},
'palbo>cdk':{m:'Palbociclib ยับยั้ง CDK4/6 ทำให้ Rb ไม่ถูกเติมหมู่ phosphate Rb จึงยังจับ E2F ไว้ และเซลล์มะเร็งค้างอยู่ที่ G1',v:'ล็อกมือที่ปลดเบรกมือ รถจึงยังจอดนิ่ง',fl:'ใช้ทางคลินิก',f:'ใช้ร่วมกับยาต้านฮอร์โมนในมะเร็งเต้านมชนิด HR+ และ HER2− ผลข้างเคียงที่พบบ่อยคือ neutrophil ต่ำ จึงต้องตรวจเลือดเป็นระยะ'},
'chk>m':{m:'checkpoint ที่ G2/M ตรวจว่า DNA จำลองครบและไม่เสียหาย ส่วน checkpoint ใน M (spindle checkpoint) รอจนทุก kinetochore จับ microtubule ครบก่อนจะยอมให้เข้า anaphase',v:'เจ้าหน้าที่ตรวจความพร้อมก่อนเครื่องบินขึ้น ถ้าไม่ผ่านก็ห้ามขึ้น',f:'ถ้า checkpoint เสีย เซลล์ที่ DNA เสียหายหรือ chromosome ไม่ครบจะยังแบ่งต่อ เกิดเซลล์ลูกที่ผิดปกติ'},
'dmg>chk':{m:'โปรตีนตรวจจับความเสียหาย (เช่น ATM และ ATR) รับรู้ DNA ที่หักหรือผิดรูป แล้วส่งสัญญาณไปที่ checkpoint ให้หยุดวัฏจักรไว้ก่อน',v:'สัญญาณกันขโมยที่ดังเมื่อมีรอยร้าว แล้วล็อกประตูไว้ก่อน',f:'ถ้าตรวจจับไม่ได้ ความเสียหายจะถูกคัดลอกต่อไปเรื่อย ๆ'},
'm>pro':{m:'M phase เริ่มที่ prophase chromatin หดตัวจนเห็นเป็นแท่ง nucleolus หายไป centrosome แยกไปคนละขั้วและเริ่มสร้าง spindle',v:'เก็บของในห้องให้เป็นกล่อง ๆ ก่อนย้ายบ้าน ถ้ายังเป็นเส้นยาวพันกันจะแบ่งไม่ได้',f:'ถ้า chromosome ไม่หดตัว จะพันกันและขาดระหว่างถูกดึงแยก'},
'pro>meta':{m:'ระยะ prometaphase nuclear envelope สลายและ kinetochore จับ microtubule จากนั้นใน metaphase ทุก chromosome ถูกดึงจากสองขั้วด้วยแรงเท่ากันจนมาเรียงกลางเซลล์',v:'ชักเย่อที่ทั้งสองทีมออกแรงเท่ากัน เชือกจึงนิ่งอยู่ตรงกลาง',f:'ระยะ metaphase เห็น chromosome ชัดที่สุด จึงใช้ทำ karyotype นับจำนวน chromosome'},
'meta>ana':{m:'เมื่อ kinetochore ทุกตัวจับ microtubule ครบ APC/C จะกระตุ้น separase ให้ตัด cohesin sister chromatids จึงแยกเป็น daughter chromosomes และถูกดึงไปคนละขั้วเมื่อ microtubule หดสั้นลง',v:'ตัดเชือกที่มัดฝาแฝดไว้ แล้วแต่ละคนถูกดึงกลับไปที่ทีมของตน',f:'ถ้าแยกไม่เท่ากัน (nondisjunction) เซลล์ลูกจะได้ chromosome เกินหรือขาด'},
'ana>cyto':{m:'ระยะ telophase มี nucleus ใหม่ 2 อันก่อตัวที่สองขั้ว chromosome คลายตัว แล้ว cytokinesis แบ่ง cytoplasm ออกเป็น 2 ส่วน ซึ่งมักเริ่มเกิดซ้อนกับ telophase',v:'สร้างผนังกั้นห้องใหม่ หลังจากย้ายของไปไว้คนละฝั่งเรียบร้อยแล้ว',f:'ถ้าแบ่ง nucleus แล้วไม่แบ่ง cytoplasm จะได้เซลล์ที่มีหลาย nucleus'},
'cyto>two':{m:'ได้ 2 เซลล์ลูกที่มี chromosome ครบชุดเหมือนเซลล์แม่ (2n เท่าเดิม) เพราะ sister chromatids ที่แยกไปเป็นสำเนาที่เหมือนกันทุกประการ',v:'ถ่ายสำเนาแล้วแบ่งกันคนละชุด ทั้งสองชุดเหมือนต้นฉบับ',f:'ต่างจาก meiosis ซึ่งได้ 4 เซลล์ที่มี chromosome ชุดเดียว (n) และแต่ละเซลล์ไม่เหมือนกัน'},
'kin>meta':{m:'kinetochore ของ sister chromatid แต่ละข้างจับ microtubule จากคนละขั้ว เกิดแรงตึงที่บอกเซลล์ว่าจับถูกต้องแล้ว ถ้ามี kinetochore ที่ยังไม่ได้จับ spindle checkpoint จะชะลอ anaphase ไว้',v:'ตะขอสองด้านของฝาแฝดเกี่ยวเชือกจากคนละฝั่ง ถ้าเชือกตึงทั้งสองข้างแสดงว่าเกี่ยวถูกแล้ว',f:'ยา vincristine ขัดขวาง microtubule เซลล์จึงค้างใน metaphase เป็นยาเคมีบำบัดที่ออกฤทธิ์เฉพาะระยะ M'},
'sis>chr':{m:'chromosome รูปตัว X ที่เห็นใน metaphase คือ 1 chromosome ที่มี 2 sister chromatids หลักนับคือนับตามจำนวน centromere ไม่ใช่จำนวนแขน',v:'กรรไกรหนึ่งเล่มมีสองใบมีด แต่ก็ยังนับเป็นกรรไกรหนึ่งเล่ม',f:'จุดที่มักนับผิด: ช่วง anaphase sister chromatids แยกกันแล้ว จึงนับเป็น chromosome คนละแท่ง จำนวนจึงเพิ่มเป็น 2 เท่าชั่วคราว'},
'rep>sis':{m:'การจำลอง DNA ได้ 2 สำเนาที่เหมือนกัน ทั้งสองยังยึดกันที่ centromere ด้วย cohesin จนถึง anaphase จึงเรียกว่า sister chromatids',v:'สำเนาสองชุดที่ยังเย็บมุมติดกันไว้ เพื่อไม่ให้หลุดหายก่อนแจก',f:'ถ้าแยกกันก่อนเวลา ตอนแบ่งเซลล์จะแบ่งสำเนาให้ลูกแต่ละเซลล์ไม่เท่ากัน'},
'nuc>chr':{m:'DNA ราว 147 คู่เบสพันรอบแกน histone 8 ตัว histone มีประจุบวกจาก lysine และ arginine จึงจับกับ phosphate ประจุลบของ DNA ได้แน่น เกิดเป็น nucleosome แล้วขดซ้อนกันหลายชั้นจนเป็น chromosome',v:'พันด้ายรอบหลอดด้ายหลายหลอด แล้วม้วนหลอดเหล่านั้นซ้อนกันอีกที ด้ายยาวมากจึงเก็บในกล่องเล็ก ๆ ได้',f:'ถ้าไม่ขดตัว DNA ยาวราว 2 เมตรต่อเซลล์จะใส่ใน nucleus ไม่ได้ และพันกันตอนแบ่งเซลล์'},
'tel>chr':{m:'ปลาย chromosome มีลำดับซ้ำ TTAGGG หลายพันชุด ทำหน้าที่เป็นปลอกปิดปลาย เซลล์จึงไม่เข้าใจผิดว่าปลายนั้นคือ DNA ที่หัก และไม่เอาปลายของ chromosome มาต่อเข้าด้วยกัน',v:'ปลอกพลาสติกที่ปลายเชือกรองเท้า กันไม่ให้ปลายเชือกลุ่ย',f:'ถ้าไม่มี telomere ทุกรอบที่จำลอง DNA จะกินเข้าไปในส่วนที่เป็น gene'},
'kin>sis':{m:'ที่ centromere ของ sister chromatid แต่ละข้างมี kinetochore ของตัวเอง หันไปคนละด้าน จึงถูกดึงไปคนละขั้วได้',v:'ฝาแฝดแต่ละคนมีหูจับของตัวเอง หันไปคนละฝั่ง',f:'ถ้า kinetochore ทั้งคู่จับ microtubule จากขั้วเดียวกัน ทั้งสองจะถูกดึงไปฝั่งเดียว'},
'coh>ana':{m:'cohesin เป็นวงแหวนโปรตีนที่รัด sister chromatids ไว้ ต่อต้านแรงดึงของ spindle จนกว่า separase จะตัดวงแหวนนี้ตอนเริ่ม anaphase',v:'สายรัดที่ล็อกฝาแฝดไว้ด้วยกัน จนได้รับสัญญาณให้ตัดพร้อมกันทุกคู่',f:'ถ้าตัด cohesin เร็วเกินไป chromatid จะแยกก่อนเรียงตัวครบ และกระจายไปเซลล์ลูกไม่เท่ากัน'},
'ring>cyto':{m:'actin และ myosin ใต้เยื่อหุ้มเซลล์สัตว์เรียงเป็นวงแหวนแล้วหดตัว ดึงเยื่อหุ้มให้คอดเข้าจนเกิด cleavage furrow ส่วนเซลล์พืชมีผนังเซลล์แข็งจึงคอดไม่ได้ ต้องสร้าง cell plate จาก vesicle ที่มาเรียงกลางเซลล์แทน',v:'รูดเชือกถุงผ้าให้ปากถุงปิด ถุงจึงถูกแบ่งออกเป็นสองส่วน',f:'ถ้าวงแหวนไม่หดตัว จะได้เซลล์เดียวที่มี 2 nucleus'},
'risk>dmg':{m:'UV ทำให้ thymine ที่อยู่ติดกันจับกันเป็น thymine dimer สารในควันบุหรี่ เช่น benzo[a]pyrene เกาะกับเบส ส่วนรังสีที่แรงทำให้ DNA ขาดทั้งสองสาย',v:'ต้นฉบับถูกแดดเผาจนตัวอักษรติดกัน ถูกหมึกหยด หรือถูกฉีกขาด',f:'ถ้าซ่อมได้ไม่ทัน ความเสียหายจะกลายเป็นการกลายพันธุ์ถาวร'},
'fr>dmg':{m:'อนุมูลอิสระ เช่น hydroxyl radical มีอิเล็กตรอนไม่ครบคู่ จึงดึงอิเล็กตรอนจากโมเลกุลรอบตัว ทำให้เบสถูก oxidize เช่น guanine กลายเป็น 8-oxo-guanine ซึ่งจับคู่ผิดกับ A',v:'สนิมที่ค่อย ๆ กัดกินโลหะ เกิดทีละน้อยแต่สะสมไปเรื่อย ๆ',f:'ความเสียหายแบบนี้สะสมตามอายุ จึงเป็นทั้งสาเหตุของความเสื่อมและของมะเร็ง'},
'ao>fr':{m:'สารต้านอนุมูลอิสระ เช่น vitamin C และ E ให้อิเล็กตรอนแก่อนุมูลอิสระ อนุมูลอิสระจึงเสถียรและหยุดดึงอิเล็กตรอนจากโมเลกุลอื่น',v:'ยอมเป็นเป้าแทน เพื่อให้ DNA ไม่ถูกทำร้าย',f:'ร่างกายมี enzyme ต้านอนุมูลอิสระของตัวเองด้วย เช่น SOD และ catalase'},
'dmg>p53':{m:'ปกติ p53 ถูกทำลายตลอดเวลาโดย MDM2 จึงมีอยู่น้อย เมื่อ DNA เสียหาย สัญญาณจากตัวตรวจจับทำให้ p53 ไม่ถูกทำลาย จึงสะสมและเริ่มทำงาน',v:'ยามที่ปกตินั่งพัก พอสัญญาณเตือนดังก็ลุกขึ้นมาทำงานทันที',f:'ถ้า TP53 กลายพันธุ์ จะไม่มียามคนนี้ ซึ่งพบได้ในมะเร็งราวครึ่งหนึ่ง'},
'p53>cdk':{m:'p53 เป็น transcription factor ที่เปิด gene p21 แล้ว p21 ไปยับยั้ง Cyclin–CDK เซลล์จึงหยุดอยู่ที่ G1 เพื่อรอซ่อม DNA',v:'กดปุ่มหยุดชั่วคราวก่อนถ่ายสำเนาต่อ',f:'ถ้าไม่หยุด DNA ที่เสียหายจะถูกจำลองไปด้วย'},
'p53>apo':{m:'ถ้าซ่อมไม่สำเร็จ p53 เปิด gene ที่ส่งเสริม apoptosis เช่น BAX ทำให้ไมโทคอนเดรียปล่อย cytochrome c ออกมากระตุ้น caspase จนเซลล์ตายอย่างเป็นระเบียบ',v:'ซ่อมรถไม่ได้ก็ส่งเข้าโรงแยกชิ้นส่วน ดีกว่าปล่อยให้วิ่งต่อแล้วก่ออุบัติเหตุ',f:'ยาเคมีบำบัดหลายชนิดอาศัยทางนี้ฆ่าเซลล์มะเร็ง เซลล์ที่ TP53 เสียจึงดื้อยา'},
'dmg>onc':{m:'การกลายพันธุ์ใน proto-oncogene เช่น c-myc ทำให้มันทำงานมากเกินไปหรือทำงานตลอดเวลา (gain-of-function) แค่ allele เดียวกลายพันธุ์ก็มีผลแล้ว',v:'คันเร่งค้าง เหยียบครั้งเดียวแล้วไม่คืนตัว',f:'ส่วนยีนต้านมะเร็ง เช่น TP53 มักต้องเสียทั้ง 2 allele จึงจะเสียหน้าที่ (loss-of-function)'},
'bcl>onc':{m:'bcl-2 เป็น gene ที่ช่วยให้เซลล์รอดชีวิต เมื่อมีมากเกินไป เช่น ใน lymphoma บางชนิด เซลล์ผิดปกติจะไม่ตาย จึงนับเป็น oncogene ชนิดหนึ่ง',v:'เกราะกันกระสุนที่ให้คนร้ายสวม ทำให้กำจัดไม่ได้',f:'ต่างจาก c-myc ที่เร่งการแบ่งเซลล์ bcl-2 ทำให้เซลล์ไม่ตาย ผลสุดท้ายคือเซลล์ผิดปกติสะสมเหมือนกัน'},
'bcl>apo':{m:'bcl-2 อยู่ที่เยื่อหุ้มไมโทคอนเดรีย คอยยับยั้ง BAX และ BAK ไม่ให้เจาะรูที่เยื่อหุ้ม cytochrome c จึงไม่ถูกปล่อยออกมา และ apoptosis ไม่เริ่ม',v:'ยามที่ล็อกประตูห้องเก็บระเบิดไว้ไม่ให้ใครเปิด',f:'bcl-2 สูงร่วมกับ TP53 กลายพันธุ์ทำให้ดื้อเคมีบำบัด เพราะยาต้องอาศัย apoptosis ในการฆ่าเซลล์'},
'onc>unc':{m:'oncogene คือคันเร่งที่ค้าง ส่วนยีนต้านมะเร็งที่เสียคือเบรกที่หาย มะเร็งส่วนใหญ่ต้องมีความผิดปกติหลายจุดสะสมกัน (multi-hit) เซลล์จึงแบ่งตัวไม่หยุด',v:'รถที่คันเร่งค้างแล้วเบรกยังแตก',f:'นี่คือเหตุผลที่มะเร็งพบมากขึ้นตามอายุ เพราะต้องใช้เวลาสะสมความผิดปกติหลายจุด'},
'unc>cancer':{m:'นอกจากแบ่งตัวไม่หยุด เซลล์มะเร็งยังสร้างเส้นเลือดใหม่มาเลี้ยงตัวเอง บุกรุกเนื้อเยื่อข้างเคียง และแพร่กระจายไปที่อื่น (metastasis) เป็นลำดับขั้นเริ่มต้น กระตุ้น และก้าวหน้า',v:'วัชพืชที่ไม่เพียงโตเร็ว แต่ยังแย่งน้ำ ทะลุรั้ว และปลิวไปงอกในสวนอื่น',f:'ก้อนที่โตแต่ไม่บุกรุกและไม่แพร่กระจายเรียกว่าเนื้องอกธรรมดา (benign)'},
'apo>death':{m:'apoptosis เป็นการตายที่เซลล์สั่งเอง ใช้ ATP และ enzyme caspase เซลล์หดตัวแตกเป็น apoptotic bodies ที่ถูกเซลล์อื่นกิน จึงไม่อักเสบ',v:'รื้อถอนอาคารอย่างเป็นระบบ เก็บกวาดเรียบร้อย ไม่มีเศษปลิวไปโดนข้างบ้าน',f:'ใช้ในภาวะปกติด้วย เช่น การหายไปของพังผืดระหว่างนิ้วมือของทารกในครรภ์'},
'nec>death':{m:'necrosis เกิดจากการบาดเจ็บรุนแรง เช่น ขาดเลือด สารพิษ หรือความร้อน เซลล์ขาดพลังงาน บวมจนแตก สารข้างในรั่วออกไปกระตุ้นการอักเสบ',v:'ตึกถล่มเพราะแผ่นดินไหว เศษซากกระจายไปทำลายสิ่งรอบ ๆ',f:'ตัวอย่างคือกล้ามเนื้อหัวใจตายจากการขาดเลือด (myocardial infarction)'},
'ven>bcl':{m:'Venetoclax เป็น BH3 mimetic ที่เข้าไปจับ bcl-2 แทน ปลดปล่อย BAX และ BAK ให้เจาะไมโทคอนเดรียได้ เซลล์มะเร็งจึงกลับเข้าสู่ apoptosis',v:'ปลดล็อกประตูที่ยามล็อกไว้ ให้กลไกทำลายตัวเองกลับมาทำงานได้',fl:'ใช้ทางคลินิก',f:'ใช้ใน CLL และ AML ต้องระวัง tumor lysis syndrome เพราะเซลล์มะเร็งตายจำนวนมากพร้อมกัน จึงเริ่มยาขนาดต่ำแล้วค่อย ๆ เพิ่มขนาด'},
'bev>cancer':{m:'ก้อนมะเร็งที่โตเกินราว 1–2 มิลลิเมตรต้องมีเส้นเลือดใหม่มาเลี้ยง Bevacizumab เป็น antibody ที่จับ VEGF ซึ่งเป็นสัญญาณสร้างเส้นเลือด ก้อนจึงขาดอาหารและออกซิเจน',v:'ตัดท่อส่งเสบียงของข้าศึก',fl:'ใช้ทางคลินิก',f:'ผลข้างเคียงที่ต้องเฝ้าระวังคือความดันโลหิตสูง เลือดออก และแผลหายช้า จึงต้องหยุดยาก่อนผ่าตัด'},
'chemo>cancer':{m:'ยาเคมีบำบัดทำลายเซลล์ที่กำลังแบ่งตัว บางชนิดออกฤทธิ์เฉพาะระยะ เช่น methotrexate ใน S phase และ vincristine ใน M phase บางชนิดออกฤทธิ์ได้ทุกระยะ เช่น ยากลุ่ม alkylating',v:'ระเบิดที่เล็งเป้าหมายที่เคลื่อนที่เร็ว จึงโดนทั้งข้าศึกและพวกเดียวกันที่วิ่งเร็ว',f:'เซลล์ปกติที่แบ่งเร็วโดนไปด้วย จึงเกิดผมร่วง แผลในปาก และเม็ดเลือดต่ำ ส่วนเซลล์ระยะ G0 ไม่ค่อยได้รับผล'},
'tel>sen':{m:'DNA polymerase จำลองส่วนปลายสุดของสายไม่ได้ (end-replication problem) telomere จึงสั้นลงทุกรอบที่แบ่ง เมื่อสั้นถึงจุดวิกฤต เซลล์มองว่าเป็น DNA เสียหายแล้วหยุดแบ่งถาวร เรียกว่า Hayflick limit ซึ่งอยู่ราว 50 รอบ',v:'เทียนที่สั้นลงทุกครั้งที่จุด พอใกล้หมดก็ต้องดับ',f:'stem cell เซลล์สืบพันธุ์ และเซลล์มะเร็งมี telomerase คอยต่อ telomere จึงแบ่งได้ไม่จำกัด'},
'senol>sen':{m:'เซลล์ชราภาพไม่ตาย แต่หลั่งสารกระตุ้นการอักเสบ (SASP) ทำร้ายเซลล์ข้างเคียง senolytics เช่น dasatinib ร่วมกับ quercetin หรือ fisetin ทำให้เซลล์กลุ่มนี้เข้าสู่ apoptosis',v:'กำจัดผลไม้เน่าลูกเดียวออกจากตะกร้า ก่อนที่มันจะทำให้ลูกอื่นเน่าตาม',fl:'สถานะการใช้',f:'ส่วนใหญ่ยังอยู่ในขั้นวิจัยในคน ยังไม่ใช่การรักษามาตรฐาน'},
'inducer>repressor':{m:'allolactose (หรือ IPTG) จับที่ repressor แล้วเปลี่ยนรูปร่างของมัน repressor จึงจับ operator ไม่ได้และหลุดออก ทาง RNA polymerase ก็โล่ง',v:'กุญแจที่ไขแม่กุญแจที่ล็อกประตูอยู่ให้หลุดออก',f:'IPTG ใช้ในห้องปฏิบัติการเพื่อบังคับให้แบคทีเรียสร้างโปรตีนที่ต้องการ เพราะถูกย่อยไม่ได้ ระดับจึงคงที่'},
'repressor>operon':{m:'repressor จับที่ operator ซึ่งอยู่ซ้อนกับ promoter จึงขวาง RNA polymerase ไม่ให้ถอดรหัส ยีนโครงสร้างจึงไม่ถูกถอดรหัส เป็นการควบคุมแบบลบ (เบรก)',v:'รถจอดขวางทางเข้าโรงงาน คนงานจึงเข้าไปทำงานไม่ได้',f:'ถ้า repressor เสีย แบคทีเรียจะสร้าง enzyme ย่อยแลคโตสตลอดเวลา แม้ไม่มีแลคโตสให้ย่อย สิ้นเปลืองพลังงาน'},
'cap>operon':{m:'เมื่อกลูโคสต่ำ cAMP สูงขึ้นและจับ CAP แล้ว CAP–cAMP ไปจับที่ CAP site หน้า promoter ช่วยดึง RNA polymerase ให้เกาะแน่น ถอดรหัสได้มาก เป็นการควบคุมแบบบวก (คันเร่ง)',v:'ป้ายไฟนำทางที่ช่วยให้รถเข้าจอดตรงช่องได้เร็วและแม่น',f:'ถ้าไม่มี CAP–cAMP แม้ repressor หลุดแล้ว การถอดรหัสก็ยังต่ำมาก'},
'glucose>cap':{m:'กลูโคสสูงยับยั้ง enzyme ที่สร้าง cAMP ระดับ cAMP จึงต่ำ CAP ไม่มีคู่จับ จึงช่วย RNA polymerase ไม่ได้ เรียกว่า catabolite repression หรือ glucose effect',v:'มีข้าวสวยอยู่แล้วก็ไม่ต้องเปิดเตาหุงข้าวเหนียว เซลล์ใช้กลูโคสก่อนเสมอ',f:'กลูโคสสูงและมีแลคโตสด้วย จะถอดรหัสยีนย่อยแลคโตสได้น้อยมาก (basal level)'},
'operon>tx':{m:'โพรคาริโอตควบคุมยีนเป็นหลักที่ระดับการถอดรหัส operon จึงเป็นตัวตัดสินว่ายีนกลุ่มนี้จะได้ mRNA หรือไม่ ส่วนยูคาริโอตควบคุมได้หลายระดับ ตั้งแต่ chromatin ไปจนถึง translation',v:'สวิตช์ไฟรวมที่เปิดปิดหลอดไฟทั้งแถวพร้อมกัน',f:'สรุป 4 สถานการณ์: ไม่มีแลคโตส ยีนปิด · มีแลคโตส กลูโคสต่ำ เปิดเต็มที่ · มีทั้งคู่ เปิดน้อยมาก · ไม่มีทั้งคู่ ยีนปิด'},
'constit>glyco':{m:'enzyme ใน glycolysis และ Krebs cycle จำเป็นต่อชีวิตตลอดเวลา ยีนของมันจึงเปิดอยู่เสมอ (constitutive) ไม่ต้องรอสัญญาณเหมือน enzyme ย่อยแลคโตส (inducible) หรือ enzyme สร้าง tryptophan (repressible)',v:'ไฟทางเดินในโรงพยาบาลที่เปิดไว้ตลอด กับไฟห้องประชุมที่เปิดเมื่อมีคนใช้',f:'ถ้ายีนพวกนี้เสีย เซลล์จะขาดพลังงานพื้นฐานทันที'},
'glucose>glyco':{m:'กลูโคสถูกเติม phosphate จาก ATP โดย hexokinase เป็น glucose-6-phosphate ซึ่งเป็นขั้นแรกของ glycolysis และยังกันไม่ให้กลูโคสหลุดออกจากเซลล์',v:'ติดป้ายราคาให้สินค้าเข้าสายพาน และกันไม่ให้หลุดออกจากร้าน',f:'glucose-6-phosphate ยังแยกเข้าสู่ pentose phosphate pathway ที่ใช้ G6PD ได้ด้วย'},
'glyco>acetyl':{m:'pyruvate (3C) เข้าสู่ mitochondria แล้ว pyruvate dehydrogenase complex ดึง CO2 ออก 1 โมเลกุล ได้ acetyl CoA (2C) และ NADH',v:'ตัดท่อนไม้ให้สั้นพอจะใส่เข้าเตา',f:'ถ้าขาด O2 pyruvate จะไม่ถูกส่งต่อมาทางนี้ แต่ไปทางการหมักแทน'},
'acetyl>krebs':{m:'acetyl CoA (2C) รวมกับ oxaloacetate (4C) ได้ citrate (6C) จากนั้นค่อย ๆ ดึง CO2 ออกจนเหลือ 4C แล้วกลับมาเป็น oxaloacetate รับ acetyl CoA ใหม่',v:'ม้าหมุนที่ผู้โดยสารขึ้นทีละ 2 คน ระหว่างทางลงไปทีละคน จนกลับมาที่จุดเริ่มต้น',f:'กรดไขมันและ amino acid หลายชนิดก็เข้าสู่วงจรนี้ได้ จึงเป็นจุดรวมของการสลายสารอาหารทุกชนิด'},
'krebs>nadh':{m:'Krebs cycle รอบเดียวได้ 3 NADH, 1 FADH2 และ 1 GTP ต่อ acetyl CoA (กลูโคส 1 โมเลกุลวน 2 รอบ) พลังงานส่วนใหญ่ของกลูโคสจึงถูกเก็บในรูป NADH และ FADH2',v:'แปลงเงินสดเป็นบัตรเติมเงิน ไปใช้ต่อที่ตู้กดเงิน (ETC)',f:'ขาด vitamin B3 หรือ B2 จะขาด NAD+ หรือ FAD การสลายสารอาหารให้พลังงานจะติดขัด'},
'nadh>etc':{m:'NADH และ FADH2 ส่งอิเล็กตรอนให้ CoQ, cytochrome b, c, a+a3 ตามลำดับ จนถึง O2 ซึ่งเป็นตัวรับสุดท้ายและรวมกับ H+ เป็นน้ำ ระหว่างทางมีการปั๊ม H+ ออกนอก matrix',v:'น้ำไหลลงบันไดหลายขั้น แต่ละขั้นหมุนกังหันปั๊มน้ำขึ้นอ่างเก็บ',f:'1 NADH ได้ราว 3 ATP (หรือ 2.5) และ 1 FADH2 ได้ราว 2 ATP (หรือ 1.5) เพราะ FADH2 เข้าระบบที่ขั้นต่ำกว่า'},
'etc>atp':{m:'H+ ที่ถูกปั๊มออกไหลกลับผ่าน ATP synthase ขับให้ ADP รวมกับ Pi เป็น ATP (chemiosmosis หรือ oxidative phosphorylation) อัตราถูกคุมด้วย ADP ถ้า ADP สูง การสร้าง ATP ก็เร็วขึ้น',v:'น้ำจากเขื่อนไหลผ่านกังหันปั่นไฟ',f:'ไซยาไนด์ยับยั้ง cytochrome a+a3 การส่งอิเล็กตรอนจึงหยุด เซลล์ขาด ATP ทันที'},
'etc>mito':{m:'electron transport chain ฝังอยู่ที่เยื่อหุ้มชั้นในของ mitochondria ซึ่งไม่ยอมให้สารผ่านง่าย H+ ที่ถูกปั๊มออกจึงสะสมเป็นพลังงานศักย์ได้',v:'ผนังเขื่อนที่กักน้ำไว้ให้มีแรงดัน',f:'NADH จาก glycolysis ผ่านเยื่อชั้นในไม่ได้ ต้องใช้ shuttle system ช่วยลำเลียงเข้าไป'},
'glyco>ferm':{m:'เมื่อขาด O2 ETC หยุด NAD+ ไม่ถูกสร้างคืน เซลล์จึงเปลี่ยน pyruvate เป็น lactic acid (หรือ ethanol ในยีสต์) เพื่อคืน NAD+ ให้ glycolysis เดินต่อได้ แม้ได้แค่ 2 ATP',v:'ไฟดับก็เปิดเครื่องปั่นไฟสำรอง ได้ไฟน้อยกว่าแต่พอใช้',f:'ออกกำลังกายหนักจนขาด O2 lactic acid สะสม จึงเมื่อยกล้ามเนื้อ'},
'ferm>probio':{m:'แบคทีเรียกรดแลกติก เช่น Lactobacillus หมักน้ำตาลเป็น lactic acid ทำให้ลำไส้เป็นกรดและยังสร้าง bacteriocin ยับยั้งเชื้ออื่น จึงใช้ทำอาหารหมักและเป็น probiotics',v:'ยามที่ปรับสภาพบ้านให้ขโมยอยู่ไม่ได้',f:'ใช้ในทางการแพทย์ เช่น Lactobacillus, Bifidobacterium และ Saccharomyces boulardii ซึ่งเป็นยีสต์'},
'prebio>probio':{m:'prebiotics เช่น inulin, FOS, resistant starch ร่างกายย่อยไม่ได้ จึงลงไปถึงลำไส้ใหญ่และเป็นอาหารเฉพาะของจุลินทรีย์ดี',v:'ปุ๋ยสำหรับต้นไม้ที่เราอยากให้โต',f:'ใช้ probiotics ร่วมกับ prebiotics เรียกว่า synbiotic ได้ผลดีกว่าใช้อย่างเดียว'},
'mito>apo':{m:'เมื่อ BAX และ BAK เจาะเยื่อหุ้ม mitochondria cytochrome c รั่วออกมาใน cytoplasm แล้วกระตุ้น caspase ให้เซลล์ตายแบบ apoptosis',v:'โรงไฟฟ้าส่งสัญญาณเตือนภัยให้รื้อถอนอาคารอย่างเป็นระบบ',f:'นี่คือจุดที่ bcl-2 ไปขวางไว้ จึงเชื่อมกับกลไกดื้อเคมีบำบัด'},
'mito>fr':{m:'อิเล็กตรอนบางส่วนรั่วจาก ETC ไปทำปฏิกิริยากับ O2 ก่อนถึงปลายทาง เกิด superoxide และอนุมูลอิสระอื่น ๆ เป็นผลพลอยได้ของการสร้างพลังงาน',v:'ควันที่ออกจากปล่องโรงไฟฟ้า',f:'อนุมูลอิสระที่สะสมตามอายุเป็นสาเหตุหนึ่งของความเสื่อมของเซลล์'},
'mito>melas':{m:'mitochondria มี DNA ของตัวเอง และส่งผ่านทางไข่ของแม่เท่านั้น การกลายพันธุ์ใน mtDNA จึงถ่ายทอดจากแม่สู่ลูกทุกคน กระทบเซลล์ที่ใช้พลังงานมากที่สุด คือสมองและกล้ามเนื้อ',v:'แบบพิมพ์เขียวโรงไฟฟ้าที่ได้รับมาจากแม่ฝ่ายเดียว',f:'MELAS มีภาวะ lactic acidosis เพราะเซลล์สร้าง ATP ทาง ETC ไม่ได้ จึงหันไปพึ่งการหมักแทน'},
'atp>nec':{m:'ปั๊ม Na⁺/K⁺ ใช้ ATP ตลอดเวลา เมื่อขาด ATP เช่นขาดเลือด ปั๊มหยุด Na⁺ และน้ำไหลเข้าเซลล์ เซลล์บวมจนเยื่อหุ้มแตก',v:'เรือรั่วที่เครื่องสูบน้ำดับ น้ำเข้ามาจนจม',f:'ต่างจาก apoptosis ซึ่งยังต้องใช้ ATP เพื่อตายอย่างเป็นระเบียบ'},
'meta>karyo':{m:'ระยะ metaphase chromosome หดตัวสั้นที่สุดและเรียงตัวชัด จึงนับและจัดคู่ได้ คนปกติมี 46 แท่ง แบ่งกลุ่ม A ถึง G ตามขนาดและตำแหน่ง centromere',v:'ถ่ายรูปหมู่ตอนทุกคนยืนเรียงแถวนิ่ง ๆ',f:'karyotype เขียนแบบ 47,XX,+21 คือ จำนวนทั้งหมด, sex chromosome, ความผิดปกติ'},
'colch>ana':{m:'colchicine จับ tubulin ทำให้สร้าง microtubule ไม่ได้ เส้นใย spindle สลาย chromosome จึงไม่ถูกดึงแยก เซลล์ค้างที่ metaphase',v:'ตัดเชือกชักเย่อทิ้ง ทีมจึงดึงกันต่อไม่ได้',f:'ทางคลินิกใช้รักษาเกาต์ เพราะยับยั้ง microtubule ของเม็ดเลือดขาวไม่ให้เคลื่อนที่มาอักเสบ ผลข้างเคียงที่พบบ่อยคือท้องเสีย'},
'colch>karyo':{m:'เติม colchicine ลงในเซลล์ที่เลี้ยงไว้ เซลล์จำนวนมากจะค้างที่ metaphase จากนั้นใส่สารละลาย hypotonic ให้เซลล์บวมจน chromosome กระจาย แล้วย้อม giemsa',v:'กดหยุดภาพในจังหวะที่ทุกคนเรียงแถว',f:'ถ้าไม่ใช้ colchicine จะมีเซลล์ระยะ metaphase น้อยเกินกว่าจะนับได้'},
'ana>nondis':{m:'ปกติใน anaphase chromosome หรือ chromatid ต้องแยกไปคนละขั้วเท่ากัน ถ้าไม่แยก เซลล์ลูกเซลล์หนึ่งจะได้เกิน อีกเซลล์ได้ขาด',v:'แบ่งขนมให้เด็ก 2 คน แต่ขนมคู่หนึ่งไปอยู่กับเด็กคนเดียวทั้งคู่',f:'โอกาสเกิด nondisjunction ในไข่เพิ่มขึ้นตามอายุแม่ จึงพบ Down syndrome มากขึ้นในแม่อายุมาก'},
'meiosis>nondis':{m:'meiosis ต้องแยก homologous chromosome ในรอบแรกและแยก chromatid ในรอบสอง ถ้ารอบใดไม่แยก เซลล์สืบพันธุ์จะมี chromosome n+1 หรือ n−1',v:'คัดแยกถุงเท้าเป็นคู่แล้วแยกอีกทีเป็นข้าง ผิดขั้นตอนไหนก็ได้ถุงเท้าเกิน',f:'เมื่อเซลล์สืบพันธุ์ n+1 ผสมกับเซลล์ปกติ n จะได้ลูก 2n+1 คือ trisomy'},
'meiosis>m':{m:'M phase คือช่วงที่เซลล์แบ่งตัว ซึ่งมีได้ 2 แบบ mitosis ได้ 2 เซลล์ 2n ส่วน meiosis แบ่ง 2 รอบได้ 4 เซลล์ n ที่ไม่เหมือนกัน',v:'ถ่ายสำเนาแจก 2 ชุดเหมือนกัน กับแบ่งครึ่งตำราให้ 4 คนคนละส่วน',f:'ถ้าเซลล์สืบพันธุ์ไม่ลดเป็น n ลูกจะมี chromosome เพิ่มเป็นเท่าตัวทุกรุ่น'},
'nondis>trisomy':{m:'nondisjunction ของ autosome ทำให้ลูกมี chromosome 3 แท่งในคู่นั้น (47 แท่ง) ยีนบน chromosome ที่เกินถูกแสดงออกมากเกินไปจนพัฒนาการผิดปกติ',v:'สูตรอาหารที่ใส่เครื่องปรุงอย่างหนึ่งเกินมาครึ่งเท่า รสชาติทั้งจานเพี้ยน',f:'trisomy ของ chromosome ขนาดใหญ่ส่วนใหญ่ทำให้แท้ง จึงพบเฉพาะคู่ 21, 13, 18 ที่มีชีวิตรอดได้'},
'nondis>sexaneu':{m:'nondisjunction ของ sex chromosome ทำให้ได้ XXY, XXX, XYY หรือ X เดียว เพราะ X ส่วนเกินถูกปิดการทำงานบางส่วน จึงรุนแรงน้อยกว่า trisomy ของ autosome',v:'',f:'45,X (Turner) เป็น monosomy ชนิดเดียวที่มีชีวิตรอดได้'},
'sexchr>sexaneu':{m:'ถ้ามี Y อยู่จะเป็นเพศชายเสมอ (XXY เป็นชาย) ถ้าไม่มี Y จะเป็นหญิง (X เดียวเป็นหญิง) จำนวน X ที่ผิดไปจึงกำหนดอาการของแต่ละโรค',v:'Y คือสวิตช์เปิดเส้นทางเพศชาย มีกี่ X ก็ไม่เปลี่ยนสวิตช์นี้',f:'Klinefelter ตัวสูงหน้าอกโตเป็นหมัน Turner ตัวเตี้ยคอสั้นรังไข่ไม่พัฒนา'},
'sexchr>karyo':{m:'คนมี chromosome 46 แท่ง เป็น autosome 22 คู่ ซึ่งเหมือนกันทั้งสองเพศ และ sex chromosome 1 คู่ คือ XX ในหญิงและ XY ในชาย',v:'หนังสือ 23 เล่ม 22 เล่มเหมือนกันทุกบ้าน ต่างกันแค่เล่มสุดท้าย',f:'ระบบกำหนดเพศอื่นก็มี เช่น XO ในตั๊กแตนและ ZW ในนก'},
'karyo>cri':{m:'cri-du-chat เป็นความผิดปกติทางโครงสร้าง คือแขนสั้นของ chromosome 5 ขาดหายบางส่วน จำนวน chromosome ยังเป็น 46 แต่เห็นแท่งที่สั้นลงจาก karyotype',v:'นับหนังสือครบ 46 เล่ม แต่เล่มหนึ่งหน้าหายไป',f:'ความผิดปกติทางโครงสร้างอื่น เช่น duplication, inversion, translocation'},
'meiosis>law1':{m:'ยีนคู่หนึ่ง (allele) อยู่บน homologous chromosome คู่หนึ่ง เมื่อ meiosis แยก homolog ออกจากกัน allele ก็แยกตามไปคนละเซลล์ นี่คือกลไกทางกายภาพของกฎการแยกตัว',v:'คู่ถุงมือซ้ายขวาถูกส่งไปคนละกล่อง',f:'Mendel สรุปกฎนี้ก่อนที่จะมีใครรู้จัก chromosome หรือ meiosis'},
'law1>law2':{m:'กฎข้อ 2 ใช้กฎการแยกตัวกับยีน 2 คู่พร้อมกัน ยีนคนละคู่ที่อยู่ต่าง chromosome กันเข้าสู่เซลล์สืบพันธุ์ได้อย่างอิสระ ได้เซลล์สืบพันธุ์ 4 แบบ TY, Ty, tY, ty',v:'ทอยเหรียญ 2 เหรียญพร้อมกัน ผลของเหรียญหนึ่งไม่ขึ้นกับอีกเหรียญ',f:'ถ้ายีน 2 คู่อยู่ใกล้กันบน chromosome เดียวกัน (linked) จะไม่รวมกลุ่มอย่างอิสระ'},
'law1>ar':{m:'พ่อแม่เป็นพาหะ Aa ทั้งคู่ ลูกจะได้ AA : Aa : aa = 1 : 2 : 1 โอกาสเป็นโรค (aa) 1/4 และเป็นพาหะ 1/2',v:'',f:'ตัวอย่างในสไลด์: แม่พาหะ (Aa) × พ่อเป็นโรค (aa) ได้ลูกเป็นโรค 1/2 และโอกาสได้ลูกชายที่เป็นโรค 1/2 × 1/2 = 1/4'},
'sexchr>xr':{m:'ยีนบน X ผู้ชายมี X เดียวจึงมียีนชุดเดียว ไม่มีอีกชุดมาข่ม ได้ยีนด้อยก็แสดงอาการ ส่วนยีนบน Y (เช่น hairy ear) ถ่ายทอดจากพ่อสู่ลูกชายทุกคน',v:'ผู้ชายมีอะไหล่ชิ้นนี้ชิ้นเดียว ผู้หญิงมีสำรองอีกชิ้น',f:'ลูกชายได้ X จากแม่เสมอ แม่พาหะจึงส่งโรคให้ลูกชายได้ครึ่งหนึ่ง'},
'law1>xr':{m:'ใช้กฎการแยกตัวกับ chromosome X: แม่พาหะ (XᴴXʰ) × พ่อปกติ (XᴴY) ลูกชายเป็นโรค 1/2 ลูกสาวเป็นพาหะ 1/2 ไม่มีลูกสาวเป็นโรค',v:'',f:'ตัวอย่างในสไลด์: แม่พาหะ × พ่อเป็นโรค (XʰY) ได้ลูกเป็นโรค 1/2 และเมื่อดูเฉพาะลูกชายก็เป็นโรค 1/2'},
'thal>ar':{m:'ยีน globin ผิดปกติ (α บน chromosome 16 หรือ β บน chromosome 11) สร้าง globin ได้น้อย ต้องได้ยีนผิดปกติจากทั้งพ่อและแม่จึงเป็นโรครุนแรง',v:'',f:'ไทยมีพาหะ thalassemia จำนวนมาก การตรวจคัดกรองคู่สมรสก่อนมีบุตรจึงสำคัญ'},
'sickle>ar':{m:'คน HbA HbS เป็นพาหะ คน HbS HbS เป็นโรค ส่วน albinism ต้องได้ยีนขาด tyrosinase จากทั้งพ่อและแม่',v:'',f:'พาหะ sickle cell ทนต่อเชื้อมาลาเรียได้ดีกว่า ยีนนี้จึงพบมากในแอฟริกา'},
'hemo>xr':{m:'ยีนของ factor VIII และ IX อยู่บน chromosome X ส่วนยีนรับสีแดงและเขียวก็อยู่บน X จึงพบในผู้ชายมากกว่ามาก',v:'',f:'ราชวงศ์ยุโรปที่สืบจากพระราชินีวิกตอเรียเป็นตัวอย่าง pedigree ของ hemophilia ที่มีชื่อเสียง'},
'dmg>sickle':{m:'การแทนที่เบสเพียงตัวเดียวในยีน β-globin เปลี่ยน codon GAG เป็น GUG amino acid ตำแหน่งที่ 6 จึงเปลี่ยนจาก glutamic acid เป็น valine HbS เกาะกันเป็นเส้นเมื่อ O2 ต่ำ เม็ดเลือดแดงจึงงอเป็นรูปเคียว',v:'พิมพ์ผิดตัวอักษรเดียวในสูตร แต่ทำให้ขนมทั้งถาดเสียรูป',f:'ใช้ร่วมกับบท DNA ได้: transcription และ translation ส่งต่อความผิดจาก DNA ไปถึงโปรตีน'},
'fr>g6pd':{m:'G6PD สร้าง NADPH ไว้ให้ glutathione ใช้กำจัดอนุมูลอิสระในเม็ดเลือดแดง ผู้ที่ขาด G6PD จึงป้องกันตัวไม่ได้ อนุมูลอิสระทำลาย hemoglobin และเยื่อหุ้มเซลล์จนแตก',v:'บ้านที่ไม่มีเครื่องดับเพลิง ไฟลุกนิดเดียวก็ไหม้ทั้งหลัง',f:'อาการเม็ดเลือดแดงแตกเฉียบพลัน: ซีด ตัวเหลือง ปัสสาวะสีเข้มคล้ายน้ำปลาหรือโค้ก'},
'oxid>g6pd':{m:'ยาและอาหารเหล่านี้เพิ่มอนุมูลอิสระในเม็ดเลือดแดง ในคนปกติร่างกายกำจัดทัน แต่คนที่ขาด G6PD กำจัดไม่ทัน',v:'ไม้ขีดไฟที่ปลอดภัยในบ้านทั่วไป แต่อันตรายในบ้านที่ไม่มีเครื่องดับเพลิง',fl:'ใช้ทางคลินิก',f:'ยาที่ต้องเลี่ยง: sulfonamides, primaquine, chloroquine, quinine, chloramphenicol และ aspirin ขนาดสูง รวมถึงถั่วปากอ้า'},
'law1>abo':{m:'ABO มีได้ 3 allele แต่แต่ละคนมีแค่ 2 และยังแยกกันตามกฎข้อ 1 IA กับ IB เป็น codominance (แสดงออกทั้งคู่ เป็นหมู่ AB) และทั้งคู่ข่ม i',v:'',f:'ตัวอย่างในสไลด์: พ่อ IAIB × แม่ IAi ได้ลูกหมู่ A : AB : B = 2 : 1 : 1'},
'law1>rh':{m:'Rh+ (มี antigen D) เป็นลักษณะเด่น พ่อ Rh+ กับแม่ Rh− จึงมีลูก Rh+ ได้ ปัญหาเกิดเมื่อเลือดลูกเข้าไปในตัวแม่ตอนคลอด แม่จึงสร้าง antibody ไว้ทำร้ายลูกคนถัดไป',v:'',f:'ลูกคนแรกมักปลอดภัย เพราะแม่ยังไม่มี antibody ลูกคนที่สองที่เป็น Rh+ เสี่ยงมาก'},
'rhig>rh':{m:'RhIG เป็น antibody ต่อ Rh antigen ที่ฉีดให้แม่ จับและกำจัดเม็ดเลือดแดง Rh+ ของลูกในตัวแม่ก่อนที่ภูมิคุ้มกันของแม่จะรู้จักและสร้าง antibody เอง',v:'เก็บหลักฐานทิ้งก่อนที่ยามจะจำหน้าผู้บุกรุกได้',fl:'ใช้ทางคลินิก',f:'ฉีดให้แม่ Rh− ระหว่างตั้งครรภ์และภายใน 72 ชั่วโมงหลังคลอดลูก Rh+'},
'm>asex':{m:'mitosis ให้เซลล์ลูกที่มี DNA เหมือนเซลล์แม่ทุกประการ การสืบพันธุ์แบบไม่อาศัยเพศจึงได้ลูกที่เป็น clone ของพ่อแม่',v:'ถ่ายสำเนาเอกสารแผ่นเดิมซ้ำ ๆ ทุกแผ่นออกมาเหมือนกันหมด',f:'ข้อดีคือเพิ่มจำนวนได้เร็ว ข้อเสียคือไม่มีความหลากหลาย ถ้าสิ่งแวดล้อมเปลี่ยนอาจตายยกกลุ่ม แบคทีเรียไม่มี mitosis แต่แบ่งตัวแบบ binary fission ซึ่งก็ได้ลูกเหมือนเดิมและขยายจำนวนได้เร็วมาก'},
'pro1>meiosis':{m:'meiosis มี 2 รอบ meiosis I (ลดจำนวน chromosome ลงครึ่งหนึ่ง) มี prophase I, metaphase I, anaphase I, telophase I ส่วน meiosis II เหมือน mitosis prophase I นานที่สุดเพราะต้องจับคู่และแลกชิ้นส่วน chromosome',v:'ช่วงจับคู่เต้นรำที่ใช้เวลานานที่สุดก่อนการแสดงจริง',f:'ใน primary oocyte prophase I หยุดค้างที่ diplotene นานหลายสิบปี'},
'cross>pro1':{m:'ใน pachytene non-sister chromatid ของ homolog ที่แนบกันขาดและต่อสลับกัน แล้วใน diplotene เห็นจุดที่ยังติดกันเป็น chiasma รูปตัว X',v:'สลับไพ่บางใบระหว่างสองสำรับที่มีลำดับเหมือนกัน',f:'ยิ่ง chromosome ยาว ยิ่งเกิด crossing over ได้หลายจุด ยีนที่อยู่ไกลกันจึงมีโอกาสถูกแยกมากกว่า'},
'pro1>meta1':{m:'เยื่อหุ้มนิวเคลียสสลาย เส้นใย spindle จับที่ kinetochore แล้วดึง bivalent มาเรียงที่ metaphase plate เป็นคู่ ไม่ใช่ทีละแท่งแบบ mitosis',v:'คู่เต้นรำเดินมายืนเรียงแถวกลางเวทีเป็นคู่ ๆ',f:'ถ้า homolog ไม่เข้าคู่ตั้งแต่ prophase I การแยกใน anaphase I จะผิดพลาด'},
'meta1>law2':{m:'homolog แต่ละคู่หันว่าแท่งจากพ่อหรือแท่งจากแม่ไปขั้วไหนแบบสุ่ม และไม่ขึ้นกับคู่อื่น ยีนคนละคู่จึงเข้าเซลล์สืบพันธุ์อย่างอิสระ คนมี 23 คู่ ได้ชุดผสมได้ 2²³ หรือราว 8.4 ล้านแบบ',v:'เหรียญ 23 เหรียญที่ทอยพร้อมกัน แต่ละเหรียญออกหัวหรือก้อยอิสระต่อกัน',f:'นี่คือเหตุที่พี่น้องพ่อแม่เดียวกันไม่เหมือนกัน แม้ไม่มี crossing over'},
'meta1>ana1':{m:'spindle ดึง homolog ของแต่ละคู่ไปคนละขั้ว โดย sister chromatid ยังติดกันที่ centromere แต่ละขั้วจึงได้ chromosome n แท่ง แท่งละ 2 chromatid',v:'แยกคู่ถุงเท้าซ้ายขวาไปคนละตะกร้า โดยแต่ละข้างยังเป็นถุงเท้าคู่ซ้อนกัน',f:'ถ้า homolog ไม่แยกตรงนี้คือ nondisjunction ใน meiosis I ทำให้เซลล์สืบพันธุ์มี n+1 หรือ n−1'},
'ana1>ana2':{m:'หลัง telophase I และ cytokinesis เซลล์เข้าสู่ meiosis II ทันทีโดยไม่จำลอง DNA เพราะแต่ละ chromosome มี 2 chromatid อยู่แล้ว ใน anaphase II sister chromatid จึงแยกกันเหมือน mitosis',v:'แบ่งเค้กครึ่งหนึ่งแล้วแบ่งครึ่งอีกที ไม่ต้องอบเค้กเพิ่ม',f:'สรุปจำนวน: meiosis I 2n → n (2 chromatid) · meiosis II n → n (1 chromatid) · ได้ 4 เซลล์'},
'cross>sexrep':{m:'crossing over สร้างชุดยีนใหม่บน chromosome เดียวกัน ร่วมกับการเรียงตัวแบบสุ่มใน metaphase I และการผสมของไข่กับอสุจิแบบสุ่ม ลูกแต่ละคนจึงไม่ซ้ำกัน',v:'สลับไพ่ แล้วสุ่มจั่ว แล้วยังสุ่มคู่มาผสมอีก',f:'ความแปรผันทางพันธุกรรมช่วยให้ประชากรอยู่รอดเมื่อสิ่งแวดล้อมเปลี่ยน ต่างจากการสืบพันธุ์แบบไม่อาศัยเพศ'},

    const dx=B.x-A.x,dy=B.y-A.y,px=dy/Math.hypot(dx,dy),py=-dx/Math.hypot(dx,dy);

/* ---------- badge placement: no badge or label may sit on another badge, a box, or another line ---------- */
function ptAt(pts,t){let L=0;for(let k=1;k<pts.length;k++)L+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);let d=t*L;
  for(let k=1;k<pts.length;k++){const p=pts[k-1],q=pts[k],l=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<=l||k===pts.length-1){const r=l?Math.min(1,d/l):0;return[p[0]+(q[0]-p[0])*r,p[1]+(q[1]-p[1])*r];}d-=l;}}
function segD(x,y,p,q){const dx=q[0]-p[0],dy=q[1]-p[1],L2=dx*dx+dy*dy;let t=L2?((x-p[0])*dx+(y-p[1])*dy)/L2:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-p[0]-t*dx,y-p[1]-t*dy);}
function placeBadges(){const placed=[],anchors=[],pills=[];
  const TS=[];for(let k=0;k<29;k++){const t=.5+(k%2?1:-1)*Math.ceil(k/2)*.025;if(t>.12&&t<.88)TS.push(t);}
  const outD=(x,y,n)=>Math.hypot(Math.max(Math.abs(x-n.x)-n.w/2,0),Math.max(Math.abs(y-n.y)-n.h/2,0));
  /* line-end symbols are obstacles: arrowheads, stop signs, docked puzzle pieces */
  edges.forEach(e=>{const P=e.pts,q=P[P.length-1];
    if(e.type!=='pair')placed.push([q[0],q[1],e.type==='inhib'?13:10]);});
  const score=(e,x,y,R)=>{let sB=99,sN=99,sL=99;placed.concat(anchors).forEach(p=>{sB=Math.min(sB,Math.hypot(p[0]-x,p[1]-y)-p[2]-R);});
    for(const id in nodes)sN=Math.min(sN,outD(x,y,nodes[id])-R);
    edges.forEach(o=>{if(o===e)return;for(let k=1;k<o.pts.length;k++)sL=Math.min(sL,segD(x,y,o.pts[k-1],o.pts[k])-R);});
    return Math.min(sB/8,sN/4,sL/4,1);};
  edges.map(e=>e.i).sort((a,b)=>edges[a].len-edges[b].len).forEach(i=>{const e=edges[i];const P=e.pts;let best=null;
    for(const R of [15,12]){let bs=-1e9,bp=null;TS.forEach(t=>{const [x,y]=ptAt(P,t);const sc=score(e,x,y,R)-Math.abs(t-.5)*.02;if(sc>bs){bs=sc;bp=[x,y];}});
      if(!best||bs>best.s)best={p:bp,s:bs,R};if(bs>=.95)break;}
    const a=[best.p[0],best.p[1],best.R];e.lp=a;e.eb.setAttribute('transform',`translate(${f1(a[0])},${f1(a[1])})`);
    const bd=e.eb.querySelector('.badge');
    if(e.type==='pair'){placed.push(a);e.bp=a;e.eb.classList.toggle('sm',best.R<15);}
    else{e.eb.classList.add('nob');anchors.push(a);}});
  edges.forEach(e=>{const [x,y]=e.lp,hw=e.lw/2;let bad=false;
    for(const id in nodes){const n=nodes[id];if(Math.abs(x-n.x)<n.w/2+hw+4&&Math.abs(y-n.y)<n.h/2+18){bad=true;break;}}
    if(!bad)bad=pills.some(p=>Math.abs(p[0]-x)<(p[2]+e.lw)/2+6&&Math.abs(p[1]-y)<34);
    if(!bad)bad=placed.some(p=>p!==e.bp&&Math.abs(p[0]-x)<hw+p[2]+4&&Math.abs(p[1]-y)<p[2]+18);
    if(bad)e.eb.classList.add('nofit');else pills.push([x,y,e.lw]);});
}

/* ---------- view box ---------- */

  if(want&&!e.fg){const fg=S('g',{class:'flowg'},e.g);const c=S('path',{class:'flow',d:'M-5 -5L1.5 0L-5 5'},fg);const dv=Math.max(1.4,e.len/130),dur=dv.toFixed(2)+'s';
    S('animateMotion',{path:e.d,dur,begin:'indefinite',repeatCount:'indefinite',rotate:'auto'},c);S('animate',{attributeName:'opacity',values:'0;1;1;0',keyTimes:'0;0.15;0.8;1',dur,begin:'indefinite',repeatCount:'indefinite'},c);

  adj[id].forEach(i=>{const e=edges[i],o=e.a===id?e.b:e.a;setTag(o,ROLE[e.type][e.a===id?1:0],e.type);});setTag(id,'เรื่องที่เลือก','me');if(zoom)fitIds([...ns],70);}

    let opts;if(g.ansT){opts=[{t:g.ansT,ok:1},...g.disT.map(t=>({t,ok:0}))];}else{opts=[{t:esc(L(g.ans)),ok:1,id:g.ans},...g.dis.map(id=>({t:esc(L(id)),ok:0,id}))];}
    const uniq=[...new Map(opts.map(o=>[o.t,o])).values()];if(uniq.length<5)continue;g.opts=shuf(uniq.slice(0,5));return g;}
  return null;}
